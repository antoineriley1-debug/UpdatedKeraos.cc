// ---------- VOICE / CONVERSATION ENGINE ----------
// Two layers:
//   - Voice (low-level): wraps SpeechRecognition + speechSynthesis APIs
//   - Convo (high-level): runs the conversation loop with silence detection,
//     auto-restart, and interrupt handling.
const Voice = {
  rec: null,
  startedAt: 0,

  start({ onPartial, onFinal, onError, onEnd }) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      alert("Voice not supported. Use Chrome, Edge, or Safari.");
      return false;
    }
    this.stop();
    const rec = new SR();
    rec.continuous = true;        // keep listening even with pauses
    rec.interimResults = true;
    rec.lang = "en-US";
    rec.maxAlternatives = 1;
    let finalText = "";
    rec.onresult = (e) => {
      let interim = "";
      let gotFinal = false;
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) { finalText += r[0].transcript; gotFinal = true; }
        else interim += r[0].transcript;
      }
      if (onPartial) onPartial(finalText + interim);
      if (gotFinal && onFinal) onFinal(finalText);
    };
    rec.onerror = (e) => {
      if (e.error === "no-speech" || e.error === "aborted") return;
      if (onError) onError(e.error);
    };
    rec.onend = () => {
      this.rec = null;
      if (onEnd) onEnd(finalText);
    };
    try {
      rec.start();
      this.rec = rec;
      this.startedAt = Date.now();
      return true;
    } catch (err) {
      // Some browsers throw if start() called too quickly after stop()
      console.warn("Voice start failed:", err);
      return false;
    }
  },

  stop() {
    if (this.rec) {
      try { this.rec.stop(); } catch {}
      this.rec = null;
    }
  },

  // TTS — accept onStart and onEnd so caller can sync UI
  speak(text, { onStart, onEnd } = {}) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    // Pick a natural-sounding female voice for Kera if available.
    // Order: high-quality female voices first, then any en-US female, then any en-US.
    const voices = window.speechSynthesis.getVoices();
    const isFemaleish = (v) => /aria|samantha|jenny|natasha|google us english(?! male)|female|allison|ava|emma|joanna|salli|kendra|kimberly|kate|serena|veena|tessa|moira/i.test(v.name);
    const preferred = voices.find(v => v.lang.startsWith("en") && /Microsoft Aria/i.test(v.name))
                   || voices.find(v => v.lang.startsWith("en") && /Samantha/i.test(v.name))
                   || voices.find(v => v.lang.startsWith("en") && /Google US English/i.test(v.name) && !/male/i.test(v.name))
                   || voices.find(v => v.lang.startsWith("en") && !v.localService && isFemaleish(v))
                   || voices.find(v => v.lang.startsWith("en") && isFemaleish(v))
                   || voices.find(v => v.lang === "en-US" && !v.localService)
                   || voices.find(v => v.lang === "en-US");
    const u = new SpeechSynthesisUtterance(text);
    if (preferred) u.voice = preferred;
    u.rate = 1.05;
    u.pitch = 1.0;
    u.volume = 1.0;
    if (onStart) u.onstart = onStart;
    if (onEnd) u.onend = onEnd;
    u.onerror = onEnd; // treat error as end so loop continues
    window.speechSynthesis.speak(u);
  },

  stopSpeaking() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  },

  isSpeaking() {
    return window.speechSynthesis ? window.speechSynthesis.speaking : false;
  },
};

// Conversation engine — runs the whole hands-free loop.
// States: idle | listening | thinking | speaking
const Convo = {
  state: "idle",
  active: false,             // master toggle
  silenceTimer: null,
  silenceMs: 1400,           // how long to wait after last speech before submitting
  lastTranscript: "",
  callbacks: {},

  setCallbacks(cb) { this.callbacks = cb; },

  setState(s) {
    this.state = s;
    if (this.callbacks.onState) this.callbacks.onState(s);
  },

  // Begin hands-free conversation mode
  start() {
    this.active = true;
    this.beginListening();
  },

  // End hands-free mode entirely
  stop() {
    this.active = false;
    this.clearSilence();
    Voice.stop();
    Voice.stopSpeaking();
    this.setState("idle");
  },

  // User tapped to interrupt mid-conversation
  interrupt() {
    if (this.state === "speaking") {
      Voice.stopSpeaking();
      if (this.active) this.beginListening();
      else this.setState("idle");
    } else if (this.state === "listening") {
      // Manual stop — submit whatever we have
      this.submitCurrent();
    }
  },

  beginListening() {
    if (!this.active) return;
    this.lastTranscript = "";
    this.clearSilence();
    this.setState("listening");
    Voice.start({
      onPartial: (t) => {
        this.lastTranscript = t;
        if (this.callbacks.onPartial) this.callbacks.onPartial(t);
        // Each time speech is detected, restart the silence timer
        this.scheduleSilenceSubmit();
      },
      onFinal: (t) => {
        // Final chunk arrived — let silence timer keep running in case more speech comes
        this.lastTranscript = t;
        if (this.callbacks.onPartial) this.callbacks.onPartial(t);
        this.scheduleSilenceSubmit();
      },
      onError: (err) => {
        // Most errors mean we should just restart
        if (this.active && this.state === "listening") {
          setTimeout(() => { if (this.active && this.state === "listening") this.beginListening(); }, 300);
        }
      },
      onEnd: () => {
        // Recognition ended (either we stopped it or browser timed out)
        // If we still have an unsent transcript and we're active, submit it
        if (this.active && this.state === "listening") {
          const text = this.lastTranscript.trim();
          if (text) this.submitTranscript(text);
          else {
            // Restart listening
            setTimeout(() => { if (this.active && this.state === "listening") this.beginListening(); }, 200);
          }
        }
      },
    });
  },

  scheduleSilenceSubmit() {
    this.clearSilence();
    this.silenceTimer = setTimeout(() => this.submitCurrent(), this.silenceMs);
  },

  clearSilence() {
    if (this.silenceTimer) {
      clearTimeout(this.silenceTimer);
      this.silenceTimer = null;
    }
  },

  submitCurrent() {
    this.clearSilence();
    const text = this.lastTranscript.trim();
    Voice.stop();
    if (!text) {
      // Nothing to send — restart listening if still active
      if (this.active) setTimeout(() => { if (this.active) this.beginListening(); }, 200);
      return;
    }
    this.submitTranscript(text);
  },

  submitTranscript(text) {
    this.setState("thinking");
    this.lastTranscript = "";
    if (this.callbacks.onSubmit) this.callbacks.onSubmit(text);
  },

  // Called by Terminal once it has Claude's reply
  speakReply(text) {
    if (!text) {
      if (this.active) this.beginListening();
      else this.setState("idle");
      return;
    }
    this.setState("speaking");
    Voice.speak(text, {
      onEnd: () => {
        if (this.active) {
          // small delay so the user doesn't hear their own breath in the mic
          setTimeout(() => { if (this.active) this.beginListening(); }, 250);
        } else {
          this.setState("idle");
        }
      },
    });
  },

  // Called by Terminal if Claude failed
  handleError() {
    if (this.active) this.beginListening();
    else this.setState("idle");
  },
};

// Pre-load voices (Chrome lazy-loads them)
if (typeof window !== "undefined" && window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

// ---------- MEMORY VIEW ----------
const MemoryView = () => {
  const [memories, setMemories] = useState(() => LS.get("memories", []));
  const [draft, setDraft] = useState("");
  const [dragActive, setDragActive] = useState(false);
  const [uploadError, setUploadError] = useState("");
  // Pending upload state — when a file is dropped, ask the user how to add it.
  // pending = { filename, text } if a decision is needed; null otherwise.
  const [pendingUpload, setPendingUpload] = useState(null);
  const dropZoneRef = useRef(null);
  const persist = (next) => { setMemories(next); LS.set("memories", next); };
  const add = () => {
    const t = draft.trim();
    if (!t) return;
    persist([{ id: Date.now(), text: t, pinned: false, createdAt: Date.now() }, ...memories]);
    setDraft("");
  };
  const remove = (id) => persist(memories.filter(m => m.id !== id));
  const togglePin = (id) => persist(memories.map(m => m.id === id ? { ...m, pinned: !m.pinned } : m));

  // Memory upload — accepts plain-text formats only. Images and PDFs are rejected
  // with a clear message; vision content doesn't belong in long-term memory anyway.
  const TEXT_RE = /\.(txt|md|markdown|eml|msg|csv|json|log|html|rtf)$/i;
  const ingestFile = (file) => {
    setUploadError("");
    if (!file) return;
    const name = file.name || "memory-upload";
    if (/\.(pdf|png|jpe?g|gif|webp|heic|mp4|mov)$/i.test(name)) {
      setUploadError(name + " — binary file types aren't supported for memory. Use Notes for documents that need vision or PDF parsing.");
      return;
    }
    if (!TEXT_RE.test(name) && !(file.type && file.type.startsWith("text/"))) {
      setUploadError(name + " — unsupported file type. Use .txt, .md, .eml, .csv, .json, .log, or .html.");
      return;
    }
    if (file.size > 1_000_000) {
      setUploadError(name + " — file too large (" + Math.round(file.size / 1024) + "KB). Memory entries should stay under 1MB. Use Notes for large reference docs.");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const text = String(reader.result || "").trim();
      if (!text) { setUploadError(name + " — file is empty."); return; }
      // Offer the user a choice via the pendingUpload modal.
      setPendingUpload({ filename: name, text });
    };
    reader.onerror = () => setUploadError("Couldn't read " + name);
    reader.readAsText(file);
  };

  // After the user picks how to import, actually add to memories.
  // mode === "single" → one memory entry containing the whole file body.
  // mode === "lines"  → split into atomic memories (one per non-empty line).
  // mode === "sections" → split on Markdown headings (## or ---) into one memory per section.
  const commitPending = (mode) => {
    if (!pendingUpload) return;
    const ts = Date.now();
    const entries = [];
    if (mode === "single") {
      entries.push({ id: ts, text: pendingUpload.text, pinned: false, createdAt: ts, source: pendingUpload.filename });
    } else if (mode === "lines") {
      const lines = pendingUpload.text
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(l => l && !l.startsWith("#") && !/^[-*=]{3,}$/.test(l));
      lines.forEach((line, i) => {
        entries.push({ id: ts + i, text: line, pinned: false, createdAt: ts + i, source: pendingUpload.filename });
      });
    } else if (mode === "sections") {
      // Split on Markdown headings. A "section" = heading line + content until the next heading.
      const raw = pendingUpload.text;
      const parts = raw.split(/^(#{1,6}\s+.+)$/m);
      // After splitting on a capturing regex, every other element is the heading.
      const sections = [];
      for (let i = 1; i < parts.length; i += 2) {
        const heading = parts[i].trim();
        const body = (parts[i + 1] || "").trim();
        if (heading || body) sections.push((heading + "\n" + body).trim());
      }
      // If no headings were found, fall back to splitting on horizontal rules / blank-line clusters.
      if (sections.length === 0) {
        const fallback = raw.split(/\n{2,}/).map(s => s.trim()).filter(Boolean);
        fallback.forEach(s => sections.push(s));
      }
      sections.forEach((s, i) => entries.push({ id: ts + i, text: s, pinned: false, createdAt: ts + i, source: pendingUpload.filename }));
    }
    if (entries.length === 0) {
      setUploadError("Nothing to add — file produced no usable memory entries.");
      setPendingUpload(null);
      return;
    }
    persist([...entries, ...memories]);
    setPendingUpload(null);
  };

  // Drag handlers
  const onDragOver = (e) => { e.preventDefault(); e.stopPropagation(); setDragActive(true); };
  const onDragLeave = (e) => {
    e.preventDefault(); e.stopPropagation();
    // Only deactivate when actually leaving the drop zone, not when crossing a child element
    if (e.currentTarget === e.target) setDragActive(false);
  };
  const onDrop = (e) => {
    e.preventDefault(); e.stopPropagation();
    setDragActive(false);
    const files = Array.from(e.dataTransfer?.files || []);
    if (files.length === 0) return;
    // Memory uploads handle one file at a time so the per-file ingest dialog
    // doesn't pile up. If the user dropped multiple, process the first and
    // tell them about the others.
    if (files.length > 1) {
      setUploadError("Multiple files dropped — only processing the first (" + files[0].name + "). Drop one at a time for more control.");
    }
    ingestFile(files[0]);
  };

  return (
    <div style={{ padding: 22 }}>
      <div style={{ marginBottom: 20 }}>
        <div style={{ fontFamily: FF.mono, fontSize: 10, letterSpacing: 2.4, color: T.brass, textTransform: "uppercase" }}>Long-Term Memory</div>
        <h1 style={{ fontFamily: FF.display, fontSize: 28, fontWeight: 500, color: T.text, margin: "4px 0 0", fontStyle: "italic", letterSpacing: -0.5 }}>Things EXEC-OS will remember.</h1>
        <div style={{ fontFamily: FF.body, fontSize: 13, color: T.textDim, marginTop: 6, lineHeight: 1.5, maxWidth: 720 }}>
          Anything here gets injected into every conversation as context. Use it for facts you don't want to repeat: vendor preferences, naming conventions, recurring contacts, project context, your writing style.
        </div>
      </div>

      {/* Drop zone — also serves as the click-to-upload affordance */}
      <div
        ref={dropZoneRef}
        onDragOver={onDragOver}
        onDragEnter={onDragOver}
        onDragLeave={onDragLeave}
        onDrop={onDrop}
        style={{
          marginBottom: 16,
          background: dragActive ? T.cyan + "22" : T.bgSunken,
          border: "1px dashed " + (dragActive ? T.cyan : T.border),
          borderRadius: 2,
          padding: "16px 18px",
          display: "flex",
          alignItems: "center",
          gap: 14,
          flexWrap: "wrap",
          transition: "background 0.15s, border-color 0.15s",
        }}
      >
        <div style={{ flex: "1 1 280px", minWidth: 200 }}>
          <div style={{ fontFamily: FF.mono, fontSize: 11, color: dragActive ? T.cyan : T.textDim, letterSpacing: 1.4, marginBottom: 4 }}>
            {dragActive ? "DROP TO IMPORT" : "DRAG & DROP A FILE TO IMPORT MEMORIES"}
          </div>
          <div style={{ color: T.textFaint, fontFamily: FF.mono, fontSize: 10, letterSpacing: 0.5, lineHeight: 1.5 }}>
            Plain-text formats: .txt .md .eml .csv .json .log .html · max 1MB · drop a memory dump and pick how to import it
          </div>
        </div>
        <label style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "8px 14px", background: T.bgRaised, border: "1px solid " + T.border, borderRadius: 2, cursor: "pointer", color: T.text, fontFamily: FF.mono, fontSize: 11, letterSpacing: 1.2 }}>
          <Icon name="file" size={12} />
          BROWSE
          <input
            type="file"
            accept=".txt,.md,.markdown,.eml,.msg,.csv,.json,.log,.html,.rtf,text/*"
            onChange={e => { ingestFile(e.target.files?.[0]); e.target.value = ""; }}
            style={{ display: "none" }}
          />
        </label>
      </div>
      {uploadError && (
        <div style={{ background: T.red + "11", border: "1px solid " + T.red + "33", color: T.red, padding: "10px 14px", borderRadius: 2, fontFamily: FF.mono, fontSize: 11, marginBottom: 14 }}>
          {uploadError}
        </div>
      )}

      <Panel title="Add Memory">
        {/* Paste / Clear controls — quick clipboard access for memory entries */}
        <div style={{ display: "flex", gap: 6, marginBottom: 8, flexWrap: "wrap" }}>
          <PasteButton onPaste={(t) => setDraft(draft ? draft + "\n\n" + t : t)} label="Paste" />
          {draft && (
            <button onClick={() => setDraft("")} title="Clear draft" style={{
              background: "transparent", color: T.textFaint, border: "1px solid " + T.borderFaint,
              fontFamily: FF.mono, fontSize: 10, letterSpacing: 1.2, textTransform: "uppercase",
              padding: "5px 10px", borderRadius: 2, cursor: "pointer",
            }}>Clear</button>
          )}
        </div>
        <textarea value={draft} onChange={e => setDraft(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) add(); }}
          placeholder="e.g. When drafting to Chris Castle, always lead with operational risk before context."
          rows={3}
          style={{ width: "100%", background: T.bgSunken, border: "1px solid " + T.border, color: T.text, fontFamily: FF.body, fontSize: 13.5, padding: 14, borderRadius: 2, resize: "vertical", lineHeight: 1.5 }} />
        <div style={{ marginTop: 12, display: "flex", justifyContent: "flex-end" }}>
          <Btn icon="check" variant="primary" onClick={add} disabled={!draft.trim()}>Remember</Btn>
        </div>
      </Panel>

      <div style={{ marginTop: 16 }}>
        <Panel title={"Stored Memories — " + memories.length}>
          {memories.length === 0 ? (
            <div style={{ fontFamily: FF.mono, fontSize: 11, color: T.textFaint, padding: "30px 0", textAlign: "center", letterSpacing: 1.2 }}>NOTHING REMEMBERED YET</div>
          ) : memories.map((m, i) => (
            <div key={m.id} style={{ display: "flex", gap: 12, padding: "12px 0", borderBottom: i < memories.length - 1 ? "1px solid " + T.border : "none", alignItems: "flex-start" }}>
              <button onClick={() => togglePin(m.id)} title={m.pinned ? "Unpin" : "Pin"}
                style={{ background: "transparent", border: "none", color: m.pinned ? T.brass : T.textFaint, cursor: "pointer", padding: "2px 4px", fontSize: 14, lineHeight: 1 }}>
                {m.pinned ? "★" : "☆"}
              </button>
              <div style={{ flex: 1, fontFamily: FF.body, fontSize: 13.5, color: T.text, lineHeight: 1.55, whiteSpace: "pre-wrap" }}>
                {m.text}
                {m.source && (
                  <div style={{ fontFamily: FF.mono, fontSize: 9, color: T.textFaint, letterSpacing: 1, marginTop: 4 }}>SOURCE: {m.source}</div>
                )}
              </div>
              <div style={{ fontFamily: FF.mono, fontSize: 9, color: T.textFaint, letterSpacing: 0.6, marginTop: 2 }}>
                {new Date(m.createdAt).toLocaleDateString()}
              </div>
              <button onClick={() => remove(m.id)} title="Delete"
                style={{ background: "transparent", border: "none", color: T.textFaint, cursor: "pointer", padding: "0 4px", fontSize: 16, lineHeight: 1 }}
                onMouseEnter={e => e.currentTarget.style.color = T.red}
                onMouseLeave={e => e.currentTarget.style.color = T.textFaint}>
                ×
              </button>
            </div>
          ))}
        </Panel>
      </div>

      {/* Import-mode dialog. Shown after a file is read so the user can pick
          how memories get split. Backdrop click cancels without importing. */}
      {pendingUpload && (
        <>
          <div onClick={() => setPendingUpload(null)}
            style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.55)", zIndex: 90 }} />
          <div style={{
            position: "fixed", top: "50%", left: "50%", transform: "translate(-50%, -50%)",
            width: "min(560px, 92vw)", maxHeight: "85vh", overflowY: "auto",
            background: T.bgRaised, border: "1px solid " + T.border, borderRadius: 2,
            boxShadow: "0 12px 40px rgba(0,0,0,0.6)", zIndex: 91,
            padding: "22px 24px",
          }}>
            <div style={{ fontFamily: FF.mono, fontSize: 10, color: T.brass, letterSpacing: 1.6, marginBottom: 6 }}>IMPORT MEMORY</div>
            <div style={{ ...TS.h3, color: T.text, marginBottom: 4 }}>{pendingUpload.filename}</div>
            <div style={{ color: T.textDim, fontFamily: FF.mono, fontSize: 11, marginBottom: 18 }}>
              {pendingUpload.text.length.toLocaleString()} chars · how would you like this stored?
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <button onClick={() => commitPending("single")}
                style={{ textAlign: "left", padding: "12px 14px", background: T.bgSunken, border: "1px solid " + T.borderFaint, borderRadius: 2, cursor: "pointer", color: T.text }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = T.cyan; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = T.borderFaint; }}>
                <div style={{ fontFamily: FF.body, fontSize: 14, fontWeight: 500, color: T.text, marginBottom: 2 }}>Single memory</div>
                <div style={{ fontFamily: FF.mono, fontSize: 11, color: T.textDim, lineHeight: 1.5 }}>Add the whole file as one entry. Best for memory dumps, profiles, or briefs.</div>
              </button>
              <button onClick={() => commitPending("sections")}
                style={{ textAlign: "left", padding: "12px 14px", background: T.bgSunken, border: "1px solid " + T.borderFaint, borderRadius: 2, cursor: "pointer", color: T.text }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = T.cyan; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = T.borderFaint; }}>
                <div style={{ fontFamily: FF.body, fontSize: 14, fontWeight: 500, color: T.text, marginBottom: 2 }}>Split by section</div>
                <div style={{ fontFamily: FF.mono, fontSize: 11, color: T.textDim, lineHeight: 1.5 }}>One memory per Markdown heading (##, ###). Best for structured docs with named sections.</div>
              </button>
              <button onClick={() => commitPending("lines")}
                style={{ textAlign: "left", padding: "12px 14px", background: T.bgSunken, border: "1px solid " + T.borderFaint, borderRadius: 2, cursor: "pointer", color: T.text }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = T.cyan; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = T.borderFaint; }}>
                <div style={{ fontFamily: FF.body, fontSize: 14, fontWeight: 500, color: T.text, marginBottom: 2 }}>One per line</div>
                <div style={{ fontFamily: FF.mono, fontSize: 11, color: T.textDim, lineHeight: 1.5 }}>Each non-empty line becomes a separate memory. Best for atomic memory lists (rules, facts, preferences).</div>
              </button>
            </div>

            <div style={{ marginTop: 18, display: "flex", justifyContent: "flex-end" }}>
              <button onClick={() => setPendingUpload(null)}
                style={{ background: "transparent", border: "1px solid " + T.border, color: T.textDim, padding: "8px 16px", borderRadius: 2,
