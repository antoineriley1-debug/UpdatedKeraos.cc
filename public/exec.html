      return (e.title || "").toLowerCase().includes(q)
        || (e.notes || "").toLowerCase().includes(q)
        || (e.location || "").toLowerCase().includes(q);
    }
    return true;
  });

  const handleSave = (event) => {
    if (event.id) persist(events.map(e => e.id === event.id ? event : e));
    else persist([...events, { ...event, id: calUid() }]);
    setModal(null);
  };
  const handleDelete = (id) => { persist(events.filter(e => e.id !== id)); setModal(null); };

  const today = calStartOfDay(new Date());
  const upcomingCount = filtered.filter(e => new Date(e.date + "T00:00:00").getTime() >= today.getTime()).length;

  const titleStr = calView === "month"
    ? `${CAL_MONTHS[viewDate.getMonth()]} ${viewDate.getFullYear()}`
    : calView === "week"
      ? (() => { const ws = calStartOfWeek(viewDate); const we = calAddDays(ws, 6);
          return `${CAL_MONTHS[ws.getMonth()].slice(0,3)} ${ws.getDate()} — ${CAL_MONTHS[we.getMonth()].slice(0,3)} ${we.getDate()}, ${we.getFullYear()}`; })()
      : (() => {
          const today = calStartOfDay(new Date());
          if (calSameDay(viewDate, today)) return "Agenda — From Today";
          return `Agenda — From ${CAL_MONTHS[viewDate.getMonth()].slice(0,3)} ${viewDate.getDate()}, ${viewDate.getFullYear()}`;
        })();

  return (
    <div style={{ padding: 22, height: "100%", display: "flex", flexDirection: "column" }}>
      <div style={{ marginBottom: 16, display: "flex", justifyContent: "space-between", alignItems: "flex-end" }}>
        <div>
          <div style={{ fontFamily: FF.mono, fontSize: 10, letterSpacing: 2.4, color: T.brass, textTransform: "uppercase" }}>Operations // Planning</div>
          <h1 style={{ fontFamily: FF.display, fontSize: 28, fontWeight: 500, color: T.text, margin: "4px 0 0", fontStyle: "italic", letterSpacing: -0.5 }}>Where the next weeks go.</h1>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <Btn icon="plus" variant="primary" onClick={() => setModal({ mode: "new", date: viewDate })}>New Event</Btn>
        </div>
      </div>

      {/* TOOLBAR */}
      <div data-cal-toolbar style={{
        display: "flex", alignItems: "center", justifyContent: "space-between",
        marginBottom: 12, gap: S.lg, flexWrap: "wrap",
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: S.md }}>
          <Btn size="sm" onClick={() => setViewDate(calStartOfDay(new Date()))}>Today</Btn>
          <div style={{ display: "flex", gap: 2 }}>
            <Btn size="sm" onClick={() => setViewDate(calView === "month" ? calAddMonths(viewDate, -1) : calAddDays(viewDate, -7))}>‹</Btn>
            <Btn size="sm" onClick={() => setViewDate(calView === "month" ? calAddMonths(viewDate, 1) : calAddDays(viewDate, 7))}>›</Btn>
          </div>
          <div style={{ ...TS.h2, color: T.text, marginLeft: S.md, fontFamily: FF.display }}>{titleStr}</div>
        </div>
        <div data-cal-view-toggle style={{ display: "flex", gap: 2 }}>
          {["month", "week", "agenda"].map(v => (
            <button key={v} onClick={() => setCalView(v)} style={{
              padding: `${S.xs}px ${S.lg}px`, height: 26,
              background: calView === v ? T.surface : "transparent",
              color: calView === v ? T.text : T.textDim,
              border: "1px solid " + (calView === v ? T.borderBright : T.border),
              fontFamily: FF.mono, fontSize: 10, letterSpacing: 1, textTransform: "uppercase",
              fontWeight: 600, borderRadius: 3, cursor: "pointer",
            }}>{v}</button>
          ))}
        </div>
      </div>

      {/* FILTERS */}
      <div data-cal-filters style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr 1fr", gap: S.md, marginBottom: 12 }}>
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search title, notes, location…"
          style={{ background: T.bgSunken, border: "1px solid " + T.border, color: T.text,
            fontFamily: FF.body, fontSize: 13, padding: "8px 12px", borderRadius: 3 }} />
        <select value={filterCat} onChange={e => setFilterCat(e.target.value)}
          style={{ background: T.bgSunken, border: "1px solid " + T.border, color: T.text,
            fontFamily: FF.mono, fontSize: 12, padding: "8px 12px", borderRadius: 3 }}>
          <option value="all">All categories</option>
          {CAL_CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
        </select>
        <select value={filterSite} onChange={e => setFilterSite(e.target.value)}
          style={{ background: T.bgSunken, border: "1px solid " + T.border, color: T.text,
            fontFamily: FF.mono, fontSize: 12, padding: "8px 12px", borderRadius: 3 }}>
          <option value="all">All sites</option>
          {CAL_SITES.map(s => <option key={s.code} value={s.code}>{s.code} — {s.name}</option>)}
        </select>
      </div>

      {/* VIEW */}
      <div style={{ flex: 1, minHeight: 0, overflow: "auto" }}>
        {calView === "month" && <CalMonthView viewDate={viewDate} events={filtered} onDayClick={d => setModal({ mode: "new", date: d })} onEventClick={ev => setModal({ mode: "edit", event: ev })} />}
        {calView === "week"  && <CalWeekView  viewDate={viewDate} events={filtered} onDayClick={d => setModal({ mode: "new", date: d })} onEventClick={ev => setModal({ mode: "edit", event: ev })} />}
        {calView === "agenda" && <CalAgendaView viewDate={viewDate} events={filtered} onEventClick={ev => setModal({ mode: "edit", event: ev })} />}
      </div>

      {/* LEGEND */}
      <div style={{ marginTop: 12, display: "flex", alignItems: "center", gap: S.lg, flexWrap: "wrap",
        paddingTop: S.md, borderTop: "1px solid " + T.borderFaint }}>
        {CAL_CATEGORIES.map(c => (
          <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ width: 9, height: 9, borderRadius: 2, background: calCatColor(c) }} />
            <span style={{ ...TS.micro, color: T.textDim }}>{c.label}</span>
          </div>
        ))}
        <div style={{ marginLeft: "auto", ...TS.micro, fontFamily: FF.mono, color: T.textFaint }}>
          {events.length} events · {upcomingCount} upcoming
        </div>
      </div>

      {modal && <CalModal state={modal} onSave={handleSave} onDelete={handleDelete} onClose={() => setModal(null)} />}
    </div>
  );
};

const CalEventPill = ({ event, onClick }) => {
  const cat = calGetCategory(event.category);
  const c = calCatColor(cat);
  return (
    <div onClick={onClick} title={`${event.title}${event.startTime ? " · " + event.startTime : ""}`} style={{
      background: c + "1f", borderLeft: "2px solid " + c,
      padding: "2px 5px", fontSize: 10, color: T.text,
      whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
      borderRadius: 2, fontFamily: FF.mono, cursor: "pointer", marginBottom: 2,
    }}>
      {event.startTime && <span style={{ color: c, marginRight: 4 }}>{event.startTime}</span>}
      <span>{event.title}</span>
      {event.site && event.site !== "—" && <span style={{ color: T.textFaint, marginLeft: 4 }}>· {event.site}</span>}
    </div>
  );
};

const CalMonthView = ({ viewDate, events, onDayClick, onEventClick }) => {
  const first = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
  const start = calStartOfWeek(first);
  const cells = Array.from({ length: 42 }, (_, i) => calAddDays(start, i));
  const today = calStartOfDay(new Date());
  const currentMonth = viewDate.getMonth();
  const eventsByDay = {};
  events.forEach(e => { (eventsByDay[e.date] ||= []).push(e); });
  Object.keys(eventsByDay).forEach(k => eventsByDay[k].sort((a, b) => (a.startTime || "").localeCompare(b.startTime || "")));

  return (
    <div style={{ border: "1px solid " + T.border, borderRadius: 4, display: "flex", flexDirection: "column", height: "100%", minHeight: 480, background: T.bgRaised }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", borderBottom: "1px solid " + T.border, background: T.bgSunken }}>
        {CAL_DAYS.map(d => (
          <div key={d} style={{ padding: "8px 10px", ...TS.micro, color: T.textDim, textTransform: "uppercase", letterSpacing: 1.5, fontWeight: 600, fontFamily: FF.mono }}>{d}</div>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gridTemplateRows: "repeat(6,1fr)", flex: 1 }}>
        {cells.map((d, i) => {
          const inMonth = d.getMonth() === currentMonth;
          const isToday = calSameDay(d, today);
          const dayEvents = eventsByDay[calYmd(d)] || [];
          return (
            <div key={i} onClick={() => onDayClick(d)} style={{
              borderRight: (i % 7 < 6) ? "1px solid " + T.borderFaint : "none",
              borderBottom: (i < 35) ? "1px solid " + T.borderFaint : "none",
              padding: 6, cursor: "pointer", overflow: "hidden",
              background: inMonth ? T.bgRaised : T.bgSunken,
              opacity: inMonth ? 1 : 0.5,
              display: "flex", flexDirection: "column", gap: 3, minHeight: 0,
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{
                  fontFamily: FF.mono, fontSize: 11, fontWeight: isToday ? 700 : 500,
                  color: isToday ? "#fff" : T.text,
                  background: isToday ? T.accent : "transparent",
                  padding: isToday ? "1px 6px" : "1px 0", borderRadius: 2,
                }}>{d.getDate()}</span>
                {dayEvents.length > 3 && (
                  <span style={{ fontFamily: FF.mono, fontSize: 9, color: T.textFaint }}>+{dayEvents.length - 3}</span>
                )}
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 0, overflow: "hidden" }}>
                {dayEvents.slice(0, 3).map(ev => (
                  <CalEventPill key={ev.id} event={ev} onClick={(e) => { e.stopPropagation(); onEventClick(ev); }} />
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

const CalWeekView = ({ viewDate, events, onDayClick, onEventClick }) => {
  const ws = calStartOfWeek(viewDate);
  const days = Array.from({ length: 7 }, (_, i) => calAddDays(ws, i));
  const today = calStartOfDay(new Date());
  const hours = Array.from({ length: 14 }, (_, i) => i + 6);
  const eventsByDay = {};
  events.forEach(e => { (eventsByDay[e.date] ||= []).push(e); });

  return (
    <div style={{ border: "1px solid " + T.border, borderRadius: 4, background: T.bgRaised }}>
      <div style={{ display: "grid", gridTemplateColumns: "60px repeat(7,1fr)", background: T.bgSunken, borderBottom: "1px solid " + T.border }}>
        <div></div>
        {days.map((d, i) => {
          const isToday = calSameDay(d, today);
          return (
            <div key={i} onClick={() => onDayClick(d)} style={{ padding: "8px 10px", cursor: "pointer", borderLeft: "1px solid " + T.borderFaint }}>
              <div style={{ ...TS.micro, color: T.textDim, textTransform: "uppercase", letterSpacing: 1.5, fontFamily: FF.mono }}>{CAL_DAYS[d.getDay()]}</div>
              <div style={{ fontFamily: FF.mono, fontSize: 18, fontWeight: 600, color: isToday ? T.accent : T.text, marginTop: 2 }}>{d.getDate()}</div>
            </div>
          );
        })}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "60px repeat(7,1fr)" }}>
        {hours.map((h) => (
          <React.Fragment key={h}>
            <div style={{ padding: "6px 6px", fontFamily: FF.mono, fontSize: 10, color: T.textFaint, textAlign: "right",
              borderTop: "1px solid " + T.borderFaint, height: 56 }}>
              {String(h).padStart(2, "0")}:00
            </div>
            {days.map((d, di) => {
              const dayEvents = (eventsByDay[calYmd(d)] || []).filter(e => {
                if (!e.startTime) return h === 6;
                const eh = parseInt(e.startTime.slice(0, 2), 10);
                return eh === h;
              });
              return (
                <div key={di} onClick={() => onDayClick(d)} style={{
                  height: 56, borderLeft: "1px solid " + T.borderFaint,
                  borderTop: "1px solid " + T.borderFaint,
                  padding: 3, cursor: "pointer", overflow: "hidden",
                }}>
                  {dayEvents.map(ev => (
                    <CalEventPill key={ev.id} event={ev} onClick={(e) => { e.stopPropagation(); onEventClick(ev); }} />
                  ))}
                </div>
              );
            })}
          </React.Fragment>
        ))}
      </div>
    </div>
  );
};

const CalAgendaView = ({ viewDate, events, onEventClick }) => {
  const anchorDate = calStartOfDay(viewDate || new Date());
  const anchorYmd = calYmd(anchorDate);
  const today = calStartOfDay(new Date());
  const isToday = calSameDay(anchorDate, today);

  const sorted = [...events]
    .filter(e => e.date >= anchorYmd)
    .sort((a, b) => {
      if (a.date !== b.date) return a.date.localeCompare(b.date);
      return (a.startTime || "").localeCompare(b.startTime || "");
    });

  if (sorted.length === 0) {
    return (
      <div style={{ textAlign: "center", padding: 60, color: T.textFaint, fontFamily: FF.mono, fontSize: 12, border: "1px dashed " + T.border, borderRadius: 4 }}>
        No events from {isToday ? "today" : CAL_MONTHS[anchorDate.getMonth()] + " " + anchorDate.getDate()} onwards. {isToday ? "Click \"New Event\" to add one." : "Click Today to return."}
      </div>
    );
  }

  const grouped = sorted.reduce((acc, e) => { (acc[e.date] ||= []).push(e); return acc; }, {});

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      {Object.entries(grouped).map(([date, evs]) => {
        const dObj = new Date(date + "T00:00:00");
        return (
          <div key={date} style={{ border: "1px solid " + T.border, background: T.bgRaised, borderRadius: 4 }}>
            <div style={{ padding: "8px 14px", borderBottom: "1px solid " + T.borderFaint,
              fontFamily: FF.mono, fontSize: 11, color: T.brass, textTransform: "uppercase", letterSpacing: 1.5, fontWeight: 600 }}>
              {CAL_DAYS[dObj.getDay()]}, {CAL_MONTHS[dObj.getMonth()]} {dObj.getDate()}, {dObj.getFullYear()}
            </div>
            {evs.map((ev, i) => {
              const cat = calGetCategory(ev.category);
              const c = calCatColor(cat);
              return (
                <div key={ev.id} onClick={() => onEventClick(ev)} style={{
                  display: "flex", padding: "10px 14px", gap: 12, cursor: "pointer",
                  borderBottom: i < evs.length - 1 ? "1px solid " + T.borderFaint : "none",
                  alignItems: "center",
                }}>
                  <div style={{ fontFamily: FF.mono, fontSize: 11, color: T.textDim, width: 95, flexShrink: 0 }}>
                    {ev.startTime ? `${ev.startTime}${ev.endTime ? "–" + ev.endTime : ""}` : "All day"}
                  </div>
                  <div style={{ width: 3, alignSelf: "stretch", background: c, borderRadius: 2 }} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ ...TS.body, fontWeight: 500, color: T.text }}>{ev.title}</div>
                    {(ev.location || ev.notes) && (
                      <div style={{ ...TS.micro, color: T.textDim, marginTop: 3 }}>
                        {ev.location && <span>📍 {ev.location}</span>}
                        {ev.location && ev.notes && <span style={{ margin: "0 6px" }}>·</span>}
                        {ev.notes && <span>{ev.notes.length > 80 ? ev.notes.slice(0, 80) + "…" : ev.notes}</span>}
                      </div>
                    )}
                  </div>
                  <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                    <span style={{ padding: "2px 7px", background: c + "22", color: c, borderRadius: 2,
                      textTransform: "uppercase", letterSpacing: 0.6, fontFamily: FF.mono, fontSize: 9, fontWeight: 600 }}>{cat.label}</span>
                    {ev.site && ev.site !== "—" && (
                      <span style={{ padding: "2px 7px", background: T.surface, color: T.textDim, borderRadius: 2,
                        fontFamily: FF.mono, fontSize: 9, fontWeight: 600 }}>{ev.site}</span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
};

const CalModal = ({ state, onSave, onDelete, onClose }) => {
  const isEdit = state.mode === "edit";
  const initial = isEdit ? state.event : {
    title: "",
    date: calYmd(state.date || new Date()),
    startTime: "09:00",
    endTime: "10:00",
    category: "meeting",
    site: "—",
    location: "",
    notes: "",
  };
  const [form, setForm] = useState(initial);
  const titleRef = useRef(null);
  useEffect(() => { setTimeout(() => titleRef.current?.focus(), 50); }, []);
  // Close via Escape — match Settings/Palette behavior so all modals dismiss the same way
  useEffect(() => {
    const onEsc = () => onClose();
    window.addEventListener("execos:escape", onEsc);
    return () => window.removeEventListener("execos:escape", onEsc);
  }, [onClose]);
  const upd = (k, v) => setForm(prev => ({ ...prev, [k]: v }));
  const handleSubmit = () => {
    if (!form.title.trim()) { titleRef.current?.focus(); return; }
    onSave(form);
  };

  const fieldInput = {
    width: "100%", background: T.bgSunken, border: "1px solid " + T.border, color: T.text,
    fontFamily: FF.mono, fontSize: 12, padding: "7px 10px", borderRadius: 3,
  };
  const labelStyle = {
    fontFamily: FF.mono, fontSize: 10, color: T.textFaint,
    textTransform: "uppercase", letterSpacing: 1, fontWeight: 600, marginBottom: 4,
  };

  return (
    <div data-modal-backdrop onClick={onClose} style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", zIndex: 1000,
      display: "flex", alignItems: "center", justifyContent: "center",
      animation: "fadeIn 0.15s ease",
    }}>
      <div data-modal onClick={e => e.stopPropagation()} style={{
        background: T.bgRaised, border: "1px solid " + T.borderBright, borderRadius: 4,
        width: 500, maxWidth: "92vw", maxHeight: "90vh", overflow: "auto",
        padding: 22, display: "flex", flexDirection: "column", gap: 14,
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ ...TS.label, color: T.brass, textTransform: "uppercase", letterSpacing: 1.5, fontWeight: 700 }}>
            {isEdit ? "Edit Event" : "New Event"}
          </div>
          <button onClick={onClose} style={{
            background: "transparent", border: "1px solid " + T.border, color: T.textDim,
            width: 26, height: 26, padding: 0, borderRadius: 3, cursor: "pointer",
            display: "inline-flex", alignItems: "center", justifyContent: "center",
          }}>
            <Icon name="x" size={12} />
          </button>
        </div>

        <div>
          <div style={labelStyle}>Title</div>
          <input ref={titleRef} value={form.title} onChange={e => upd("title", e.target.value)}
            placeholder="e.g., MWHC AHU-6 valve walk-down" style={fieldInput} />
        </div>

        <div data-grid="3col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
          <div>
            <div style={labelStyle}>Date</div>
            <input type="date" value={form.date} onChange={e => upd("date", e.target.value)} style={fieldInput} />
          </div>
          <div>
            <div style={labelStyle}>Start</div>
            <input type="time" value={form.startTime} onChange={e => upd("startTime", e.target.value)} style={fieldInput} />
          </div>
          <div>
            <div style={labelStyle}>End</div>
            <input type="time" value={form.endTime} onChange={e => upd("endTime", e.target.value)} style={fieldInput} />
          </div>
        </div>

        <div data-grid="2col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <div>
            <div style={labelStyle}>Category</div>
            <select value={form.category} onChange={e => upd("category", e.target.value)} style={fieldInput}>
              {CAL_CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
            </select>
          </div>
          <div>
            <div style={labelStyle}>Site</div>
            <select value={form.site} onChange={e => upd("site", e.target.value)} style={fieldInput}>
              {CAL_SITES.map(s => <option key={s.code} value={s.code}>{s.code} — {s.name}</option>)}
            </select>
          </div>
        </div>

        <div>
          <div style={labelStyle}>Location (optional)</div>
          <input value={form.location} onChange={e => upd("location", e.target.value)}
            placeholder="e.g., Mechanical Room 4H2A" style={fieldInput} />
        </div>

        <div>
          <div style={labelStyle}>Notes</div>
          <textarea value={form.notes} onChange={e => upd("notes", e.target.value)} rows={4}
            placeholder="Details, attendees, action items…"
            style={{ ...fieldInput, minHeight: 80, resize: "vertical", fontFamily: FF.body }} />
        </div>

        <div style={{ display: "flex", justifyContent: "space-between", gap: 8, marginTop: 6 }}>
          {isEdit ? (
            <Btn icon="trash" variant="danger" onClick={() => onDelete(form.id)}>Delete</Btn>
          ) : <div />}
          <div style={{ display: "flex", gap: 8 }}>
            <Btn onClick={onClose}>Cancel</Btn>
            <Btn icon="check" variant="primary" onClick={handleSubmit}>{isEdit ? "Save" : "Create"}</Btn>
          </div>
        </div>
      </div>
    </div>
  );
};

// ---------- AUDIT VIEW ----------
const AuditView = ({ initialFilter = "all" }) => {
  const [log, setLog] = useState(() => LS.get("audit_log", []));
  const [filter, setFilter] = useState(() => {
    // One-shot filter passed via LS from Dashboard's Errors row click
    const oneShot = LS.get("audit_filter_oneshot", "");
    if (oneShot) {
      try { localStorage.removeItem("execos:audit_filter_oneshot"); } catch {}
      return oneShot;
    }
    return initialFilter;
  });
  const [expanded, setExpanded] = useState(new Set());
  const clear = () => { LS.set("audit_log", []); setLog([]); };

  const filtered = useMemo(() => {
    if (filter === "errors") return log.filter(e => e.status === "error");
    if (filter === "ok") return log.filter(e => e.status === "ok");
    return log;
  }, [log, filter]);

  const errorCount = log.filter(e => e.status === "error").length;
  const okCount = log.filter(e => e.status === "ok").length;

  const toggleExpand = (i) => {
    const next = new Set(expanded);
    if (next.has(i)) next.delete(i); else next.add(i);
    setExpanded(next);
  };

  const tabBtn = (id, label, count, color) => (
    <button onClick={() => setFilter(id)} style={{
      padding: "6px 12px", background: filter === id ? (color || T.brass) + "22" : "transparent",
      border: "1px solid " + (filter === id ? (color || T.brass) : T.border),
      color: filter === id ? (color || T.brass) : T.textDim,
      fontFamily: FF.mono, fontSize: 10, letterSpacing: 1.4, textTransform: "uppercase",
      cursor: "pointer", borderRadius: 2,
    }}>{label} {count}</button>
  );

  return (
    <div style={{ padding: 22 }}>
      <div style={{ marginBottom: 16, display: "flex", justifyContent: "space-between", alignItems: "flex-end" }}>
        <div>
          <div style={{ fontFamily: FF.mono, fontSize: 10, letterSpacing: 2.4, color: T.brass, textTransform: "uppercase" }}>Audit Log</div>
          <h1 style={{ fontFamily: FF.display, fontSize: 28, fontWeight: 500, color: T.text, margin: "4px 0 0", fontStyle: "italic", letterSpacing: -0.5 }}>Every AI action, on the record.</h1>
        </div>
        {log.length > 0 && <Btn variant="danger" icon="trash" onClick={clear} size="sm">Clear Log</Btn>}
      </div>

      {/* Filter tabs */}
      <div style={{ marginBottom: 12, display: "flex", gap: 6, flexWrap: "wrap" }}>
        {tabBtn("all", "All", log.length)}
        {tabBtn("errors", "Errors", errorCount, T.red)}
        {tabBtn("ok", "Success", okCount, T.green)}
      </div>

      <Panel title={"Entries — " + filtered.length + (filter !== "all" ? " (filtered)" : "")}>
        {filtered.length === 0 ? (
          <div style={{ fontFamily: FF.mono, fontSize: 11, color: T.textFaint, padding: "30px 0", textAlign: "center", letterSpacing: 1 }}>
            {filter === "errors" ? "NO ERRORS — KERA HEALTHY" : filter === "ok" ? "NO SUCCESSFUL CALLS YET" : "NO ACTIVITY YET"}
          </div>
        ) : (
          <div style={{ maxHeight: 600, overflowY: "auto" }}>
            {filtered.map((e, i) => {
              const isErr = e.status === "error";
              const isOpen = expanded.has(i);
              return (
                <div key={i} style={{ padding: "12px 0", borderBottom: i < filtered.length - 1 ? "1px solid " + T.border : "none", background: isErr ? T.red + "08" : "transparent" }}>
                  <div onClick={() => toggleExpand(i)} style={{ cursor: "pointer", display: "flex", gap: 10, alignItems: "center", fontFamily: FF.mono, fontSize: 10, letterSpacing: 0.6 }}>
                    <span style={{ color: T.textFaint }}>{new Date(e.ts).toLocaleString()}</span>
                    <span style={{ color: T.brass, textTransform: "uppercase", letterSpacing: 1.4 }}>{e.source}</span>
                    <span style={{ color: isErr ? T.red : T.green, textTransform: "uppercase", letterSpacing: 1.4 }}>{e.status}</span>
                    <span style={{ color: T.textDim }}>{e.model}</span>
                    {e.ms && <span style={{ color: T.textDim }}>{(e.ms / 1000).toFixed(1)}s</span>}
                    {e.replyLen && <span style={{ color: T.textDim }}>{e.replyLen} chars out</span>}
                    <span style={{ marginLeft: "auto", color: T.textFaint }}>{isOpen ? "▾" : "▸"}</span>
                  </div>
                  <div style={{ fontFamily: FF.body, fontSize: 12.5, color: T.text, marginTop: 4, lineHeight: 1.5, overflow: isOpen ? "visible" : "hidden", textOverflow: "ellipsis", whiteSpace: isOpen ? "pre-wrap" : "nowrap" }}>{e.prompt}</div>
                  {e.error && (
                    <div style={{ fontFamily: FF.mono, fontSize: 11, color: T.red, marginTop: 6, padding: "8px 12px", background: T.red + "12", border: "1px solid " + T.red + "44", borderRadius: 2, lineHeight: 1.5, wordBreak: "break-word" }}>
                      <div style={{ fontSize: 9, letterSpacing: 1.4, marginBottom: 4, opacity: 0.7 }}>ERROR DETAIL</div>
                      {e.error}
                    </div>
                  )}
                  {isOpen && e.inputTokens !== undefined && (
                    <div style={{ marginTop: 6, fontFamily: FF.mono, fontSize: 10, color: T.textFaint, letterSpacing: 0.6 }}>
                      Tokens: {e.inputTokens} in · {e.outputTokens} out{e.cacheRead ? " · " + e.cacheRead + " cached" : ""}{e.cacheCreate ? " · " + e.cacheCreate + " written" : ""}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </Panel>
    </div>
  );
};

// ---------- LOCK SCREEN (password protection) ----------
// Password is stored as a SHA-256 hash in localStorage — never the raw password.
// On every page load, if a hash exists, the lock screen blocks access until the
// user types the matching password. Workspace key in Cloud Sync handles
// cross-device security separately.

async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
}

const LockScreen = ({ onUnlock }) => {
  const [mode, setMode] = useState(() => LS.get("lock_hash", null) ? "unlock" : "setup");
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => { inputRef.current?.focus(); }, [mode]);

  const handleSetup = async () => {
    setErr("");
    if (pw.length < 6) { setErr("Password must be at least 6 characters."); return; }
    if (pw !== pw2) { setErr("Passwords don't match."); return; }
    setBusy(true);
    try {
      const hash = await sha256(pw);
      LS.set("lock_hash", hash);
      sessionStorage.setItem("execos:unlocked", "1");
      onUnlock();
    } catch (e) {
      setErr("Couldn't save password: " + e.message);
    } finally { setBusy(false); }
  };

  const handleUnlock = async () => {
    setErr("");
    setBusy(true);
    try {
      const hash = await sha256(pw);
      const stored = LS.get("lock_hash", null);
      if (hash === stored) {
        sessionStorage.setItem("execos:unlocked", "1");
        onUnlock();
      } else {
        setErr("Incorrect password.");
        setPw("");
        inputRef.current?.focus();
      }
    } catch (e) {
      setErr("Couldn't verify: " + e.message);
    } finally { setBusy(false); }
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (mode === "setup") handleSetup();
    else handleUnlock();
  };

  return (
    <div style={{
      height: "100vh", width: "100vw",
      background: T.bg,
      display: "flex", alignItems: "center", justifyContent: "center",
      padding: S.xl,
    }}>
      <div style={{
        width: "100%", maxWidth: 400,
        background: T.bgRaised,
        border: "1px solid " + T.border,
        borderRadius: 6,
        padding: `${S.xxxl}px ${S.xxl}px`,
        boxShadow: "0 20px 60px rgba(0,0,0,0.4)",
      }}>
        {/* Brand */}
        <div style={{ display: "flex", alignItems: "center", gap: S.md, justifyContent: "center", marginBottom: S.xxl }}>
          <div style={{
            width: 36, height: 36,
            background: T.accent,
            display: "flex", alignItems: "center", justifyContent: "center",
            borderRadius: 4,
          }}>
            <span style={{ fontFamily: FF.body, fontSize: 18, fontWeight: 700, color: "#fff", letterSpacing: -0.4 }}>E</span>
          </div>
          <div>
            <div style={{ ...TS.h3, color: T.text, letterSpacing: 0.4 }}>EXEC-OS</div>
            <div style={{ ...TS.micro, color: T.textFaint, fontFamily: FF.mono }}>Antoine Riley Sr.</div>
          </div>
        </div>

        <div style={{ marginBottom: S.xl, textAlign: "center" }}>
          <div style={{ ...TS.label, color: T.textDim, textTransform: "uppercase", marginBottom: S.xs }}>
            {mode === "setup" ? "First-time setup" : "Sign in"}
          </div>
          <div style={{ ...TS.body, color: T.text }}>
            {mode === "setup" ? "Set a password to protect your workspace" : "Enter your password to continue"}
          </div>
        </div>

        <form onSubmit={handleSubmit}>
          <div style={{ marginBottom: S.lg }}>
            <div style={{ ...TS.micro, color: T.textDim, fontFamily: FF.mono, textTransform: "uppercase", marginBottom: S.xs }}>
              Password
            </div>
            <input
              ref={inputRef}
              type="password"
              value={pw}
              onChange={e => setPw(e.target.value)}
              autoComplete={mode === "setup" ? "new-password" : "current-password"}
              style={{
                width: "100%", boxSizing: "border-box",
                background: T.bgSunken, border: "1px solid " + T.border,
                color: T.text, fontFamily: FF.body, fontSize: 14,
                padding: `${S.md}px ${S.lg}px`, borderRadius: 4, height: 40,
              }}
            />
          </div>

          {mode === "setup" && (
            <div style={{ marginBottom: S.lg }}>
              <div style={{ ...TS.micro, color: T.textDim, fontFamily: FF.mono, textTransform: "uppercase", marginBottom: S.xs }}>
                Confirm Password
              </div>
              <input
                type="password"
                value={pw2}
                onChange={e => setPw2(e.target.value)}
                autoComplete="new-password"
                style={{
                  width: "100%", boxSizing: "border-box",
                  background: T.bgSunken, border: "1px solid " + T.border,
                  color: T.text, fontFamily: FF.body, fontSize: 14,
                  padding: `${S.md}px ${S.lg}px`, borderRadius: 4, height: 40,
                }}
              />
            </div>
          )}

          {err && (
            <div style={{
              padding: `${S.md}px ${S.lg}px`, marginBottom: S.lg,
              background: T.red + "15", border: "1px solid " + T.red + "55",
              color: T.red, fontFamily: FF.body, fontSize: 12.5, borderRadius: 3,
            }}>{err}</div>
          )}

          <button type="submit" disabled={busy || !pw || (mode === "setup" && !pw2)} style={{
            width: "100%",
            background: T.accent,
            color: "#fff",
            border: "1px solid " + T.accent,
            fontFamily: FF.body, fontSize: 14, fontWeight: 600,
            padding: `${S.md}px ${S.lg}px`, height: 42,
            cursor: busy || !pw ? "not-allowed" : "pointer",
            opacity: busy || !pw || (mode === "setup" && !pw2) ? 0.5 : 1,
            borderRadius: 4,
            display: "flex", alignItems: "center", justifyContent: "center", gap: S.sm,
          }}>
            {busy ? "..." : (mode === "setup" ? "Set Password & Continue" : "Sign In")}
          </button>
        </form>

        {mode === "setup" && (
          <div style={{ ...TS.micro, color: T.textFaint, marginTop: S.lg, textAlign: "center", lineHeight: 1.5 }}>
            Password is hashed and stored locally. Save it somewhere safe — there's no recovery option.
          </div>
        )}

        {mode === "unlock" && (
          <div style={{ marginTop: S.xl, textAlign: "center" }}>
            <button
              type="button"
              onClick={() => {
                if (confirm("Reset password? This will require setting a new one. Your data stays intact.")) {
                  localStorage.removeItem("execos:lock_hash");
                  setMode("setup");
                  setPw(""); setPw2(""); setErr("");
                }
              }}
              style={{
                background: "transparent", border: "none",
                color: T.textFaint, fontFamily: FF.body, fontSize: 11,
                cursor: "pointer", textDecoration: "underline",
              }}>
              Forgot password? Reset
            </button>
          </div>
        )}
      </div>
    </div>
  );
};

// ---------- APP ----------
const App = () => {
  const [unlocked, setUnlocked] = useState(() => {
    // Always require going through the lock screen at least once.
    // If a password is set AND this session has unlocked, skip.
    // Otherwise (no password set, or new session) show the lock screen.
    const hasLock = LS.get("lock_hash", null);
    if (hasLock && sessionStorage.getItem("execos:unlocked") === "1") return true;
    return false;
  });
  const [view, setView] = useState("dashboard");
  const [palette, setPalette] = useState(false);
  const [settings, setSettings] = useState(false);
  const [apiKey, setApiKey] = useState(() => LS.get("api_key", ""));
  const [model, setModel] = useState(() => LS.get("model", "claude-sonnet-4-6"));
  const [, themeTick] = useState(0);
  const { isMobile } = useViewport();
  const [sidebarOpen, setSidebarOpen] = useState(false);

  // Auto-close sidebar when user picks a view (mobile only)
  const handleViewChange = (v) => {
    setView(v);
    if (isMobile) {
      setSidebarOpen(false);
      document.body.classList.remove("sidebar-open");
    }
  };

  // Sync sidebar-open body class for CSS
  useEffect(() => {
    if (!isMobile) {
      document.body.classList.remove("sidebar-open");
      return;
    }
    if (sidebarOpen) document.body.classList.add("sidebar-open");
    else document.body.classList.remove("sidebar-open");
  }, [sidebarOpen, isMobile]);

  useEffect(() => {
    // Open settings on first visit if no key (and unlocked)
    if (unlocked && !apiKey) setSettings(true);
  }, [unlocked]);

  useEffect(() => {
    const onTheme = () => themeTick(x => x + 1);
    window.addEventListener("execos:theme-changed", onTheme);
    return () => window.removeEventListener("execos:theme-changed", onTheme);
  }, []);

  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); setPalette(p => !p); }
      if (e.key === "Escape") {
        setPalette(false);
        setSettings(false);
        setSidebarOpen(false);
        // Also dispatch a window event so any open detail panels (Recordings detail,
        // Dashboard task detail, etc.) can listen and close themselves.
        window.dispatchEvent(new Event("execos:escape"));
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  if (!unlocked) {
    return <LockScreen onUnlock={() => setUnlocked(true)} />;
  }

  return (
    <div style={{ height: "100vh", display: "flex", flexDirection: "column", overflow: "hidden" }} className="execos-app-root">
      <TopBar onOpenPalette={() => setPalette(true)} onOpenSettings={() => setSettings(true)} hasKey={!!apiKey} onToggleSidebar={() => setSidebarOpen(o => !o)} />
      <div style={{ flex: 1, display: "flex", overflow: "hidden", position: "relative" }}>
        <div id="execos-sidebar-backdrop" onClick={() => setSidebarOpen(false)} />
        <Sidebar active={view} onChange={handleViewChange} />
        <div id="execos-main" style={{ flex: 1, overflowY: "auto", overflowX: "hidden" }}>
          {view === "dashboard" && <Dashboard onJump={handleViewChange} apiKey={apiKey} model={model} />}
          {view === "terminal" && <TerminalView apiKey={apiKey} model={model} />}
          {view === "sites" && <SitesView apiKey={apiKey} model={model} />}
          {view === "recordings" && <RecordingsView apiKey={apiKey} model={model} />}
          {view === "calendar" && <CalendarView />}
          {view === "focus" && <FocusOS apiKey={apiKey} model={model} />}
          {view === "email" && <EmailView apiKey={apiKey} model={model} />}
          {view === "contracts" && <ContractsView apiKey={apiKey} model={model} />}
          {view === "reports" && <ReportsView apiKey={apiKey} model={model} />}
          {view === "memory" && <MemoryView />}
          {view === "notes" && <NotesView />}
          {view === "audit" && <AuditView />}
          {view === "theme" && <ThemeView />}
          {view === "help" && <HelpView />}
        </div>
      </div>
      <Palette open={palette} onClose={() => setPalette(false)} onJump={setView} />
      <Settings open={settings} onClose={() => setSettings(false)} apiKey={apiKey} setApiKey={setApiKey} model={model} setModel={setModel} />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
