// ---------- TERMINAL ----------
const TerminalView = ({ apiKey, model }) => {
  const [messages, setMessages] = useState(() => LS.get("terminal_messages", []));
  const [input, setInput] = useState(() => {
    // Allow other modules (Dashboard task detail) to prefill the terminal input.
    const pf = LS.get("terminal_prefill", "");
    if (pf) { try { localStorage.removeItem("execos:terminal_prefill"); } catch {} return pf; }
    return "";
  });
  const [loading, setLoading] = useState(false);
  const [convoActive, setConvoActive] = useState(false);
  const [convoState, setConvoState] = useState("idle"); // idle | listening | thinking | speaking
  const [partial, setPartial] = useState("");
  const scrollRef = useRef(null);
  const sendRef = useRef(null);

  useEffect(() => {
    LS.set("terminal_messages", messages.slice(-40));
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages]);

  // Cleanup on unmount — kill any active conversation
  useEffect(() => () => { Convo.stop(); }, []);

  const send = useCallback(async (text, opts = {}) => {
    const prompt = (text ?? input).trim();
    if (!prompt || loading) return;
    setInput("");
    setPartial("");
    const next = [...messages, { role: "user", content: prompt, ts: Date.now() }];
    setMessages(next);
    setLoading(true);
    try {
      const history = next.slice(-10).filter(m => m.role !== "system").map(m => ({ role: m.role, content: m.content })).slice(0, -1);
      const reply = await callClaude({ prompt, history, apiKey, model, source: "terminal" });
      setMessages(prev => [...prev, { role: "assistant", content: reply, ts: Date.now() }]);
      if (opts.fromConvo && reply) {
        // Speak it back; Convo handles re-listening when speech ends
        Convo.speakReply(reply);
      }
    } catch (e) {
      setMessages(prev => [...prev, { role: "system", content: e.message, ts: Date.now() }]);
      if (opts.fromConvo) Convo.handleError();
    } finally {
      setLoading(false);
    }
  }, [input, loading, messages, apiKey, model]);

  // Keep a ref so Convo callbacks (created once) call the latest send
  useEffect(() => { sendRef.current = send; }, [send]);

  // Auto-send on mount when arriving from a "Brief Me"-style action.
  // Other views set terminal_prefill + terminal_autosend to push a prompt AND fire it.
  useEffect(() => {
    if (!LS.get("terminal_autosend", false)) return;
    LS.set("terminal_autosend", false);
    try { localStorage.removeItem("execos:terminal_autosend"); } catch {}
    // Tiny delay so input state from useState initializer is settled and apiKey is ready
    const t = setTimeout(() => { sendRef.current?.(); }, 100);
    return () => clearTimeout(t);
  }, []);

  // Wire Convo callbacks once
  useEffect(() => {
    Convo.setCallbacks({
      onState: (s) => setConvoState(s),
      onPartial: (t) => setPartial(t),
      onSubmit: (t) => {
        setPartial("");
        if (sendRef.current) sendRef.current(t, { fromConvo: true });
      },
    });
  }, []);

  const startConvo = () => {
    // Browsers require a user gesture to enable speechSynthesis; warm it up here
    if (window.speechSynthesis) {
      const u = new SpeechSynthesisUtterance("");
      window.speechSynthesis.speak(u);
    }
    setConvoActive(true);
    Convo.start();
  };

  const stopConvo = () => {
    setConvoActive(false);
    setPartial("");
    Convo.stop();
  };

  const handleConvoTap = () => {
    if (!convoActive) return startConvo();
    // While active: tap = interrupt (stops Claude mid-sentence and starts listening, or stops listening and submits)
    Convo.interrupt();
  };

  const stopAllVoice = () => { Convo.stop(); setConvoActive(false); };

  const clear = () => { setMessages([]); LS.set("terminal_messages", []); };

  // Quick Start suggestions — dynamically built from his current data so they
  // reflect what's actually in front of him today. Refreshes on data-change
  // events and on a 15s interval (to catch background Smartsheet fetches and
  // day-rollover).
  const [dataTick, setDataTick] = useState(0);
  useEffect(() => {
    const bump = () => setDataTick(t => t + 1);
    window.addEventListener("execos:data-updated", bump);
    window.addEventListener("storage", bump);
    const interval = setInterval(bump, 15000);
    return () => {
      window.removeEventListener("execos:data-updated", bump);
      window.removeEventListener("storage", bump);
      clearInterval(interval);
    };
  }, []);

  const quickCmds = useMemo(() => {
    const now = new Date();
    const todayYmd = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
    const hour = now.getHours();
    const isMorning = hour < 12;

    const isDone = (s) => /complete|done|closed/i.test(s || "");
    const isMine = (t) => /antoine|riley/i.test(t.owner || "");

    // --- Smartsheet: my open tasks, overdue-first then high-priority ---
    const allTasks = (typeof window !== "undefined" && window.EXEC_OS_LIVE_TASKS) || [];
    const myOpen = allTasks.filter(t => isMine(t) && !isDone(t.status));
    const myOverdue = myOpen.filter(t => {
      if (!t.dueDate) return false;
      try { return new Date(t.dueDate) < new Date(now.toDateString()); } catch { return false; }
    });
    const myHighPri = myOpen.filter(t => /high|urgent|critical|p1|p2/i.test(t.priority || ""));
    const myBlocked = myOpen.filter(t => /block|hold/i.test(t.status || ""));

    // --- Calendar events for today ---
    const todayEvents = (LS.get("calendar_events", []) || [])
      .filter(e => e.date === todayYmd)
      .sort((a, b) => (a.startTime || "").localeCompare(b.startTime || ""));

    // Find the NEXT upcoming event today (after current time)
    const currentTime = String(hour).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    const nextEvent = todayEvents.find(e => (e.startTime || "00:00") >= currentTime) || todayEvents[0];

    // --- Open TODO items ---
    const todos = (LS.get("todo_today", []) || []).filter(t => !t.done);

    // ===== Build suggestions =====
    const suggestions = [];

    // 1. Always lead with the daily briefing — universal anchor
    suggestions.push({
      label: isMorning ? "Brief me on today's priorities" : "Catch me up on where today stands",
      prompt: isMorning
        ? "Brief me on today's priorities. Lead with what's time-sensitive, then what's at risk, then the top 3 things I should personally do today."
        : "Catch me up on where today stands. What got handled, what's still open, what I should close out before end of day.",
    });

    // 2. Next calendar event (if any)
    if (nextEvent) {
      const time = nextEvent.startTime || "all-day";
      const site = nextEvent.site && nextEvent.site !== "—" ? ` [${nextEvent.site}]` : "";
      suggestions.push({
        label: `Prep me for: ${nextEvent.title}${site} at ${time}`,
        prompt: `Help me prep for "${nextEvent.title}" at ${time} today${site ? " (site: " + nextEvent.site + ")" : ""}. What to lead with, what to ask, what to flag. Plain prose.${nextEvent.notes ? "\n\nMy notes on it: " + nextEvent.notes : ""}`,
      });
    }

    // 3. First open TODO item (most recently added — top of list)
    if (todos.length > 0) {
      const t = todos[0];
      suggestions.push({
        label: `Help me knock out: ${t.text.slice(0, 60)}${t.text.length > 60 ? "…" : ""}`,
        prompt: `Help me work through this todo item: "${t.text}". Give me the next 1-3 concrete moves to make this happen today. Be specific.`,
      });
    }

    // 4. Overdue task (if any)
    if (myOverdue.length > 0) {
      const t = myOverdue[0];
      suggestions.push({
        label: `Plan recovery on overdue: ${(t.task || "").slice(0, 55)}${(t.task || "").length > 55 ? "…" : ""}`,
        prompt: `One of my Smartsheet tasks is overdue: "${t.task}". Site: ${t.site || "—"}. Status: ${t.status || "—"}. Due: ${t.dueDate || "—"}. Notes: ${t.notes || "(none)"}.\n\nGive me the next 3 concrete steps to close this out, including who I need to push and what to put in writing.`,
      });
    }

    // 5. Blocked task (if any, and we have room)
    if (myBlocked.length > 0 && suggestions.length < 6) {
      const t = myBlocked[0];
      suggestions.push({
        label: `Unblock: ${(t.task || "").slice(0, 60)}${(t.task || "").length > 60 ? "…" : ""}`,
        prompt: `This task is blocked: "${t.task}". Site: ${t.site || "—"}. Status: ${t.status || "—"}. Notes: ${t.notes || "(none)"}.\n\nWhat's the most likely root cause of the block, and what's the most leveraged move to unblock it today? Draft an escalation message if leadership needs to be looped in.`,
      });
    }

    // 6. High-priority open task (if room)
    if (myHighPri.length > 0 && suggestions.length < 6) {
      // Pick one not already surfaced as overdue/blocked
      const surfaced = new Set([...myOverdue, ...myBlocked].map(t => t.id || t.task));
      const t = myHighPri.find(t => !surfaced.has(t.id || t.task));
      if (t) {
        suggestions.push({
          label: `Move forward: ${(t.task || "").slice(0, 60)}${(t.task || "").length > 60 ? "…" : ""}`,
          prompt: `Help me move this high-priority task forward today: "${t.task}". Site: ${t.site || "—"}. Status: ${t.status || "—"}. Due: ${t.dueDate || "—"}.\n\nGive me the next concrete action plus who I need to engage. Brief and direct.`,
        });
      }
    }

    // 7. Second todo item if room
    if (todos.length > 1 && suggestions.length < 6) {
      const t = todos[1];
      suggestions.push({
        label: `Knock out: ${t.text.slice(0, 60)}${t.text.length > 60 ? "…" : ""}`,
        prompt: `Help me handle this todo: "${t.text}". Next 1-3 concrete moves.`,
      });
    }

    // Fallback if nothing dynamic to suggest — give general anchors
    if (suggestions.length < 3) {
      const fallbacks = [
        { label: "Draft an end-of-day status update for Heather", prompt: "Draft a brief end-of-day status update for Heather West covering today's progress and any open risks. Plain prose, 4-6 sentences. Use what you know about my active workstreams." },
        { label: "What should I be thinking about right now?", prompt: "Based on what you know about my active work, what should I be thinking about that I might be missing? Be direct, no fluff." },
        { label: "Run a portfolio risk check across the 10 hospitals", prompt: "Run a portfolio-level risk check across the 10 MedStar hospitals. What patterns are forming, what's quietly drifting, what would I want a heads-up on?" },
      ];
      fallbacks.forEach(f => { if (suggestions.length < 6) suggestions.push(f); });
    }

    return suggestions;
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [dataTick, messages.length]);

  return (
    <div style={{ padding: S.xxl, height: "100%", display: "flex", flexDirection: "column", gap: S.lg, maxWidth: 1400, margin: "0 auto", width: "100%" }}>
      {/* Header */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end" }}>
        <div>
          <div style={{ ...TS.label, color: T.textDim, textTransform: "uppercase", marginBottom: S.xs }}>AI Command Terminal</div>
          <div style={{ ...TS.h1, color: T.text }}>Talk to Kera</div>
        </div>
        <div style={{ display: "flex", gap: S.md, alignItems: "center" }}>
          <ConvoButton active={convoActive} state={convoState} onClick={convoActive ? stopConvo : startConvo} />
          <Btn icon="trash" onClick={clear} size="sm">Clear</Btn>
        </div>
      </div>

      {/* Conversation panel — visible when convo mode is on */}
      {convoActive && (
        <ConvoPanel state={convoState} partial={partial} onInterrupt={handleConvoTap} onStop={stopConvo} />
      )}

      {/* Transcript */}
      <div ref={scrollRef} style={{
        flex: 1,
        background: T.bgSunken,
        border: "1px solid " + T.border,
        borderRadius: 4,
        padding: S.xl,
        overflowY: "auto",
        minHeight: 0,
        ...TS.body,
        color: T.text,
      }}>
        {messages.length === 0 && (
          <div>
            <div style={{ ...TS.body, color: T.accent, marginBottom: S.lg, fontWeight: 500 }}>EXEC-OS · session initialized</div>
            <div style={{ ...TS.body, color: T.textDim, marginBottom: S.xl }}>
              Type any executive request below. Or tap <b style={{ color: T.text }}>Conversation Mode</b> to talk with Kera hands-free.
            </div>
            <div style={{ ...TS.label, color: T.textFaint, textTransform: "uppercase", marginBottom: S.md }}>Quick Start</div>
            <div style={{ display: "flex", flexDirection: "column", gap: S.sm }}>
              {quickCmds.map((c, i) => (
                <button key={i} onClick={() => send(c.prompt)}
                  style={{
                    background: T.bgRaised,
                    border: "1px solid " + T.border,
                    color: T.text,
                    ...TS.body,
                    padding: `${S.md}px ${S.lg}px`,
                    cursor: "pointer",
                    borderRadius: 3,
                    textAlign: "left",
                    display: "flex",
                    alignItems: "center",
                    gap: S.md,
                    transition: "border-color 0.12s, background 0.12s",
                  }}
                  onMouseEnter={e => { e.currentTarget.style.borderColor = T.borderBright; e.currentTarget.style.background = T.surface; }}
                  onMouseLeave={e => { e.currentTarget.style.borderColor = T.border; e.currentTarget.style.background = T.bgRaised; }}>
                  <Icon name="arrow" size={12} color={T.accent} />{c.label}
                </button>
              ))}
            </div>
          </div>
        )}
        {messages.map((m, i) => (
          <div key={i} style={{ marginBottom: S.xl }}>
            <div style={{ ...TS.label, color: m.role === "user" ? T.accent : m.role === "system" ? T.red : T.cyan, marginBottom: S.sm, textTransform: "uppercase", fontFamily: FF.mono }}>
              {m.role === "user" ? "▸ ANTOINE" : m.role === "system" ? "✕ SYSTEM" : "◉ KERA"}
              <span style={{ color: T.textFaint, marginLeft: S.md, ...TS.micro, fontFamily: FF.mono }}>{new Date(m.ts).toLocaleTimeString("en-US", { hour12: false })}</span>
            </div>
            <div style={{
              whiteSpace: "pre-wrap",
              color: m.role === "system" ? T.red : T.text,
              ...TS.body,
              lineHeight: 1.6,
              paddingLeft: S.lg,
              borderLeft: "1px solid " + T.borderFaint,
            }}>{m.content}</div>
            {m.role === "assistant" && (
              <div style={{ display: "flex", gap: S.xs, marginTop: S.md, paddingLeft: S.lg }}>
                <button onClick={() => navigator.clipboard?.writeText(m.content)} style={{
                  background: "transparent", border: "1px solid " + T.border, color: T.textDim,
                  fontFamily: FF.mono, fontSize: 10, padding: `${S.xs}px ${S.md}px`,
                  cursor: "pointer", borderRadius: 3, letterSpacing: 0.4, textTransform: "uppercase",
                  display: "flex", alignItems: "center", gap: S.xs,
                }}>
                  <Icon name="copy" size={10} /> Copy
                </button>
                <button onClick={() => { Voice.stopSpeaking(); Voice.speak(m.content); }} style={{
                  background: "transparent", border: "1px solid " + T.border, color: T.textDim,
                  fontFamily: FF.mono, fontSize: 10, padding: `${S.xs}px ${S.md}px`,
                  cursor: "pointer", borderRadius: 3, letterSpacing: 0.4, textTransform: "uppercase",
                  display: "flex", alignItems: "center", gap: S.xs,
                }}>
                  🔊 Read
                </button>
              </div>
            )}
          </div>
        ))}
        {loading && (
          <div style={{ color: T.cyan, display: "flex", alignItems: "center", gap: S.sm, ...TS.label, textTransform: "uppercase", fontFamily: FF.mono }}>
            <span className="spin" style={{display:"inline-flex"}}><Icon name="load" size={12} /></span>
            <span>Thinking…</span>
          </div>
        )}
      </div>

      {/* Input bar */}
      <div style={{
        display: "flex", gap: S.md,
        background: T.bgRaised,
        border: "1px solid " + T.border,
        borderRadius: 4, padding: S.xs,
        transition: "border-color 0.2s",
      }}>
        <div style={{ color: T.accent, fontFamily: FF.mono, padding: `${S.md}px 0 ${S.md}px ${S.lg}px`, fontSize: 14 }}>▸</div>
        <input value={input} onChange={e => setInput(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }}
          placeholder={convoActive ? "Conversation mode active — speak naturally to Kera" : "Tell Kera what you need…"}
          disabled={convoActive}
          style={{
            flex: 1,
            background: "transparent", border: "none", color: T.text,
            fontFamily: FF.body, fontSize: 13,
            padding: `${S.md}px 0`,
            outline: "none",
          }} />
        {/* Paste button — quick clipboard insert without leaving keyboard. Appends so
            user can paste-then-add their own context before sending. */}
        {!convoActive && (
          <PasteButton onPaste={(t) => setInput(input ? input + " " + t : t)} label="Paste" style={{ marginRight: 6 }} />
        )}
        <Btn icon="send" variant="primary" onClick={() => send()} loading={loading} disabled={convoActive}>Send</Btn>
      </div>
    </div>
  );
};

// Single button that controls hands-free conversation mode
const ConvoButton = ({ active, state, onClick }) => {
  const label = !active ? "Conversation Mode"
    : state === "listening" ? "Listening — tap to send"
    : state === "thinking" ? "Thinking…"
    : state === "speaking" ? "Speaking — tap to interrupt"
    : "Conversation Active";
  const color = !active ? T.text
    : state === "listening" ? T.red
    : state === "thinking" ? T.amber
    : state === "speaking" ? T.cyan
    : T.text;
  const dotColor = state === "listening" ? T.red : state === "speaking" ? T.cyan : state === "thinking" ? T.amber : T.green;
  return (
    <button onClick={onClick} style={{
      background: active ? T.surface : "transparent",
      border: "1px solid " + (active ? T.borderBright : T.border),
      color, fontFamily: FF.body, fontSize: 12, fontWeight: 500,
      padding: `${S.sm}px ${S.lg}px`, height: 32, cursor: "pointer",
      borderRadius: 3, display: "inline-flex", alignItems: "center", gap: S.sm,

        }} />
      ) : (
        <span style={{ fontSize: 14 }}>🎙</span>
      )}
      <span>{label}</span>
    </button>

};

const FocusModuleRunner = ({ module, onBack, bd, apiKey, model }) => {
  const [input, setInput] = useState("");
  const [output, setOutput] = useState("");
  const [loading, setLoading] = useState(false);
  const [history, setHistory] = useState(() => LS.get("focus_" + module.id + "_history", []));

  const run = async () => {
    if (!input.trim() || loading) return;
    setLoading(true); setOutput("");
    try {
      const reply = await callClaude({ prompt: module.prompt(input), apiKey, model });
      setOutput(reply);
      const newHist = [{ input, output: reply, ts: Date.now() }, ...history].slice(0, 10);
      setHistory(newHist);
      LS.set("focus_" + module.id + "_history", newHist);
      if (module.id === "double") { bd.reset(); bd.setActive(true); }
    } catch (e) { setOutput("Error: " + e.message); }
    finally { setLoading(false); }
  };

  return (
    <div style={{ padding: 22 }}>
      <button onClick={onBack} style={{ background: "transparent", border: "none", color: T.textDim, fontFamily: FF.mono, fontSize: 10, letterSpacing: 1.6, cursor: "pointer", padding: 0, marginBottom: 16, display: "flex", alignItems: "center", gap: 6 }}>← BACK TO FOCUS OS</button>

          <Icon name={module.icon} size={22} color={module.color} />

        <div>
          <h1 style={{ fontFamily: FF.display, fontSize: 26, fontWeight: 500, color: T.text, margin: 0, letterSpacing: -0.4, fontStyle: "italic" }}>{module.name}</h1>
          <div style={{ fontFamily: FF.body, fontSize: 13, color: T.textDim, marginTop: 2 }}>{module.blurb}</div>
        </div>
      </div>
      {module.id === "double" && bd.active && (
        <div style={{ background: T.cyan + "10", border: "1px solid " + T.cyan + "55", padding: 18, borderRadius: 3, marginBottom: 16, display: "flex", alignItems: "center", gap: 18 }}>
          <Icon name="timer" size={20} color={T.cyan} />
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: FF.mono, fontSize: 10, color: T.cyan, letterSpacing: 1.6 }}>BODY DOUBLE ACTIVE</div>
            <div style={{ fontFamily: FF.display, fontSize: 32, fontWeight: 500, color: T.text, letterSpacing: -1 }}>

          </div>
          <Btn icon="pause" onClick={() => bd.setActive(false)}>Pause</Btn>

        <textarea value={input} onChange={e => setInput(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) run(); }}
          placeholder="Type here. Cmd/Ctrl+Enter to run." rows={4}
          style={{ width: "100%", background: T.bgSunken, border: "1px solid " + T.border, color: T.text, fontFamily: FF.body, fontSize: 14, padding: 14, borderRadius: 2, resize: "vertical" }} />
        <div style={{ marginTop: 12, display: "flex", justifyContent: "flex-end" }}>
          <Btn icon="zap" variant="primary" onClick={run} loading={loading}>Execute</Btn>
        </div>

        <div style={{ marginTop: 14 }}>
          <Panel title="Output" accent={module.color}>

const EmailView = ({ apiKey, model }) => {
  // Mode toggle: "single" = the original paste-and-act flow; "investigate" = multi-email deep analysis.
  const [mode, setMode] = useState("single");

  // -- Single email state --
  const [emailText, setEmailText] = useState("");
  const [output, setOutput] = useState("");
  const [loading, setLoading] = useState(false);
  const [activeAction, setActiveAction] = useState("");
  // Quick Action file uploads — same file types as Investigate Thoroughly.
  // Text files (.txt/.eml/.msg) get appended into the email body. Images and PDFs become attachments
  // that flow into the API call as Claude vision blocks.
  const [quickFiles, setQuickFiles] = useState([]);
  const [quickFileError, setQuickFileError] = useState("");

  // -- Investigate Thoroughly state --
  // Each email in `emails` is { id, label, text, files: [{name, mediaType, data, dataUrl, kind}] }
  // kind = "image" for images/PDFs that Claude sees natively, or "text" for plain-text files we read into the body
  const [emails, setEmails] = useState([{ id: "e1", label: "Email 1", text: "", files: [] }]);
  const [investigation, setInvestigation] = useState("");
  const [investigationLoading, setInvestigationLoading] = useState(false);
  const [investigationStage, setInvestigationStage] = useState("");
  const [investigationError, setInvestigationError] = useState("");
  const [focusQuestion, setFocusQuestion] = useState("");

  // -- Inbox (forwarded-email ingestion) state --
  // The Inbox tab reads from the Vercel /api/email/list endpoint, which
  // pulls rows from the Supabase ingested_emails table. We cache the
  // last fetch in localStorage so the dashboard renders instantly on tab
  // re-entry while a fresh fetch runs in the background.
  const [inbox, setInbox] = useState(() => LS.get("inbox_emails", []));
  const [inboxLoading, setInboxLoading] = useState(false);
  const [inboxError, setInboxError] = useState("");
  const [inboxFetchedAt, setInboxFetchedAt] = useState(() => LS.get("inbox_fetched_at", 0));
  const [inboxFilter, setInboxFilter] = useState("all");      // all | unread | pinned | review | verified
  const [inboxSiteFilter, setInboxSiteFilter] = useState(""); // empty = all sites
  const [inboxSearch, setInboxSearch] = useState("");
  const [activeInboxId, setActiveInboxId] = useState(null);
  const [inboxAiBusy, setInboxAiBusy] = useState("");
  const [inboxAiOutput, setInboxAiOutput] = useState("");
  const [inboxBaseUrl] = useState(() => LS.get("email_inbox_base", EXEC_OS_DEFAULTS.emailInboxBase || ""));

  // Build workspace key from Cloud config
  const inboxWorkspaceKey = () => {
    try {
      const cfg = LS.get("supabase_config", null);
      return cfg && cfg.workspaceKey ? cfg.workspaceKey : "";
    } catch { return ""; }
  };

  // Fetch from /api/email/list
  const refreshInbox = async ({ silent = false } = {}) => {
    setInboxError("");
    const ws = inboxWorkspaceKey();
    if (!ws) { setInboxError("Workspace key not set. Settings → Cloud Sync."); return; }
    if (!inboxBaseUrl) { setInboxError("Email inbox endpoint not configured."); return; }
    if (!silent) setInboxLoading(true);
    try {
      const url = inboxBaseUrl.replace(/\/$/, "") + "/list?workspace=" + encodeURIComponent(ws) + "&limit=100";
      const res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const rows = Array.isArray(data.emails) ? data.emails : [];
      setInbox(rows);
      LS.set("inbox_emails", rows);
      const now = Date.now();
      setInboxFetchedAt(now);
      LS.set("inbox_fetched_at", now);
    } catch (e) {
      setInboxError("Couldn't fetch inbox: " + e.message);
    } finally {
      setInboxLoading(false);
    }
  };

  // Update a single email row server-side and patch the local cache.
  const patchInboxEmail = async (id, patch) => {
    const ws = inboxWorkspaceKey();
    if (!ws || !inboxBaseUrl) return;
    // Optimistic update
    setInbox(prev => {
      const next = prev.map(e => e.id === id ? { ...e, ...patch } : e);
      LS.set("inbox_emails", next);
      return next;
    });
    try {
      const res = await fetch(inboxBaseUrl.replace(/\/$/, "") + "/update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ workspace: ws, email_id: id, patch }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
    } catch (e) {
      setInboxError("Update failed: " + e.message);
    }
  };

  // Save Kera's extraction JSON for an email.
  const saveExtraction = async (id, extraction) => {
    const ws = inboxWorkspaceKey();
    if (!ws || !inboxBaseUrl) return;
    setInbox(prev => {
      const next = prev.map(e => e.id === id ? { ...e, extraction: [extraction] } : e);
      LS.set("inbox_emails", next);
      return next;
    });
    try {
      await fetch(inboxBaseUrl.replace(/\/$/, "") + "/update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ workspace: ws, email_id: id, extraction }),
      });
    } catch (e) {
      // Non-fatal — the extraction is cached locally.
    }
  };

  // Filtered, searched, sorted view of the inbox.
  const visibleInbox = (() => {
    let list = [...(inbox || [])];
    if (inboxFilter === "pinned")   list = list.filter(e => e.pinned);
    if (inboxFilter === "review")   list = list.filter(e => e.in_review_queue);
    if (inboxFilter === "verified") list = list.filter(e => e.verified_source);
    if (inboxFilter === "unread")   list = list.filter(e => !e.archived);
    if (inboxSiteFilter) {
      list = list.filter(e => {
        const ex = (e.extraction && e.extraction[0]) || {};
        const sites = ex.sites || [];
        return sites.includes(inboxSiteFilter);
      });
    }
    if (inboxSearch.trim()) {
      const q = inboxSearch.toLowerCase();
      list = list.filter(e => {
        const blob = [e.subject, e.from_addr, e.from_name, e.original_from, e.text_body, (e.extraction && e.extraction[0] && e.extraction[0].summary) || ""].join(" ").toLowerCase();
        return blob.includes(q);
      });
    }
    list.sort((a, b) => {
      // Pinned first, then most recent
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      return new Date(b.received_at || 0) - new Date(a.received_at || 0);
    });
    return list;
  })();

  const activeInboxEmail = activeInboxId ? visibleInbox.find(e => e.id === activeInboxId) || inbox.find(e => e.id === activeInboxId) : null;

  // Auto-refresh on first mount of Inbox tab
  useEffect(() => {
    if (mode === "inbox" && !inboxFetchedAt) {
      refreshInbox({ silent: false });
    }
  }, [mode]);

  // Kera-powered actions on a single inbox email
  const INBOX_AI_ACTIONS = [
    { id: "extract", label: "Auto-Extract Intel", icon: "spark",
      run: async (em) => {
        const prompt = `You are Kera. Extract structured intelligence from this forwarded email. Return ONLY valid JSON, no preamble, no markdown fences.

Fields (use empty arrays for missing values, null for missing strings):
{
  "topic": "one-line topic",
  "urgency": "low" | "medium" | "high" | "critical",
  "category": "vendor-update" | "outage" | "project" | "equipment" | "compliance" | "approval" | "other",
  "sites": ["MWHC", "MGUH", ...],
  "vendors": ["Limbach", "Siemens", ...],
  "people": ["First Last", ...],
  "equipment": ["AHU-6", "Chiller-3", ...],
  "rooms": ["2B-312", ...],
  "projects": ["P15398", ...],
  "systems": ["chilled water", "steam", ...],
  "action_items": [{"who": "...", "what": "...", "by_when": "...", "confidence": "low|med|high"}],
  "commitments": [{"who": "...", "what": "...", "by_when": "..."}],
  "dates_mentioned": [{"date": "YYYY-MM-DD or text", "why": "..."}],
  "approvals_needed": [{"who": "...", "what": "..."}],
  "deadlines": [{"what": "...", "by_when": "..."}],
  "summary": "3-line executive summary"
}

EMAIL:
From: ${em.from_addr || ""} ${em.from_name ? "(" + em.from_name + ")" : ""}
${em.original_from ? "Originally from: " + em.original_from + "\n" : ""}Subject: ${em.subject || ""}
Date: ${em.date_header || em.received_at || ""}

${em.text_body || em.html_body || "(no body)"}`;
        const reply = await callClaude({ prompt, apiKey, model, source: "inbox-extract", maxTokens: 3000 });
        // Strip code fences if Kera added them anyway
        const cleaned = reply.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim();
        let parsed = null;
        try { parsed = JSON.parse(cleaned); } catch { /* fall through */ }
        if (!parsed) return "Kera returned non-JSON. Output:\n\n" + reply;
        await saveExtraction(em.id, { ...parsed, raw_extraction: parsed });
        return "Extraction saved. " + (parsed.summary || "");

    { id: "summarize", label: "Summarize Thread", icon: "file",
      run: async (em) => {

EMAIL:

  const runInboxAi = async (action, email) => {

    { id:"firm", label:"Firm Reply", icon:"tri", prompt: e => `Draft a firm but professional reply. Hold the line, request what's needed in writing, no softening. Antoine's voice.\n\n---\n${e}` },
    { id:"escalate", label:"Escalate", icon:"alert", prompt: e => `Draft an escalation message to leadership about the issue in this email. Open with the operational risk, then 2-3 sentences of context, then the specific decision or support needed. Antoine's voice.\n\n---\n${e}` },
    { id:"actions", label:"Action List", icon:"list", prompt: e => `Convert this email into a numbered action list. Each action: owner, action, due date if stated. End with one line on any blockers.\n\n---\n${e}` },
    { id:"commitments", label:"Commitments", icon:"check", prompt: e => `Extract every commitment made in this email thread — by whom, what, by when. Then flag any that look at risk.\n\n---\n${e}` },

  const run = async (a) => {
    // Either typed text OR attached files (or both) must be present.

    try {

      if (!hasText && hasFiles) {

      // Image/PDF attachments flow to Claude as vision blocks via the images param.

  // Process file uploads for Quick Action. Text files (.txt/.eml/.msg/.csv/.md)
  // get folded into the email body. Images and PDFs become vision attachments.
  const handleQuickFiles = async (fileList) => {
    setQuickFileError("");

    if (!files.length) return;
    try {
      const processed = await Promise.all(files.map(readFile));
      let appendText = "";
      const nextFiles = [...quickFiles];
      for (const p of processed) {
        if (p.kind === "text") {
          appendText += (appendText ? "\n\n---\n" : "") + "[Attached file: " + p.name + "]\n" + p.text;
        } else {
          nextFiles.push(p);
        }
      }
      if (appendText) {
        setEmailText(prev => (prev ? prev + "\n\n---\n" : "") + appendText);
      }
      setQuickFiles(nextFiles);

      setQuickFileError(err.message || "File read failed.");

  };
  const removeQuickFile = (idx) => setQuickFiles(prev => prev.filter((_, i) => i !== idx));

  // ---- Investigate Thoroughly helpers ----

  // Read a file. Plain-text formats (.txt, .eml, .msg, .csv, .json) become text and append to the email body.
  // Images and PDFs become base64 attachments that go to Claude as image blocks (Claude can see PDFs natively).
  const readFile = (file) => new Promise((resolve, reject) => {
    const name = file.name || "file";
    const lower = name.toLowerCase();
    const isText = /\.(txt|eml|msg|csv|json|md|log|html)$/i.test(lower) || (file.type && /^text\//.test(file.type));
    const isImage = /^image\//.test(file.type || "");
    const isPdf = /\.pdf$/i.test(lower) || file.type === "application/pdf";

    if (isText) {
      const reader = new FileReader();
      reader.onload = () => resolve({ kind: "text", name, text: String(reader.result || "") });
      reader.onerror = () => reject(new Error("Couldn't read " + name));
      reader.readAsText(file);
    } else if (isImage) {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const MAX = 1600;
          let w = img.width, h = img.height;
          if (Math.max(w, h) > MAX) {
            const scale = MAX / Math.max(w, h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
          const comma = dataUrl.indexOf(",");
          resolve({ kind: "image", name, mediaType: "image/jpeg", data: dataUrl.slice(comma + 1), dataUrl, width: w, height: h });
        };
        img.onerror = () => reject(new Error("Couldn't decode image " + name));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error("Couldn't read " + name));
      reader.readAsDataURL(file);
    } else if (isPdf) {
      // PDFs go through as document blocks. Claude can see them natively.
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = String(reader.result || "");
        const comma = dataUrl.indexOf(",");
        resolve({ kind: "pdf", name, mediaType: "application/pdf", data: dataUrl.slice(comma + 1), dataUrl });
      };
      reader.onerror = () => reject(new Error("Couldn't read PDF " + name));
      reader.readAsDataURL(file);
    } else {
      // Unknown — try reading as text. If it ends up gibberish, the user can see and remove it.
      const reader = new FileReader();
      reader.onload = () => resolve({ kind: "text", name, text: String(reader.result || ""), warning: "Unknown file type — read as text. May display incorrectly." });
      reader.onerror = () => reject(new Error("Couldn't read " + name));
      reader.readAsText(file);
    }
  });

  const handleEmailFiles = async (emailId, fileList) => {

        const prompt = `You are Kera, executive AI for Antoine Riley Sr., Director of Systems Maintenance at Crothall/MedStar (10 MedStar hospitals).

Analyze ONE email thread thoroughly. This is pass 1 of 2 — focused on THIS thread alone. Be exhaustive.

Cover these dimensions:
1. **Sender / Recipients / Date** — who is talking to whom and when (if discernible from headers or context)
2. **Subject / Topic** — what is this thread about in one sentence
3. **Surface content** — what is literally being said, point by point
4. **Subtext** — what is being implied, avoided, hinted at, or left unsaid. Read between the lines. Tone, hedging, escalation cues.
5. **Commitments made** — by whom, what, by when (cite the words if possible)
6. **Asks / Demands** — what is being requested of Antoine or of others
7. **Risks / Liabilities** — operational, financial, regulatory, reputational
8. **Key players** — anyone named, their role, and their position in the thread
9. **Evidence / Numbers / Dates** — anything specific worth flagging
10. **Open questions** — what is NOT answered that should be

Plain prose unless lists are necessary. Be specific. Quote the email when a phrase matters.${focusClause}

---
EMAIL ${i + 1} OF ${populated.length} — "${em.label}"
${em.text || "(no body text — see attached image/PDF)"}
${em.files.length ? "\nATTACHED FILES: " + em.files.map(f => f.name).join(", ") : ""}
---`;

        const analysis = await callClaude({
          prompt,

          source: "email-investigate-pass1",
          images: imageAttachments.length ? imageAttachments : null,
          maxTokens: 3000,

        perEmailAnalyses.push({ label: em.label, analysis });

      // ===== PASS 2: synthesis across all emails =====
      setInvestigationStage("Cross-referencing all emails...");
      const synthesisPrompt = `You are Kera. You've just analyzed ${populated.length} email thread${populated.length > 1 ? "s" : ""} individually for Antoine. Now synthesize a thorough cross-cutting investigation.

You will produce a structured analysis report with these sections, in this exact order, each with a clear header:

## EXECUTIVE SUMMARY
3-5 sentences. The most important thing Antoine needs to know.

Order events chronologically across all threads. Who said what, when. Note gaps and silences.

The literal content across all threads, distilled.

## QUESTIONS ANTOINE SHOULD ASK BEFORE RESPONDING
The questions whose answers would change the strategy. Make him think.

Use plain prose within sections. Be exhaustive — Antoine asked you to investigate THOROUGHLY, so do not under-deliver. This is not a summary; it is a deep read.${focusClause}

---
INDIVIDUAL ANALYSES TO SYNTHESIZE:

${perEmailAnalyses.map((a, i) => `### Analysis of "${a.label}" (Email ${i + 1})\n${a.analysis}`).join("\n\n")}
---`;

      const finalReport = await callClaude({

  const clearInvestigation = () => {

  return (

                    placeholder="Your notes on this email..."
                    rows={4}
                    style={{ background: T.bgSunken, border: "1px solid " + T.borderFaint, color: T.text, fontFamily: FF.mono, fontSize: 11, padding: 10, borderRadius: 2, resize: "vertical", lineHeight: 1.5 }}
                  />
                </div>
              </div>
            </Panel>
          )}
        </div>
      )}
    </div>
  );
};

// ============================================================
// CONTRACTS — seasoned-attorney contract investigator.
// Reads contracts (paste, .txt/.eml/.md, or .pdf/image vision) and runs
// a deep attorney-grade investigation: red flags, indemnification, IP,
// auto-renewal, liability caps, jurisdiction, scope ambiguity, payment
// terms, termination, warranties, force majeure, dispute resolution.
//
// "Gets smarter with use" mechanics:
// - Every investigation saved with vendor, title, date, key findings, notes
// - On new investigation, prior contracts from the SAME vendor are injected as
//   context so Kera applies pattern recognition across the relationship
// - "Lessons Learned" array gets auto-extracted and accumulated — recurring
//   red flags Antoine has flagged before bubble up automatically next time
// - Search across the entire history (vendor, title, body, findings)
// - User corrections (Antoine pushing back on a finding) feed back into the
//   knowledge file as USER VERIFIED so future investigations weight them
// ============================================================
const ContractsView = ({ apiKey, model }) => {
  // ---- persisted state ----
  const [investigations, setInvestigations] = useState(() => LS.get("contract_investigations", []));
  const [lessonsLearned, setLessonsLearned] = useState(() => LS.get("contract_lessons", []));

  // ---- current investigation working state ----
  const [contractText, setContractText] = useState("");
  const [contractFiles, setContractFiles] = useState([]); // {kind, name, mediaType, data, dataUrl} or {kind: 'text', name, text}
  const [vendor, setVendor] = useState("");
  const [title, setTitle] = useState("");
  const [focusInstruction, setFocusInstruction] = useState("");
  const [investigation, setInvestigation] = useState("");
  const [loading, setLoading] = useState(false);
  const [stage, setStage] = useState("");
  const [error, setError] = useState("");
  const [activeInvestigationId, setActiveInvestigationId] = useState(null);
  const [search, setSearch] = useState("");
  const [showHistory, setShowHistory] = useState(false);
  // Add-to-Memory / Add-to-Notes UI state
  const [addModal, setAddModal] = useState(null); // 'memory' | 'notes' | null
  const [addContent, setAddContent] = useState("");
  const [addTitle, setAddTitle] = useState("");
  const [addStatus, setAddStatus] = useState("");

  const persistInvestigations = (next) => { setInvestigations(next); LS.set("contract_investigations", next); };
  const persistLessons = (next) => { setLessonsLearned(next); LS.set("contract_lessons", next); };

  // ---- file ingestion (mirrors EmailView pattern) ----
  const readContractFile = (file) => new Promise((resolve, reject) => {
    const name = file.name || "file";
    const lower = name.toLowerCase();
    const isText = /\.(txt|eml|msg|csv|json|md|log|html|rtf)$/i.test(lower) || (file.type && /^text\//.test(file.type));
    const isImage = /^image\//.test(file.type || "");
    const isPdf = /\.pdf$/i.test(lower) || file.type === "application/pdf";
    if (isText) {
      const reader = new FileReader();
      reader.onload = () => resolve({ kind: "text", name, text: String(reader.result || "") });
      reader.onerror = () => reject(new Error("Couldn't read " + name));
      reader.readAsText(file);
    } else if (isImage) {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const MAX = 1600;
          let w = img.width, h = img.height;
          if (Math.max(w, h) > MAX) { const s = MAX / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
          const comma = dataUrl.indexOf(",");
          resolve({ kind: "image", name, mediaType: "image/jpeg", data: dataUrl.slice(comma + 1), dataUrl });
        };
        img.onerror = () => reject(new Error("Couldn't decode image " + name));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error("Couldn't read " + name));
      reader.readAsDataURL(file);
    } else if (isPdf) {
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = String(reader.result || "");
        const comma = dataUrl.indexOf(",");
        resolve({ kind: "pdf", name, mediaType: "application/pdf", data: dataUrl.slice(comma + 1), dataUrl });
      };
      reader.onerror = () => reject(new Error("Couldn't read PDF " + name));
      reader.readAsDataURL(file);
    } else {
      const reader = new FileReader();
      reader.onload = () => resolve({ kind: "text", name, text: String(reader.result || "") });
      reader.onerror = () => reject(new Error("Couldn't read " + name));
      reader.readAsText(file);
    }
  });

  const handleContractFiles = async (fileList) => {
    setError("");
    const files = Array.from(fileList || []);
    if (!files.length) return;
    try {
      const processed = await Promise.all(files.map(readContractFile));
      let appendText = "";
      const nextFiles = [...contractFiles];
      for (const p of processed) {
        if (p.kind === "text") {
          appendText += (appendText ? "\n\n---\n" : "") + "[FILE: " + p.name + "]\n" + p.text;
        } else {
          nextFiles.push(p);
        }
      }
      if (appendText) setContractText(prev => prev ? prev + "\n\n" + appendText : appendText);
      if (nextFiles.length !== contractFiles.length) setContractFiles(nextFiles);
    } catch (err) {
      setError(err.message || "File read failed.");
    }
  };
  const removeContractFile = (idx) => setContractFiles(prev => prev.filter((_, i) => i !== idx));

  // ---- search ----
  // Word-level AND matching so multi-word queries match even when words aren't
  // adjacent. "water invoice Washington Hospital Center" matches a record
  // titled "Water invoice — MedStar Washington Hospital Center".
  const visibleInvestigations = (() => {
    const q = search.trim().toLowerCase();
    if (!q) return investigations;
    const tokens = q.split(/\s+/).filter(Boolean);
    return investigations.filter(inv => {
      const blob = [inv.vendor, inv.title, inv.contractText, inv.investigation, inv.userNotes, (inv.tags || []).join(" "), (inv.keyFindings || []).join(" ")].join(" ").toLowerCase();
      return tokens.every(tok => blob.includes(tok));
    });
  })();

  // ---- the investigation itself ----
  const runInvestigation = async () => {
    setError("");
    if (!apiKey) { setError("Anthropic API key required. Settings (gear) → AI / Model."); return; }
    if (!contractText.trim() && contractFiles.length === 0) { setError("Paste or upload a contract first."); return; }

    setLoading(true);
    setInvestigation("");
    setStage("Reading the document...");

    try {
      // Pull prior investigations from the SAME vendor (or recent ones if no vendor named)
      // and the global Lessons Learned. This is the "gets smarter with use" muscle.
      const vendorLower = (vendor || "").toLowerCase().trim();
      const priorSameVendor = vendorLower
        ? investigations.filter(inv => (inv.vendor || "").toLowerCase().includes(vendorLower)).slice(0, 5)
        : [];
      const recent = investigations.slice(0, 3);
      const priors = priorSameVendor.length ? priorSameVendor : recent;

      const priorContext = priors.length === 0 ? "" :
        "\n\n# PRIOR CONTRACT INVESTIGATIONS (apply pattern recognition; Antoine has been here before)\n" +
        priors.map((inv, i) => (
          `## Prior #${i + 1} — ${inv.vendor || "(no vendor)"} · ${inv.title || "(no title)"} · ${new Date(inv.createdAt).toLocaleDateString()}\n` +
          `Key findings:\n${(inv.keyFindings || []).map(f => `  - ${f}`).join("\n") || "  (none recorded)"}\n` +
          (inv.userNotes ? `Antoine's correction notes (USER VERIFIED — weight heavily):\n${inv.userNotes}\n` : "")
        )).join("\n\n");

      const lessonsContext = lessonsLearned.length === 0 ? "" :
        "\n\n# LESSONS LEARNED (recurring red flags Antoine has flagged historically — surface aggressively when relevant)\n" +
        lessonsLearned.map((l, i) => `${i + 1}. ${l.lesson}` + (l.source ? `  (from: ${l.source})` : "")).join("\n");

      const focusClause = focusInstruction.trim() ? `\n\nFOCUS FROM ANTOINE: ${focusInstruction.trim()}\nIntegrate this focus throughout the investigation. Do not skip the rest of the standard review.` : "";

      const imageAttachments = contractFiles.filter(f => f.kind === "image" || f.kind === "pdf");

      // PASS 1 — full attorney-grade investigation
      setStage("Investigating like a seasoned attorney...");

      const prompt = `You are Kera, acting as a seasoned contract attorney advising Antoine Riley Sr., Director of Systems Maintenance at Crothall Healthcare (MedStar Health portfolio, 10 hospitals). You have spent twenty years reviewing facilities and vendor agreements in the healthcare environment. You are thorough, conservative, plainspoken, and protective of Antoine's interests.

Read this contract and produce a complete attorney-grade investigation. Use this exact structure, with each section as a clear header in CAPS:

## DEAL SUMMARY
Two or three sentences. Who, what, how much, what term, what the deal actually does.

## PARTIES
Identify every party, their role, and any apparent affiliations (parent companies, subsidiaries, signatories). Flag any party that is unclear or appears to shift between sections.

## SCOPE OF WORK
What is actually being delivered. Be precise. Then list every scope ambiguity, vague phrase, "as needed", "reasonable efforts", "industry standard" terms that have no defined meaning. Each ambiguity becomes a negotiation point.

## PRICING & PAYMENT TERMS
Rates, totals, escalators, surcharges, mobilization fees, cancellation fees. Net payment days. Late fees. Auto-rate-increase clauses. Anything ratcheting up after Year 1.

## TERM & TERMINATION
Initial term, renewal mechanics, notice periods, auto-renewal traps, termination for cause vs convenience, kill fees, termination assistance obligations, data return on exit.

## INDEMNIFICATION & LIABILITY
Who indemnifies whom. Scope of indemnity. Liability caps (is the cap mutual? is it tied to fees paid?). Carve-outs (gross negligence, willful misconduct, IP, confidentiality, indemnity itself). Consequential damages exclusions — and whether they cut both ways.

## INSURANCE REQUIREMENTS
Required coverage types and minimum limits. Additional insured language. Primary and non-contributory wording. Waiver of subrogation. Whether COIs are required pre-work.

## WARRANTIES & REMEDIES
Express warranties given. Implied warranty disclaimers. Remedy limitations. Time-bar on claims. Whether the warranty period actually covers the asset's useful life.

## INTELLECTUAL PROPERTY
Who owns what. Work-for-hire? License grants? Pre-existing IP carve-outs? Data ownership — particularly important if the contract touches MedStarH2OLog, Load Lever, BAS data, or any operational data Antoine's team generates.

## CONFIDENTIALITY & DATA
NDA reach, duration, surviving obligations. PHI/HIPAA exposure if hospital systems touch it. Data security minimums. Breach notification timeline.

## DISPUTE RESOLUTION
Jurisdiction, venue, governing law. Mandatory arbitration? Class action waivers? Mediation step? Attorney fee shifting. Statute of limitations modification.

## ASSIGNMENT & CHANGE OF CONTROL
Can vendor assign without consent? What happens if vendor is acquired? Termination right on change of control?

## FORCE MAJEURE
What's covered. What's excluded. Notice requirements. Performance suspension vs termination.

## RED FLAGS — TOP 5
The five things that would keep a careful attorney up at night. Each with: WHAT (the clause), WHY IT MATTERS (the risk in plain terms), and RECOMMENDATION (specific edit or pushback).

## NEGOTIATION TARGETS
Ranked list of specific changes to demand. Each with: clause reference, current language, suggested replacement language, fallback position.

## QUESTIONS FOR THE VENDOR
Concrete questions to send before signing. Each should be answerable in writing.

## SIGNING GUIDANCE
Final attorney recommendation: SIGN AS-IS / SIGN WITH MINOR EDITS / DO NOT SIGN WITHOUT REVISION / DO NOT SIGN. State the reasoning in one sentence.

Plain prose within each section. Quote contract language when wording is the issue. Be specific to the actual document — do not give generic boilerplate analysis. If a section truly does not apply (e.g. no IP clause exists), say so explicitly.${priorContext}${lessonsContext}${focusClause}

---
CONTRACT BEING REVIEWED:
${vendor ? "Vendor (per Antoine): " + vendor + "\n" : ""}${title ? "Title (per Antoine): " + title + "\n" : ""}
${contractText || "(See attached document)"}
---`;

      const reply = await callClaude({
        prompt,
        apiKey,
        model,
        source: "contract-investigation",
        images: imageAttachments.length ? imageAttachments : null,
        maxTokens: 8000,
      });

      setInvestigation(reply);
      setStage("Extracting key findings...");

      // PASS 2 — distill key findings into structured form for storage + lessons learned
      const distillPrompt = `From the contract investigation below, extract structured metadata. Return ONLY valid JSON, no preamble, no markdown fences:

{
  "vendor": "best-guess vendor name from the document",
  "title": "best-guess contract title or short description",
  "key_findings": ["3-7 short findings, each one sentence"],
  "red_flags": ["the 5 red flags from the TOP 5 section, each one sentence"],
  "signing_recommendation": "SIGN AS-IS | SIGN WITH MINOR EDITS | DO NOT SIGN WITHOUT REVISION | DO NOT SIGN",
  "tags": ["short topical tags like: liability, indemnification, auto-renew, ip, hipaa, etc."]
}

INVESTIGATION:
${reply.slice(0, 12000)}`;

      let metadata = {};
      try {
        const distillReply = await callClaude({ prompt: distillPrompt, apiKey, model, source: "contract-distill", maxTokens: 1500 });
        const cleaned = distillReply.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim();
        metadata = JSON.parse(cleaned);
      } catch (e) {
        // If distill fails, fall back to minimal metadata so save still works
        metadata = { vendor: vendor || "", title: title || "", key_findings: [], red_flags: [], signing_recommendation: "", tags: [] };
      }

      // Save the investigation to history (this is what makes Kera smarter next time)
      const record = {
        id: Date.now(),
        createdAt: Date.now(),
        vendor: vendor || metadata.vendor || "",
        title: title || metadata.title || "Untitled contract",
        contractText: contractText.slice(0, 50000),
        attachmentNames: contractFiles.map(f => f.name),
        investigation: reply,
        keyFindings: metadata.key_findings || [],
        redFlags: metadata.red_flags || [],
        signingRecommendation: metadata.signing_recommendation || "",
        tags: metadata.tags || [],
        userNotes: "",
      };
      const nextInvestigations = [record, ...investigations].slice(0, 100);
      persistInvestigations(nextInvestigations);
      setActiveInvestigationId(record.id);

      // Promote any new red flags into Lessons Learned (only if not already covered)
      const existingLessons = new Set(lessonsLearned.map(l => l.lesson.toLowerCase()));
      const newLessons = (metadata.red_flags || [])
        .filter(rf => rf && !existingLessons.has(rf.toLowerCase()))
        .map(rf => ({
          id: Date.now() + Math.random(),
          lesson: rf,
          source: (vendor || metadata.vendor || "contract") + " · " + new Date().toLocaleDateString(),
          addedAt: Date.now(),
        }));
      if (newLessons.length) persistLessons([...newLessons, ...lessonsLearned].slice(0, 50));

      setStage("");
    } catch (e) {
      setError("Investigation failed: " + e.message);
      setStage("");
    } finally {
      setLoading(false);
    }
  };

  const clearWorking = () => {
    setContractText(""); setContractFiles([]); setVendor(""); setTitle(""); setFocusInstruction(""); setInvestigation(""); setError(""); setActiveInvestigationId(null);
  };

  const loadInvestigation = (id) => {
    const inv = investigations.find(i => i.id === id);
    if (!inv) return;
    setContractText(inv.contractText || "");
    setContractFiles([]);
    setVendor(inv.vendor || "");
    setTitle(inv.title || "");
    setInvestigation(inv.investigation || "");
    setActiveInvestigationId(inv.id);
    setShowHistory(false);
  };

  const deleteInvestigation = (id) => {
    persistInvestigations(investigations.filter(i => i.id !== id));
    if (activeInvestigationId === id) { setActiveInvestigationId(null); setInvestigation(""); }
  };

  const saveUserNote = (id, note) => {
    const next = investigations.map(i => i.id === id ? { ...i, userNotes: note } : i);
    persistInvestigations(next);
  };

  const removeLesson = (id) => persistLessons(lessonsLearned.filter(l => l.id !== id));

  // ---- Add to Memory / Notes ----
  const openAdd = (target) => {
    const active = investigations.find(i => i.id === activeInvestigationId);
    setAddStatus("");
    setAddModal(target);
    if (target === "memory") {
      // Default to a concise memory format
      const v = active?.vendor || vendor || "vendor";
      const t = active?.title || title || "contract";
      const findings = (active?.keyFindings || []).slice(0, 5).map(f => "- " + f).join("\n");
      setAddTitle("");
      setAddContent(`Contract reviewed for ${v} (${t}). Key findings:\n${findings || "(none captured)"}\nRecommendation: ${active?.signingRecommendation || "—"}.`);
    } else if (target === "notes") {
      const v = active?.vendor || vendor || "Vendor";
      const t = active?.title || title || "Contract";
      setAddTitle(`Contract Review — ${v} — ${t}`);
      setAddContent(investigation || "");
    }
  };
  const commitAdd = () => {
    if (addModal === "memory") {
      const text = addContent.trim();
      if (!text) { setAddStatus("Nothing to save."); return; }
      const mems = LS.get("memories", []);
      const next = [{ id: Date.now(), text, pinned: false, createdAt: Date.now(), source: "contract-review" }, ...mems];
      LS.set("memories", next);
      setAddStatus("Added to Memory.");
      setTimeout(() => { setAddModal(null); setAddStatus(""); }, 900);
    } else if (addModal === "notes") {
      const body = addContent.trim();
      const ttl = addTitle.trim() || "Contract Review";
      if (!body) { setAddStatus("Nothing to save."); return; }
      const notes = LS.get("notes", []);
      const next = [{ id: Date.now(), title: ttl, body, pinned: false, createdAt: Date.now(), source: "contract-review" }, ...notes];
      LS.set("notes", next);
      setAddStatus("Added to Notes.");
      setTimeout(() => { setAddModal(null); setAddStatus(""); }, 900);
    }
  };

  const activeInv = investigations.find(i => i.id === activeInvestigationId);
  const recommendationColor = (rec) => {
    if (!rec) return T.textDim;
    if (/DO NOT SIGN(?!\s*WITHOUT)/i.test(rec)) return T.red;
    if (/WITHOUT REVISION/i.test(rec)) return T.amber;
    if (/MINOR EDITS/i.test(rec)) return T.cyan;
    if (/AS-IS/i.test(rec)) return T.green;
    return T.textDim;
  };

  return (
    <div style={{ padding: 22 }}>
      <div style={{ marginBottom: 20, display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 16, flexWrap: "wrap" }}>
        <div>
          <div style={{ fontFamily: FF.mono, fontSize: 10, letterSpacing: 2.4, color: T.brass, textTransform: "uppercase" }}>Contract Investigator</div>
          <h1 style={{ fontFamily: FF.display, fontSize: 28, fontWeight: 500, color: T.text, margin: "4px 0 0", fontStyle: "italic", letterSpacing: -0.5 }}>
            Seasoned-attorney review. Gets sharper with every contract.
          </h1>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <Btn icon="list" variant={showHistory ? "primary" : "ghost"} onClick={() => setShowHistory(s => !s)}>History · {investigations.length}</Btn>
          {investigation && <Btn icon="trash" variant="ghost" onClick={clearWorking}>New Review</Btn>}
        </div>
      </div>

      {/* Search across all investigations */}
      <div style={{ marginBottom: 14, display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: "1 1 360px", maxWidth: 560 }}>
          <input
            type="search"
            value={search}
            onChange={e => { setSearch(e.target.value); if (e.target.value && !showHistory) setShowHistory(true); }}
            placeholder="Search past contracts — e.g. 'water invoice Washington Hospital Center' or 'Limbach indemnification'"
            style={{ width: "100%", background: T.bgSunken, border: "1px solid " + T.borderFaint, color: T.text, fontFamily: FF.mono, fontSize: 12, padding: "10px 14px 10px 36px", borderRadius: 2 }}
          />
          <span style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: T.textFaint, display: "inline-flex" }}><Icon name="search" size={13} /></span>
        </div>
        {search && (
          <span style={{ color: T.textFaint, fontFamily: FF.mono, fontSize: 11 }}>{visibleInvestigations.length} match{visibleInvestigations.length === 1 ? "" : "es"}</span>
        )}
      </div>

      {error && (
        <div style={{ background: T.red + "11", border: "1px solid " + T.red + "33", color: T.red, padding: "10px 14px", borderRadius: 2, fontFamily: FF.mono, fontSize: 11, marginBottom: 14 }}>
          {error}
        </div>
      )}

      {/* History panel — collapsible */}
      {showHistory && (
        <div style={{ marginBottom: 14 }}>
          <Panel title={search ? `Search Results · ${visibleInvestigations.length}` : `Contract History · ${investigations.length}`} accent={T.cyan} noPad>
            {visibleInvestigations.length === 0 ? (
              <div style={{ padding: "30px 20px", color: T.textFaint, fontFamily: FF.mono, fontSize: 11, textAlign: "center", letterSpacing: 1.2 }}>
                {search ? "NO MATCHES" : "NO CONTRACTS YET — RUN AN INVESTIGATION TO START BUILDING HISTORY"}
              </div>
            ) : (
              <div style={{ maxHeight: 380, overflowY: "auto" }}>
                {visibleInvestigations.map((inv, i) => (
                  <div key={inv.id}
                    onClick={() => loadInvestigation(inv.id)}
                    style={{
                      padding: "12px 16px",
                      borderBottom: i < visibleInvestigations.length - 1 ? "1px solid " + T.borderFaint : "none",
                      cursor: "pointer",
                      background: activeInvestigationId === inv.id ? T.bgSunken : "transparent",
                      display: "grid",
                      gridTemplateColumns: "1fr auto",
                      gap: 12,
                      alignItems: "start",
                    }}
                    onMouseEnter={e => { if (activeInvestigationId !== inv.id) e.currentTarget.style.background = T.bgSunken + "80"; }}
                    onMouseLeave={e => { if (activeInvestigationId !== inv.id) e.currentTarget.style.background = "transparent"; }}>
                    <div>
                      <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 4 }}>
                        <span style={{ ...TS.body, color: T.text, fontWeight: 500 }}>{inv.title || "(untitled)"}</span>
                        {inv.vendor && <span style={{ color: T.cyan, fontFamily: FF.mono, fontSize: 11 }}>· {inv.vendor}</span>}
                        {inv.signingRecommendation && (
                          <span style={{
                            color: recommendationColor(inv.signingRecommendation),
                            fontFamily: FF.mono, fontSize: 9, letterSpacing: 1, padding: "2px 6px",
                            border: "1px solid " + recommendationColor(inv.signingRecommendation) + "55", borderRadius: 2,
                          }}>{inv.signingRecommendation}</span>
                        )}
                      </div>
                      {inv.keyFindings && inv.keyFindings.length > 0 && (
                        <div style={{ color: T.textDim, fontSize: 12, lineHeight: 1.5, marginBottom: 4 }}>
                          {inv.keyFindings.slice(0, 2).join(" · ")}
                        </div>
                      )}
                      <div style={{ color: T.textFaint, fontFamily: FF.mono, fontSize: 10, letterSpacing: 0.4 }}>
                        {new Date(inv.createdAt).toLocaleString()} {inv.tags && inv.tags.length > 0 ? "· " + inv.tags.join(", ") : ""}
                      </div>
                    </div>
                    <button onClick={(e) => { e.stopPropagation(); if (confirm("Delete this investigation?")) deleteInvestigation(inv.id); }}
                      style={{ background: "transparent", border: "none", color: T.textFaint, cursor: "pointer", padding: "0 4px", fontSize: 16, lineHeight: 1 }}
                      onMouseEnter={e => e.currentTarget.style.color = T.red}
                      onMouseLeave={e => e.currentTarget.style.color = T.textFaint}>×</button>
                  </div>
                ))}
              </div>
            )}
          </Panel>
        </div>
      )}

      {/* Lessons Learned panel — the "gets smarter with use" surface */}
      {lessonsLearned.length > 0 && (
        <div style={{ marginBottom: 14 }}>
          <Panel title={`Lessons Learned · ${lessonsLearned.length}`} subtitle="Recurring red flags Kera now watches for automatically" accent={T.brass}>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {lessonsLearned.slice(0, 10).map(l => (
                <div key={l.id} style={{ display: "flex", gap: 10, alignItems: "flex-start", padding: "6px 0", borderBottom: "1px solid " + T.borderFaint }}>
                  <span style={{ color: T.brass, fontFamily: FF.mono, fontSize: 11, marginTop: 1 }}>◇</span>
                  <div style={{ flex: 1, color: T.text, fontSize: 13, lineHeight: 1.5 }}>
                    {l.lesson}
                    {l.source && <span style={{ color: T.textFaint, fontFamily: FF.mono, fontSize: 10, marginLeft: 8 }}>· {l.source}</span>}
                  </div>

// ---------- REPORTS ----------
const ReportsView = ({ apiKey, model }) => {
  const [type, setType] = useState("outage");
  const [context, setContext] = useState("");
  const [output, setOutput] = useState("");
  const [loading, setLoading] = useState(false);
  const [saved, setSaved] = useState(() => LS.get("saved_reports", []));
  const templates = {
    outage: { name:"Outage Report", sections:["Executive Summary","Timeline","Impact","Root Cause","Corrective Actions","Owner"] },
    incident: { name:"Incident Report", sections:["Incident Summary","Sequence of Events","Affected Systems","Response","Lessons Learned"] },
    rca: { name:"Root Cause Analysis", sections:["Problem Statement","Investigation Method","Findings","Root Cause","Corrective Actions"] },
    pm: { name:"PM Compliance Report", sections:["Period","Site Breakdown","Variance Analysis","Exceptions","Recommendations"] },
    vendor: { name:"Vendor Performance", sections:["Vendor","Scope","Performance vs SLA","Issues","Recommendation"] },
    weekly: { name:"Weekly Executive Summary", sections:["This Week","Wins","Risks & Blockers","Next Week","Decisions Needed"] },
  };
  const generate = async () => {
    if (!context.trim() || loading) return;
    setLoading(true); setOutput("");
    const tmpl = templates[type];
    const prompt = `Generate a polished executive ${tmpl.name} for Antoine's MedStar portfolio. Use these sections in this order:\n\n${tmpl.sections.map((s, i) => (i + 1) + ". " + s).join("\n")}\n\nCONTEXT FROM ANTOINE:\n${context}\n\nWrite in plain executive prose. Each section gets a short header in CAPS followed by the body. No bullets unless the data demands a list. Be concrete. If you don't have specifics, leave a clearly marked [TBD: specific item] placeholder rather than fabricating.`;
    try { setOutput(await callClaude({ prompt, apiKey, model })); }
    catch (e) { setOutput("Error: " + e.message); }
    finally { setLoading(false); }
  };
  // Wrap a report body with a professional Crothall/MedStar header for external sharing.
  // Plain-text format works in email, Word, Google Docs, and SMS without weird formatting.
  const brandedReport = () => {
    if (!output) return "";
    const now = new Date();
    const dateStr = now.toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
    const tmpl = templates[type];
    const divider = "═".repeat(60);
    const header =
      "MEDSTAR HEALTH  |  CROTHALL HEALTHCARE\n" +
      "Systems Maintenance — Director's Office\n" +
      divider + "\n" +
      tmpl.name.toUpperCase() + "\n" +
      "Prepared by: Antoine W. Riley Sr., Director of Systems Maintenance\n" +
      "Date: " + dateStr + "\n" +
      divider + "\n\n";
    const footer =
      "\n\n" + divider + "\n" +
      "Prepared with EXEC-OS by Antoine W. Riley Sr.\n" +
      "Director of Systems Maintenance  |  Crothall Healthcare  |  MedStar Health Portfolio\n" +
      "Direct: 484-475-5596\n";
    return header + output + footer;
  };
  const copyBranded = () => { navigator.clipboard?.writeText(brandedReport()); };
  const copyRaw = () => { navigator.clipboard?.writeText(output); };
  const downloadBranded = () => {
    const blob = new Blob([brandedReport()], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const safeName = templates[type].name.replace(/\s+/g, "_");
    const stamp = new Date().toISOString().slice(0, 10);
    a.download = `${safeName}_${stamp}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  const save = () => {
    if (!output) return;
    const item = { id: Date.now(), type, name: templates[type].name, context: context.slice(0, 100), output, ts: Date.now() };
    const next = [item, ...saved].slice(0, 20);
    setSaved(next); LS.set("saved_reports", next);
  };
  return (
    <div style={{ padding: 22 }}>
      <div style={{ marginBottom: 20 }}>
        <div style={{ fontFamily: FF.mono, fontSize: 10, letterSpacing: 2.4, color: T.brass, textTransform: "uppercase" }}>Executive Report Drafter</div>
        <h1 style={{ fontFamily: FF.display, fontSize: 28, fontWeight: 500, color: T.text, margin: "4px 0 0", fontStyle: "italic", letterSpacing: -0.5 }}>From context to leadership-ready in under a minute.</h1>
      </div>
      <div data-grid="2col" style={{ display: "grid", gridTemplateColumns: "1fr 1.4fr", gap: 14 }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <Panel title="Report Type">
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
              {Object.entries(templates).map(([k, v]) => (
                <button key={k} onClick={() => setType(k)}
                  style={{ background: type === k ? T.brass + "15" : T.bgSunken, border: "1px solid " + (type === k ? T.brass : T.border), color: type === k ? T.brass : T.text, fontFamily: FF.body, fontSize: 12, padding: "10px 12px", cursor: "pointer", borderRadius: 2, textAlign: "left", fontWeight: type === k ? 500 : 400 }}>
                  {v.name}
                </button>
              ))}
            </div>
            <div style={{ marginTop: 14, fontFamily: FF.mono, fontSize: 9, color: T.textFaint, letterSpacing: 1.2 }}>SECTIONS</div>
            <div style={{ marginTop: 6, fontFamily: FF.body, fontSize: 12, color: T.textDim, lineHeight: 1.7 }}>{templates[type].sections.join(" · ")}</div>
          </Panel>
          <Panel title="Context">
            <div style={{ display: "flex", gap: 6, marginBottom: 8, flexWrap: "wrap" }}>
              <PasteButton onPaste={(t) => setContext(context ? context + "\n\n" + t : t)} label="Paste" />
              {context && <CopyButton text={context} label="Copy" />}
              {context && (
                <button onClick={() => setContext("")} title="Clear context" style={{
                  background: "transparent", color: T.textFaint, border: "1px solid " + T.borderFaint,
                  fontFamily: FF.mono, fontSize: 10, letterSpacing: 1.2, textTransform: "uppercase",
                  padding: "5px 10px", borderRadius: 2, cursor: "pointer",
                }}>Clear</button>
              )}
            </div>
            <textarea value={context} onChange={e => setContext(e.target.value)} placeholder="Drop in raw notes, dates, names, vendor mentions, what happened, who's involved. EXEC-OS will structure it." rows={8}
              style={{ width: "100%", background: T.bgSunken, border: "1px solid " + T.border, color: T.text, fontFamily: FF.body, fontSize: 13, padding: 14, borderRadius: 2, resize: "vertical", lineHeight: 1.6 }} />
            <div style={{ marginTop: 12 }}>
              <Btn icon="spark" variant="primary" onClick={generate} loading={loading} full>Generate {templates[type].name}</Btn>
            </div>
          </Panel>
          {saved.length > 0 && (
            <Panel title={"Saved Reports — " + saved.length}>
              <div style={{ maxHeight: 200, overflowY: "auto" }}>
                {saved.map(s => (
                  <div key={s.id} onClick={() => { setType(s.type); setContext(s.context); setOutput(s.output); }}
                    style={{ padding: "8px 0", borderBottom: "1px solid " + T.border, cursor: "pointer" }}>
                    <div style={{ fontFamily: FF.body, fontSize: 12, color: T.text }}>{s.name}</div>
                    <div style={{ fontFamily: FF.mono, fontSize: 9, color: T.textFaint, marginTop: 2 }}>{new Date(s.ts).toLocaleString()}</div>
                  </div>
                ))}
              </div>
            </Panel>
          )}
        </div>
        <Panel title="Draft" accent={T.brass} action={output && (
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
            <button onClick={copyBranded} title="Copy with MedStar/Crothall letterhead" style={{ background: "transparent", border: "none", color: T.brass, fontFamily: FF.mono, fontSize: 10, cursor: "pointer", letterSpacing: 1.2 }}>COPY (BRANDED)</button>
            <button onClick={copyRaw} title="Copy report body only, no header" style={{ background: "transparent", border: "none", color: T.textDim, fontFamily: FF.mono, fontSize: 10, cursor: "pointer", letterSpacing: 1.2 }}>COPY (RAW)</button>
            <button onClick={downloadBranded} title="Download as branded .txt" style={{ background: "transparent", border: "none", color: T.brass, fontFamily: FF.mono, fontSize: 10, cursor: "pointer", letterSpacing: 1.2 }}>DOWNLOAD</button>
            <button onClick={save} style={{ background: "transparent", border: "none", color: T.brass, fontFamily: FF.mono, fontSize: 10, cursor: "pointer", letterSpacing: 1.2 }}>SAVE</button>
          </div>
        )}>
          {loading ? (
            <div style={{ color: T.cyan, fontFamily: FF.mono, fontSize: 12, display: "flex", alignItems: "center", gap: 8, padding: "60px 0", justifyContent: "center" }}>
              <span className="spin" style={{display:"inline-flex"}}><Icon name="load" size={14} /></span>Drafting {templates[type].name}...
            </div>
          ) : output ? (
            <div style={{ fontFamily: FF.body, fontSize: 14, color: T.text, lineHeight: 1.75, whiteSpace: "pre-wrap" }}>{output}</div>
          ) : (
            <div style={{ color: T.textFaint, fontFamily: FF.mono, fontSize: 11, textAlign: "center", padding: "80px 0", letterSpacing: 1 }}>SELECT TYPE + ADD CONTEXT + GENERATE</div>
          )}
        </Panel>
      </div>
    </div>
  );
};
