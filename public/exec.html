  /* ============================================================
     MOBILE RESPONSIVE LAYER
     Activated when body has class "mobile-view" (set via JS useViewport hook).
     Uses high specificity + !important to override inline styles where needed.
     ============================================================ */

  /* Touch target sizing — Apple HIG min 44px, Material 48dp */
  body.mobile-view button { min-height: 36px; min-width: 36px; }
  body.mobile-view button[data-nav] { min-height: 44px; }

  /* Sidebar — hidden by default on mobile, slides in as overlay when open */
  body.mobile-view #execos-sidebar {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    bottom: 0 !important;
    width: 240px !important;
    z-index: 200 !important;
    transform: translateX(-100%);
    transition: transform 0.22s ease;
    box-shadow: 4px 0 24px rgba(0,0,0,0.5);
  }
  body.mobile-view.sidebar-open #execos-sidebar {
    transform: translateX(0);
  }
  body.mobile-view #execos-sidebar-backdrop {
    display: block;
  }
  body.mobile-view.sidebar-open #execos-sidebar-backdrop {
    opacity: 1; pointer-events: auto;
  }
  #execos-sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 150;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  body.mobile-view #execos-hamburger { display: inline-flex !important; }

  /* Main content fills viewport on mobile */
  /* App root: use 100dvh on supported browsers to fix iOS Safari's 100vh bug
     (where 100vh includes area behind the URL bar, pushing content above the
     visible viewport). 100vh stays as the fallback for older browsers. */
  .execos-app-root {
    height: 100vh;
    height: 100dvh;
  }

  body.mobile-view #execos-main { padding: 14px !important; }

  /* Stack 2/3-column grids vertically on mobile via attribute selector */
  body.mobile-view [data-grid="2col"],
  body.mobile-view [data-grid="3col"],
  body.mobile-view [data-grid="dash-split"] {
    grid-template-columns: 1fr !important;
  }

  /* Modals — go near-fullscreen on mobile */
  body.mobile-view [data-modal] {
    width: 100% !important;
    max-width: 100% !important;
    max-height: 100vh !important;
    border-radius: 0 !important;
    border: none !important;
  }
  body.mobile-view [data-modal-backdrop] {
    padding: 0 !important;
    align-items: stretch !important;
  }

  /* Top bar — denser on mobile. The topbar lives OUTSIDE the scroll container
     (#execos-main is what scrolls), so it stays pinned at top of the root flex
     column automatically. The 100dvh on .execos-app-root above prevents iOS
     Safari's 100vh bug from pushing this above the visible viewport. */
  body.mobile-view #execos-topbar { padding: 10px 12px !important; }
  body.mobile-view #execos-topbar [data-topbar-search] { display: none !important; }
  body.mobile-view #execos-topbar [data-topbar-clock] { display: none !important; }

  /* Typography — slight downscale on phones (keep on tablets) */
  @media (max-width: 480px) {
    body.mobile-view { font-size: 14px; }
    body.mobile-view h1 { font-size: 22px !important; }
    body.mobile-view h2 { font-size: 17px !important; }
  }

  /* Calendar — Month view becomes compact week list on phone */
  body.mobile-view [data-cal-month-cell] {
    min-height: 56px !important;
    padding: 4px !important;
  }
  body.mobile-view [data-cal-toolbar] {
    flex-direction: column !important;
    align-items: stretch !important;
    gap: 8px !important;
  }
  body.mobile-view [data-cal-filters] {
    grid-template-columns: 1fr !important;
  }
  body.mobile-view [data-cal-view-toggle] {
    width: 100%;
  }

  /* Tables — horizontal scroll on overflow instead of breaking */
  body.mobile-view table { display: block; overflow-x: auto; white-space: nowrap; }

  /* Dashboard task row — column collapsing */
  body.mobile-view [data-dash-task-meta] {
    flex-wrap: wrap !important;
    gap: 6px !important;
  }

  /* Dashboard KPI strip — wrap to 2 columns instead of squishing 6 across */
  body.mobile-view [data-dash-kpis] {
    grid-template-columns: 1fr 1fr !important;
  }

  /* Dashboard split — stack vertically on mobile */
  body.mobile-view [data-grid="dash-split"] {
    grid-template-columns: 1fr !important;
  }

  /* Avoid horizontal scroll surprises */
  body.mobile-view, body.mobile-view #root { overflow-x: hidden; }

  /* Hide hamburger on desktop */
  #execos-hamburger { display: none; }

// ---------- STORAGE (localStorage + optional cloud sync) ----------
const LS = {
  get: (k, fb) => { try { const v = localStorage.getItem("execos:" + k); return v ? JSON.parse(v) : fb; } catch { return fb; } },
  set: (k, v) => {
    try { localStorage.setItem("execos:" + k, JSON.stringify(v)); } catch (e) { console.warn(e); }
    if (Cloud.enabled && !Cloud.LOCAL_ONLY_KEYS.includes(k)) Cloud.queue(k, v);
  },
};

// ---------- VIEWPORT (mobile detection + body class) ----------
const useViewport = () => {
  const [width, setWidth] = useState(typeof window !== "undefined" ? window.innerWidth : 1024);
  useEffect(() => {
    const onResize = () => setWidth(window.innerWidth);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  const isMobile = width < 768;
  useEffect(() => {
    if (typeof document === "undefined") return;
    if (isMobile) document.body.classList.add("mobile-view");
    else document.body.classList.remove("mobile-view");
  }, [isMobile]);
  return { width, isMobile };
};

// ---------- CLOUD SYNC (Supabase REST + PostgREST) ----------
const Cloud = {
  url: "", anonKey: "", workspaceKey: "", enabled: false,
  // These keys NEVER leave the device — security
  LOCAL_ONLY_KEYS: ["api_key", "supabase_config", "model", "voice_mode"],
  // Pending writes (debounced)
  _pending: new Map(),
  _timers: new Map(),
  _statusListeners: [],
  _status: { state: "off", lastSync: 0, error: "" },

  configure(cfg) {
    this.url = (cfg.url || "").replace(/\/$/, "");
    this.anonKey = cfg.anonKey || "";
    this.workspaceKey = cfg.workspaceKey || "";
    this.enabled = !!(this.url && this.anonKey && this.workspaceKey);
    LS.set("supabase_config", { url: this.url, anonKey: this.anonKey, workspaceKey: this.workspaceKey });
    this._emit({ state: this.enabled ? "idle" : "off" });
  },
  disable() {
    this.enabled = false;
    localStorage.removeItem("execos:supabase_config");
    this._emit({ state: "off" });
  },
  onStatus(cb) { this._statusListeners.push(cb); return () => { this._statusListeners = this._statusListeners.filter(c => c !== cb); }; },
  _emit(patch) { this._status = { ...this._status, ...patch }; this._statusListeners.forEach(cb => cb(this._status)); },
  _headers() {
    return {
      "apikey": this.anonKey,
      "Authorization": "Bearer " + this.anonKey,
      "Content-Type": "application/json",
    };
  },

  queue(key, value) {
    this._pending.set(key, value);
    if (this._timers.has(key)) clearTimeout(this._timers.get(key));
    this._timers.set(key, setTimeout(() => this._flush(key), 1200));
  },

  async _flush(key) {
    if (!this.enabled) return;
    const value = this._pending.get(key);
    this._pending.delete(key);
    this._timers.delete(key);
    this._emit({ state: "syncing", error: "" });
    try {
      const body = [{
        workspace_key: this.workspaceKey,
        data_key: key,
        value: value,
        updated_at: new Date().toISOString(),
      }];
      const res = await fetch(this.url + "/rest/v1/user_data?on_conflict=workspace_key,data_key", {
        method: "POST",
        headers: { ...this._headers(), "Prefer": "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        const txt = await res.text();
        throw new Error("Sync " + res.status + ": " + txt.slice(0, 200));
      }
      this._emit({ state: "ok", lastSync: Date.now(), error: "" });
    } catch (e) {
      this._emit({ state: "error", error: e.message });
    }
  },

  async pullAll() {
    if (!this.enabled) return { merged: 0 };
    this._emit({ state: "syncing", error: "" });
    try {
      const res = await fetch(
        this.url + "/rest/v1/user_data?workspace_key=eq." + encodeURIComponent(this.workspaceKey) + "&select=data_key,value,updated_at",
        { headers: this._headers() }
      );
      if (!res.ok) throw new Error("Pull " + res.status);
      const rows = await res.json();
      let merged = 0;
      for (const row of rows) {
        if (Cloud.LOCAL_ONLY_KEYS.includes(row.data_key)) continue;
        // Cloud always wins on pull
        localStorage.setItem("execos:" + row.data_key, JSON.stringify(row.value));
        merged++;
      }
      this._emit({ state: "ok", lastSync: Date.now(), error: "" });
      return { merged };
    } catch (e) {
      this._emit({ state: "error", error: e.message });
      throw e;
    }
  },

  async testConnection() {
    if (!this.url || !this.anonKey) throw new Error("URL or anon key missing");
    const res = await fetch(this.url + "/rest/v1/user_data?select=workspace_key&limit=1", { headers: this._headers() });
    if (!res.ok) {
      const txt = await res.text();
      throw new Error("HTTP " + res.status + ": " + txt.slice(0, 200));
    }
    return true;
  },
};

// Auto-load saved cloud config on boot
(function bootCloud() {
  const cfg = LS.get("supabase_config", null);
  if (cfg && cfg.url && cfg.anonKey && cfg.workspaceKey) {
    Cloud.url = cfg.url; Cloud.anonKey = cfg.anonKey; Cloud.workspaceKey = cfg.workspaceKey;
    Cloud.enabled = true;
    // Pull cloud data on boot (overwrites local)
    Cloud.pullAll().catch(e => console.warn("Boot pull failed:", e.message));
  }
})();

// ---------- CSV PARSER ----------
function parseCsv(text) {
  const out = [];
  let row = [], cell = "", inQ = false, i = 0;
  while (i < text.length) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i+1] === '"') { cell += '"'; i += 2; continue; }
      if (c === '"') { inQ = false; i++; continue; }
      cell += c; i++;
    } else {
      if (c === '"') { inQ = true; i++; continue; }
      if (c === ',') { row.push(cell); cell = ""; i++; continue; }
      if (c === '\r') { i++; continue; }
      if (c === '\n') { row.push(cell); out.push(row); row = []; cell = ""; i++; continue; }
      cell += c; i++;
    }
  }
  if (cell.length || row.length) { row.push(cell); out.push(row); }
  if (out.length === 0) return { headers: [], rows: [] };
  const headers = out[0];
  const rows = out.slice(1).map(r => {
    const o = {};
    headers.forEach((h, idx) => { o[h] = r[idx] || ""; });
    return o;
  });
  return { headers, rows };
}

// ---------- API CALL ----------
async function callClaude({ prompt, system = null, history = [], apiKey, model, source = "terminal", includeCredentials = false, images = null, maxTokens = 2048 }) {
  if (!apiKey) throw new Error("No API key set. Open Settings (gear icon) and paste your Anthropic API key.");

  // Route to the right model tier based on source + smart_routing setting.
  const finalModel = pickModel(source, model);

  // Build the system prompt as an array of blocks, applying prompt caching to stable
  // prefixes for ~90% cost reduction on repeated input. Order matters: most stable first.
  // Cache breakpoint sits on the LAST STABLE block so dynamic per-call context (sites,
  // tasks) doesn't invalidate the cache.
  const stableBlocks = [];

  // Block 1: CORE identity + voice + Antoine context (every call)
  stableBlocks.push({ type: "text", text: system || SYSTEM_PROMPT_CORE });

  // Block 2: PLATFORM_KNOWLEDGE (only for Terminal / Brief / Dashboard task actions)
  if (system === null && PLATFORM_AWARE_SOURCES.has(source)) {
    stableBlocks.push({ type: "text", text: PLATFORM_KNOWLEDGE });
  }

  // Block 3: Long-term memory (stable across a session)
  const memories = LS.get("memories", []);
  if (memories.length) {
    const memText = "# LONG-TERM MEMORY\nThings Antoine has explicitly asked you to remember. Use these naturally when relevant.\n" +
      memories.map((m, i) => `${i + 1}. ${m.text}`).join("\n");
    stableBlocks.push({ type: "text", text: memText });
  }

  // Block 4: Notes — tiered injection so Kera sees ALL your knowledge, not just
  // pinned. Pinned and "active" notes go in FULL (these are what you're working
  // on right now). Everything else goes in as a one-line index (title + first
  // ~200 chars) so Kera knows what exists and can ask for the full text if she
  // needs it. Hard char cap prevents costs from spiraling as the notes pile up.
  const notes = LS.get("notes", []);
  if (notes.length) {
    const NOTE_BUDGET = 40000; // hard cap on total note context (~10K tokens)
    const pinnedNotes = notes.filter(n => n.pinned);
    const activeNotes = notes.filter(n => !n.pinned && n.active);
    const otherNotes = notes.filter(n => !n.pinned && !n.active);

    const parts = ["# NOTES — YOUR KNOWLEDGE BASE",
      "These are the user's working notes. Treat them as authoritative for project status, decisions, vendor details, and anything they've recorded. When asked for an update, status, or recommendation on a project, scan the matching notes first. Cite which note(s) you're drawing from when relevant."];
    let used = 0;
    const fmtNote = (n, truncate) => {
      const header = `## ${n.title || "(untitled)"}${n.project ? "  ·  [project: " + n.project + "]" : ""}${n.updatedAt ? "  ·  [updated: " + new Date(n.updatedAt).toISOString().slice(0, 10) + "]" : ""}`;
      const body = truncate ? (n.body || "").slice(0, truncate) + ((n.body || "").length > truncate ? " …" : "") : (n.body || "");
      return header + "\n" + body;
    };

    if (pinnedNotes.length) {
      parts.push("\n### ★ PINNED (always in active context)");
      for (const n of pinnedNotes) {
        const t = fmtNote(n, 6000);
        if (used + t.length > NOTE_BUDGET) break;
        parts.push(t); used += t.length;
      }
    }
    if (activeNotes.length && used < NOTE_BUDGET) {
      parts.push("\n### ⏵ ACTIVE PROJECTS (recent work, full text)");
      // Sort active by updatedAt desc so most recent is most prominent
      const sorted = [...activeNotes].sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
      for (const n of sorted) {
        const t = fmtNote(n, 4000);
        if (used + t.length > NOTE_BUDGET) break;
        parts.push(t); used += t.length;
      }
    }
    if (otherNotes.length && used < NOTE_BUDGET) {
      parts.push("\n### ☰ INDEX (titles + first lines — ask me for full text)");
      const sorted = [...otherNotes].sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
      for (const n of sorted) {
        const t = fmtNote(n, 200);
        if (used + t.length > NOTE_BUDGET) break;
        parts.push(t); used += t.length;
      }
    }

    if (parts.length > 2) {
      stableBlocks.push({ type: "text", text: parts.join("\n\n") });
    }
  }

  // Mark the last stable block with cache_control. Anthropic caches the cumulative
  // prefix up to that breakpoint. Subsequent identical prefixes hit the cache at 10%
  // of input price. Cache TTL is 5 minutes (resets on every hit).
  if (stableBlocks.length > 0) {
    stableBlocks[stableBlocks.length - 1].cache_control = { type: "ephemeral" };
  }

  // VOLATILE blocks (change per call — NOT cached):
  const volatileBlocks = [];

  // Site profiles: any site code mentioned in the prompt OR history triggers full profile.
  const sites = LS.get("sites", []);
  if (sites.length) {
    const haystack = (prompt + " " + history.map(m => m.content).join(" ")).toUpperCase();
    const SITE_CODES = ["MWHC", "MGUH", "MMMC", "MUMH", "MHH", "MGSH", "MSMHC", "MSMH", "MNRH", "MFSHC"];
    const mentioned = SITE_CODES.filter(c => new RegExp("\\b" + c + "\\b").test(haystack));
    if (mentioned.length) {
      const fullProfiles = sites.filter(s => mentioned.includes(s.code));
      if (fullProfiles.length) {
        volatileBlocks.push({ type: "text", text:
          "# SITE PROFILES (referenced in this query)\n" +
          fullProfiles.map(s => formatSiteForContext(s, includeCredentials)).join("\n\n---\n\n")
        });
      }
    } else {
      volatileBlocks.push({ type: "text", text:
        "# PORTFOLIO SITES (summary only — ask about a specific site code for full detail)\n" +
        sites.map(s => `${s.code}: ${s.name || "[name TBD]"} — Director: ${s.director || "TBD"}`).join("\n")
      });
    }
  }

  // Live Smartsheet tasks (changes per call — not cached)
  const liveTasks = (typeof window !== "undefined" && window.EXEC_OS_LIVE_TASKS) || [];
  if (liveTasks.length) {
    const isDone = (s) => /complete|done|closed/i.test(s || "");
    const openTasks = liveTasks.filter(t => !isDone(t.status)).slice(0, 50);
    if (openTasks.length) {
      let taskText = "# LIVE PRIORITY TASKS (from Smartsheet, updated automatically)\n";
      taskText += openTasks.map((t, i) => {
        const parts = [`${i + 1}. ${t.task || "(untitled)"}`];
        const meta = [];
        if (t.status) meta.push("status: " + t.status);
        if (t.owner) meta.push("owner: " + t.owner);
        if (t.dueDate) meta.push("due: " + t.dueDate);
        if (t.priority) meta.push("priority: " + t.priority);
        if (t.site) meta.push("site: " + t.site);
        if (meta.length) parts.push("   [" + meta.join(" · ") + "]");
        if (t.notes) parts.push("   notes: " + t.notes.slice(0, 200));
        return parts.join("\n");
      }).join("\n");
      volatileBlocks.push({ type: "text", text: taskText });
    }
  }

  // Final system array: stable (cached) blocks first, then volatile blocks
  const systemArray = [...stableBlocks, ...volatileBlocks];

  // Build the user message — if images are provided, use the multimodal content array format.
  // PDFs and images both come through here. PDFs use document-type blocks; images use image-type blocks.
  let userContent;
  if (images && images.length) {
    userContent = [
      ...images.map(img => {
        const isPdf = img.kind === "pdf" || img.mediaType === "application/pdf";
        return {
          type: isPdf ? "document" : "image",
          source: {
            type: "base64",
            media_type: img.mediaType || "image/jpeg",
            data: img.data, // base64 without data: prefix
          },
        };
      }),
      { type: "text", text: prompt },
    ];
  } else {
    userContent = prompt;
  }
  const messages = [...history, { role: "user", content: userContent }];
  const startedAt = Date.now();
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({ model: finalModel, max_tokens: maxTokens, system: systemArray, messages }),
    });
    if (!res.ok) {
      const txt = await res.text();
      throw new Error("API " + res.status + ": " + txt.slice(0, 200));
    }
    const data = await res.json();
    const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
    const inputTokens = data.usage?.input_tokens || 0;
    const outputTokens = data.usage?.output_tokens || 0;
    const cacheCreate = data.usage?.cache_creation_input_tokens || 0;
    const cacheRead = data.usage?.cache_read_input_tokens || 0;
    appendAudit({ source, prompt: prompt.slice(0, 300), promptLen: prompt.length, replyLen: text.length, ms: Date.now() - startedAt, model: finalModel, status: "ok", inputTokens, outputTokens, cacheCreate, cacheRead });
    updateMonthlyTokens(inputTokens, outputTokens, cacheCreate, cacheRead);
    return text || "(no response)";
  } catch (e) {
    appendAudit({ source, prompt: prompt.slice(0, 300), promptLen: prompt.length, ms: Date.now() - startedAt, model: finalModel, status: "error", error: e.message });
    throw e;
  }
}

function appendAudit(entry) {
  const log = LS.get("audit_log", []);
  log.unshift({ ts: Date.now(), ...entry });
  LS.set("audit_log", log.slice(0, 200));
}

// Rolling monthly token counter — survives the 200-entry audit log rotation.
// Shape: { "2026-05": { input, output, cacheCreate, cacheRead, calls }, ... }
// Old months are pruned after 6 months to keep LS lean.
function updateMonthlyTokens(input, output, cacheCreate = 0, cacheRead = 0) {
  const now = new Date();
  const key = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
  const data = LS.get("monthly_tokens", {});
  const m = data[key] || { input: 0, output: 0, cacheCreate: 0, cacheRead: 0, calls: 0 };
  m.input += input || 0;
  m.output += output || 0;
  m.cacheCreate += cacheCreate || 0;
  m.cacheRead += cacheRead || 0;
  m.calls += 1;
  data[key] = m;
  // Prune older than 6 months
  const cutoff = new Date(now.getFullYear(), now.getMonth() - 6, 1);
  for (const k of Object.keys(data)) {
    const [yr, mo] = k.split("-").map(Number);
    if (new Date(yr, mo - 1, 1) < cutoff) delete data[k];
  }
  LS.set("monthly_tokens", data);
  window.dispatchEvent(new Event("execos:tokens-updated"));
}

// Helper for the indicator: get this month's total + budget + cache stats.
function getMonthlyUsage() {
  const now = new Date();
  const key = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
  const data = LS.get("monthly_tokens", {});
  // Per-field defaults — if a legacy entry is missing cacheCreate/cacheRead
  // (from before those fields existed) we MUST coerce to 0, not let the
  // multiplication propagate NaN through the entire usage calculation.
  const raw = data[key] || {};
  const m = {
    input: Number(raw.input) || 0,
    output: Number(raw.output) || 0,
    cacheCreate: Number(raw.cacheCreate) || 0,
    cacheRead: Number(raw.cacheRead) || 0,
    calls: Number(raw.calls) || 0,
  };
  const budget = parseInt(LS.get("token_budget", 0), 10) || 0;
  // Effective "billable" input tokens for budget tracking:
  // Cache hits cost 10% of input, cache writes cost 125% — so weight them.
  const billableInput = m.input + (m.cacheCreate * 1.25) + (m.cacheRead * 0.1);
  return {
    monthKey: key,
    input: m.input,
    output: m.output,
    cacheCreate: m.cacheCreate,
    cacheRead: m.cacheRead,
    total: Math.round(billableInput + m.output),
    rawTotal: m.input + m.output + m.cacheCreate + m.cacheRead,
    calls: m.calls,
    budget,
    percent: budget > 0 ? (billableInput + m.output) / budget * 100 : null,
    resetDate: new Date(now.getFullYear(), now.getMonth() + 1, 1),
    cacheRatio: m.cacheRead > 0 ? m.cacheRead / (m.input + m.cacheCreate + m.cacheRead) : 0,
  };
}

// ---------- TOP BAR ----------
// Subtle usage indicator — sits in the top bar status cluster. Reads monthly token totals
// and budget from LS. Shows nothing if no budget is set (opt-in only). Color graduates
// from dim to amber (>=75%) to red (>=95%). Click opens a detail popover.
const UsageIndicator = () => {
  const [usage, setUsage] = useState(() => getMonthlyUsage());
  const [open, setOpen] = useState(false);
  const popRef = useRef(null);
  const btnRef = useRef(null);

  useEffect(() => {
    const refresh = () => setUsage(getMonthlyUsage());
    window.addEventListener("execos:tokens-updated", refresh);
    // Also refresh when budget is changed in Settings
    window.addEventListener("storage", refresh);
    // Refresh every 60s in case the month rolled over while the tab was open
    const t = setInterval(refresh, 60000);
    return () => {
      window.removeEventListener("execos:tokens-updated", refresh);
      window.removeEventListener("storage", refresh);
      clearInterval(t);
    };
  }, []);

  useEffect(() => {
    if (!open) return;
    const onClickOut = (e) => {
      if (popRef.current && !popRef.current.contains(e.target) && btnRef.current && !btnRef.current.contains(e.target)) {
        setOpen(false);
      }
    };
    document.addEventListener("mousedown", onClickOut);
    return () => document.removeEventListener("mousedown", onClickOut);
  }, [open]);

  // No budget set → hide entirely. Indicator is opt-in.
  if (!usage.budget || usage.budget <= 0) return null;

  // Guard against NaN — if percent is null/NaN for any reason, hide the chip
  // rather than show "NaN%". Better to be silent than wrong.
  if (usage.percent === null || !Number.isFinite(usage.percent)) return null;

  const pct = Math.round(usage.percent);
  const over = pct > 100;
  const color = pct >= 95 ? T.red : pct >= 75 ? T.amber : T.textDim;
  const label = over ? "100%+" : pct + "%";

  const fmtNum = (n) => n >= 1000000 ? (n / 1000000).toFixed(2) + "M" : n >= 1000 ? (n / 1000).toFixed(1) + "K" : String(n);
  const daysToReset = Math.max(1, Math.ceil((usage.resetDate - new Date()) / 86400000));

  return (
    <div style={{ position: "relative", display: "flex", alignItems: "center" }}>
      <button ref={btnRef} onClick={() => setOpen(o => !o)} title="Monthly token usage — click for details" style={{
        background: "transparent", border: "none", padding: "0 2px", margin: 0,
        cursor: "pointer", display: "flex", alignItems: "center", gap: S.sm,
        height: 24,
      }}>
        <div style={{
          width: 6, height: 6, borderRadius: 3, background: color,
          boxShadow: pct >= 95 ? `0 0 5px ${color}aa` : "none",
        }} />
        <span style={{ ...TS.micro, color: T.textDim, fontFamily: FF.mono, textTransform: "uppercase" }}>USE</span>
        <span style={{ fontFamily: FF.mono, fontSize: 10, color, fontVariantNumeric: "tabular-nums", letterSpacing: 0.4 }}>{label}</span>
      </button>
      {open && (
        <div ref={popRef} style={{
          position: "absolute", top: 32, right: 0, zIndex: 200,
          background: T.bgRaised, border: "1px solid " + T.borderBright, borderRadius: 4,
          padding: "14px 16px", minWidth: 240,
          boxShadow: "0 8px 24px rgba(0,0,0,0.5)",
          fontFamily: FF.body,
        }}>
          <div style={{ fontFamily: FF.mono, fontSize: 10, letterSpacing: 1.4, color: T.brass, textTransform: "uppercase", marginBottom: 8 }}>
            Usage — {usage.monthKey}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "auto 1fr", gap: "6px 14px", fontSize: 12 }}>
            <span style={{ color: T.textDim }}>Billable</span>
            <span style={{ fontFamily: FF.mono, color: T.text, textAlign: "right" }}>{fmtNum(usage.total)} tok</span>
            <span style={{ color: T.textDim }}>Budget</span>
            <span style={{ fontFamily: FF.mono, color: T.text, textAlign: "right" }}>{fmtNum(usage.budget)} tok</span>
            <span style={{ color: T.textDim }}>Percent</span>
            <span style={{ fontFamily: FF.mono, color, textAlign: "right" }}>{over ? pct + "% (over)" : pct + "%"}</span>
            <span style={{ color: T.textDim }}>Input</span>
            <span style={{ fontFamily: FF.mono, color: T.textDim, textAlign: "right" }}>{fmtNum(usage.input)}</span>
            <span style={{ color: T.textDim }}>Output</span>
            <span style={{ fontFamily: FF.mono, color: T.textDim, textAlign: "right" }}>{fmtNum(usage.output)}</span>
            {usage.cacheRead > 0 && (<>
              <span style={{ color: T.green }}>Cache hit</span>
              <span style={{ fontFamily: FF.mono, color: T.green, textAlign: "right" }}>{fmtNum(usage.cacheRead)} (90% off)</span>
            </>)}
            {usage.cacheCreate > 0 && (<>
              <span style={{ color: T.textDim }}>Cache write</span>
              <span style={{ fontFamily: FF.mono, color: T.textDim, textAlign: "right" }}>{fmtNum(usage.cacheCreate)}</span>
            </>)}
            <span style={{ color: T.textDim }}>Calls</span>
            <span style={{ fontFamily: FF.mono, color: T.text, textAlign: "right" }}>{usage.calls}</span>
            <span style={{ color: T.textDim }}>Resets</span>
            <span style={{ fontFamily: FF.mono, color: T.text, textAlign: "right" }}>in {daysToReset}d</span>
          </div>
          <div style={{ marginTop: 10, height: 4, background: T.bgSunken, borderRadius: 2, overflow: "hidden" }}>
            <div style={{ height: "100%", width: Math.min(100, pct) + "%", background: color, transition: "width 0.3s" }} />
          </div>
          <div style={{ marginTop: 10, fontSize: 11, color: T.textFaint, lineHeight: 1.5 }}>
            Counter resets on the 1st of each month. Set or change your budget in Settings → AI / Model.
          </div>
        </div>
      )}
    </div>
  );
};

// Reusable Paste button — reads from clipboard via the Clipboard API.
// On success calls onPaste(text). Shows brief visual feedback ("Pasted!" / "Denied"
// / "Empty") so the user knows what happened. Falls back gracefully on browsers
// that don't allow clipboard reads (older Safari, certain mobile contexts).
const PasteButton = ({ onPaste, label = "Paste", size = "sm", style = {} }) => {
  const [status, setStatus] = useState("idle");
  const handlePaste = async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (!text || !text.trim()) {
        setStatus("empty");
        setTimeout(() => setStatus("idle"), 1800);
        return;
      }
      onPaste(text);
      setStatus("ok");
      setTimeout(() => setStatus("idle"), 1500);
    } catch (e) {
      // Permission denied or unsupported (older Safari, http context, iframe restrictions).
      setStatus("denied");
      setTimeout(() => setStatus("idle"), 2200);
    }
  };
  const isSmall = size === "sm";
  const styleByStatus = {
    idle:   { background: T.bgSunken, color: T.textDim, border: "1px solid " + T.border },
    ok:     { background: T.green + "22", color: T.green, border: "1px solid " + T.green },
    empty:  { background: T.amber + "22", color: T.amber, border: "1px solid " + T.amber },
    denied: { background: T.red + "22", color: T.red, border: "1px solid " + T.red },
  };
  const labelByStatus = { idle: label, ok: "Pasted!", empty: "Clipboard empty", denied: "Permission denied" };
  return (
    <button onClick={handlePaste} title="Paste from clipboard" style={{
      ...styleByStatus[status],
      fontFamily: FF.mono,
      fontSize: isSmall ? 10 : 11,
      letterSpacing: 1.2,
      textTransform: "uppercase",
      padding: isSmall ? "5px 10px" : "7px 14px",
      borderRadius: 2,
      cursor: "pointer",
      display: "inline-flex",
      alignItems: "center",
      gap: 6,
      transition: "background 0.15s, color 0.15s, border-color 0.15s",
      ...style,
    }}>
      <Icon name={status === "ok" ? "check" : "file"} size={isSmall ? 11 : 12} />
      {labelByStatus[status]}
    </button>
  );
};

// Reusable Copy button — writes given text to clipboard.
const CopyButton = ({ text, label = "Copy", size = "sm", style = {} }) => {
  const [status, setStatus] = useState("idle");
  const handleCopy = async () => {
    try {
      await navigator.clipboard.writeText(text || "");
      setStatus("ok");
      setTimeout(() => setStatus("idle"), 1500);
    } catch (e) {
      // Fallback: legacy execCommand for older browsers / iframe restrictions
      try {
        const ta = document.createElement("textarea");
        ta.value = text || "";
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        setStatus(ok ? "ok" : "denied");
      } catch {
        setStatus("denied");
      }
      setTimeout(() => setStatus("idle"), 2200);
    }
  };
  const isSmall = size === "sm";
  const styleByStatus = {
    idle:   { background: T.bgSunken, color: T.textDim, border: "1px solid " + T.border },
    ok:     { background: T.green + "22", color: T.green, border: "1px solid " + T.green },
    denied: { background: T.red + "22", color: T.red, border: "1px solid " + T.red },
  };
  const labelByStatus = { idle: label, ok: "Copied!", denied: "Permission denied" };
  return (
    <button onClick={handleCopy} title="Copy to clipboard" disabled={!text} style={{
      ...styleByStatus[status],
      fontFamily: FF.mono, fontSize: isSmall ? 10 : 11, letterSpacing: 1.2, textTransform: "uppercase",
      padding: isSmall ? "5px 10px" : "7px 14px", borderRadius: 2,
      cursor: text ? "pointer" : "not-allowed",
      opacity: text ? 1 : 0.4,
      display: "inline-flex", alignItems: "center", gap: 6,
      transition: "background 0.15s, color 0.15s, border-color 0.15s",
      ...style,
    }}>
      <Icon name={status === "ok" ? "check" : "file"} size={isSmall ? 11 : 12} />
      {labelByStatus[status]}
    </button>
  );
};

// Live tasks are mirrored to window so callClaude injects them as context.
window.EXEC_OS_LIVE_TASKS = window.EXEC_OS_LIVE_TASKS || [];

// Task classification helpers (single source of truth)
const TaskUtil = {
  isDone: (t) => /complete|done|closed/i.test(t?.status || ""),
  isBlocked: (t) => /block|hold|stuck|wait/i.test(t?.status || ""),
  isInProgress: (t) => /progress|active|started|nearing/i.test(t?.status || ""),
  isHigh: (t) => /high|urgent|critical|^1$/i.test(t?.priority || "") || /priority/i.test(t?.raw?.Category || ""),
  isOverdue: (t) => {
    if (!t?.dueDate || TaskUtil.isDone(t)) return false;
    const due = new Date(t.dueDate);
    return !isNaN(due.getTime()) && due < new Date();
  },
  ageInDays: (t) => {
    // Age = how long the task has been open. Only valid if we have a real
    // creation/start date. Falling back to dueDate gave negative values for
    // tasks due in the future (misleading "−23d in queue").
    const start = t?.startDate || t?.createdDate || t?.created || t?.raw?.["Created Date"] || t?.raw?.Created;
    if (!start) return null;
    const s = new Date(start);
    if (isNaN(s.getTime())) return null;
    const days = Math.floor((Date.now() - s.getTime()) / 86400000);
    return days < 0 ? null : days;
  },
  statusColor: (t) => {
    if (TaskUtil.isDone(t)) return T.green;
    if (TaskUtil.isBlocked(t)) return T.red;
    if (TaskUtil.isInProgress(t)) return T.cyan;
    return T.amber;
  },
};

// Compute KPIs from real data sources
function computeKpis(tasks, sites, audit) {
  const openTasks = tasks.filter(t => !TaskUtil.isDone(t));
  const overdue = tasks.filter(TaskUtil.isOverdue);
  const blocked = tasks.filter(t => TaskUtil.isBlocked(t) && !TaskUtil.isDone(t));
  const mine = openTasks.filter(t => /antoine|riley/i.test(t.owner || ""));
  const completedRecent = tasks.filter(t => {
    if (!TaskUtil.isDone(t)) return false;
    const end = t.raw?.["End Date"];
    if (!end) return false;
    const d = new Date(end);
    if (isNaN(d.getTime())) return false;
    return (Date.now() - d.getTime()) < 7 * 86400000;
  });

  // Per-owner load
  const ownerLoad = {};
  for (const t of openTasks) {
    const o = t.owner || "Unassigned";
    ownerLoad[o] = (ownerLoad[o] || 0) + 1;
  }
  const topOwner = Object.entries(ownerLoad).sort((a, b) => b[1] - a[1])[0];

  // Sites status
  const alertSites = sites.filter(s => s.status === "alert").length;
  const watchSites = sites.filter(s => s.status === "watch").length;

  // Audit
  const auditToday = audit.filter(a => (Date.now() - new Date(a.ts).getTime()) < 86400000);
  const auditErrors = auditToday.filter(a => a.status === "error").length;

  return {
    openTasks: openTasks.length,
    overdue: overdue.length,
    blocked: blocked.length,
    mine: mine.length,
    completedThisWeek: completedRecent.length,
    topOwner: topOwner ? { name: topOwner[0], count: topOwner[1] } : null,
    alertSites, watchSites,
    auditTodayCount: auditToday.length,
    auditErrors,
  };
}

const Dashboard = ({ onJump, apiKey, model }) => {
  // Saved URL wins; otherwise fall back to baked-in default so a fresh
  // device shows priority tasks immediately instead of an empty setup form.
  // Effective value: saved (if non-empty) OR default.
  const savedUrl = LS.get("tasks_api_url", "");
  const [tasksApi, setTasksApi] = useState(() => (savedUrl && savedUrl.trim()) ? savedUrl : EXEC_OS_DEFAULTS.smartsheetUrl);
  // If no saved URL existed, persist the default so cloud sync sees it too
  // (otherwise the next cloud pull will null it out across devices).
  useEffect(() => {
    if (!savedUrl || !savedUrl.trim()) {
      LS.set("tasks_api_url", EXEC_OS_DEFAULTS.smartsheetUrl);
    }
  }, []);
  const [tasks, setTasks] = useState([]);
  const [sheetName, setSheetName] = useState("");
  const [fetchedAt, setFetchedAt] = useState(0);
  const [tasksError, setTasksError] = useState("");
  const [tasksLoading, setTasksLoading] = useState(false);
  const [editing, setEditing] = useState(false);
  const [draftTasksApi, setDraftTasksApi] = useState("");
  const [refreshTick, setRefreshTick] = useState(0);
  const [filter, setFilter] = useState("open");
  const [siteFilter, setSiteFilter] = useState("");
  const [sortBy, setSortBy] = useState({ field: "default", dir: "asc" });
  const [sites] = useState(() => LS.get("sites", []));
  const [audit] = useState(() => LS.get("audit_log", []));
  // Detail panel state — when a task row is clicked, this opens the side panel
  const [activeTask, setActiveTask] = useState(null);
  const [taskAiBusy, setTaskAiBusy] = useState("");
  const [taskAiOutput, setTaskAiOutput] = useState("");
  const [, forceRefresh] = useState(0);
  // Close detail panel on global Escape
  useEffect(() => {
    const onEscape = () => { setActiveTask(null); setTaskAiOutput(""); };
    window.addEventListener("execos:escape", onEscape);
    return () => window.removeEventListener("execos:escape", onEscape);
  }, []);

  useEffect(() => {
    if (!tasksApi) { setTasks([]); setTasksError(""); window.EXEC_OS_LIVE_TASKS = []; return; }
    let cancelled = false;
    setTasksLoading(true); setTasksError("");
    fetch(tasksApi, { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(data => {
        if (cancelled) return;
        const arr = Array.isArray(data) ? data : (data.tasks || data.rows || data.data || []);
        setTasks(arr);
        setSheetName(data.sheetName || "");
        setFetchedAt(Date.now());
        window.EXEC_OS_LIVE_TASKS = arr;
        window.dispatchEvent(new Event("execos:data-updated"));
      })
      .catch(e => {
        if (cancelled) return;
        const msg = e.message || String(e);
        if (msg.includes("Failed to fetch")) setTasksError("Cannot reach endpoint. Check URL or Vercel deploy.");
        else if (msg.includes("HTTP 401")) setTasksError("Token rejected. Verify EXEC_OS_PUBLIC_TOKEN matches.");
        else if (msg.includes("HTTP 404")) setTasksError("Endpoint not found. The route may not be deployed.");
        else setTasksError(msg);
      })
      .finally(() => { if (!cancelled) setTasksLoading(false); });
    return () => { cancelled = true; };
  }, [tasksApi, refreshTick]);

  useEffect(() => {
    if (!tasksApi) return;
    const t = setInterval(() => setRefreshTick(x => x + 1), 60000);
    return () => clearInterval(t);
  }, [tasksApi]);

  // Force-update timestamp display every second
  useEffect(() => {
    const t = setInterval(() => forceRefresh(x => x + 1), 30000);
    return () => clearInterval(t);
  }, []);

  const saveUrls = () => { const a = draftTasksApi.trim(); setTasksApi(a); LS.set("tasks_api_url", a); setEditing(false); };
  const startEdit = () => { setDraftTasksApi(tasksApi); setEditing(true); };

  const kpis = computeKpis(tasks, sites, audit);

  // Filter + sort
  const filteredTasks = tasks.filter(t => {
    if (siteFilter && (t.site || "").toUpperCase() !== siteFilter) return false;
    if (filter === "all") return true;
    if (filter === "overdue") return TaskUtil.isOverdue(t);
    if (filter === "high") return TaskUtil.isHigh(t) && !TaskUtil.isDone(t);
    if (filter === "blocked") return TaskUtil.isBlocked(t) && !TaskUtil.isDone(t);
    if (filter === "mine") return /antoine|riley/i.test(t.owner || "") && !TaskUtil.isDone(t);
    return !TaskUtil.isDone(t);
  });

  const sortedTasks = [...filteredTasks].sort((a, b) => {
    if (sortBy.field === "default") {
      const ad = TaskUtil.isDone(a) ? 1 : 0;
      const bd = TaskUtil.isDone(b) ? 1 : 0;
      if (ad !== bd) return ad - bd;
      const ao = TaskUtil.isOverdue(a) ? 0 : 1;
      const bo = TaskUtil.isOverdue(b) ? 0 : 1;
      if (ao !== bo) return ao - bo;
      return 0;
    }
    const dir = sortBy.dir === "asc" ? 1 : -1;
    const av = (a[sortBy.field] || "").toString().toLowerCase();
    const bv = (b[sortBy.field] || "").toString().toLowerCase();
    return av < bv ? -dir : av > bv ? dir : 0;
  });

  const sitesInTasks = [...new Set(tasks.map(t => (t.site || "").toUpperCase()).filter(Boolean))].sort();

  const lastUpdate = fetchedAt ? Math.max(1, Math.floor((Date.now() - fetchedAt) / 1000)) : null;

  // Alerts: overdue tasks + blocked tasks + sites in alert
  const alerts = [];
  if (kpis.overdue > 0) alerts.push({ level: "alert", text: `${kpis.overdue} ${kpis.overdue === 1 ? "task is" : "tasks are"} overdue`, action: () => setFilter("overdue") });
  if (kpis.blocked > 0) alerts.push({ level: "warn", text: `${kpis.blocked} ${kpis.blocked === 1 ? "task is" : "tasks are"} blocked or on hold`, action: () => setFilter("blocked") });
  if (kpis.alertSites > 0) alerts.push({ level: "alert", text: `${kpis.alertSites} ${kpis.alertSites === 1 ? "site is" : "sites are"} flagged ALERT`, action: () => onJump("sites") });
  if (kpis.watchSites > 0) alerts.push({ level: "warn", text: `${kpis.watchSites} ${kpis.watchSites === 1 ? "site is" : "sites are"} on WATCH`, action: () => onJump("sites") });
  if (kpis.auditErrors > 0) alerts.push({ level: "warn", text: `${kpis.auditErrors} AI call ${kpis.auditErrors === 1 ? "error" : "errors"} in the last 24h`, action: () => onJump("audit") });

  if (!tasksApi && tasks.length === 0) {
    return (
      <DashboardSetup onConfigure={startEdit} editing={editing} draftTasksApi={draftTasksApi} setDraftTasksApi={setDraftTasksApi} onSave={saveUrls} onCancel={() => setEditing(false)} />
    );
  }

  // Build AI actions for the detail panel — runs Kera against this specific task's context
  const TASK_AI_ACTIONS = [
    { id: "brief", icon: "spark", label: "Brief Me on This Task",
      prompt: (t) => `Give Antoine a 4-sentence executive brief on this priority task. What it is, where it stands, what's at risk, what to do next. Plain prose.\n\nTASK: ${t.task}\nSTATUS: ${t.status || "—"}\nOWNER: ${t.owner || "—"}\nSITE: ${t.site || "—"}\nDUE: ${t.dueDate || "—"}\nPRIORITY: ${t.priority || "—"}\nNOTES: ${t.notes || "(none)"}\n\nAll Smartsheet columns:\n${Object.entries(t.raw || {}).map(([k,v]) => `${k}: ${v}`).join("\n")}` },
    { id: "update", icon: "mail", label: "Draft Update to Owner",
      prompt: (t) => `Draft a status update email from Antoine to ${t.owner || "the task owner"} about this task. Direct, professional, ask for an ETA if not on track. Plain prose, no bullets unless data demands it.\n\nTASK: ${t.task}\nSTATUS: ${t.status || "—"}\nDUE: ${t.dueDate || "—"}\nNOTES: ${t.notes || "(none)"}` },
    { id: "escalate", icon: "spark", label: "Draft Escalation",
      prompt: (t) => `Draft an escalation email from Antoine to leadership (Heather West or Chris Castle depending on severity) about this stuck task. Lead with operational risk. Plain prose.\n\nTASK: ${t.task}\nSTATUS: ${t.status || "—"}\nOWNER: ${t.owner || "—"}\nSITE: ${t.site || "—"}\nDUE: ${t.dueDate || "—"}\nAGE: ${TaskUtil.ageInDays(t) || "—"} days\nNOTES: ${t.notes || "(none)"}` },
    { id: "next", icon: "check", label: "Next 3 Steps",
      prompt: (t) => `Give Antoine the next 3 concrete steps to move this task forward. Each step: action, who's involved, expected outcome. Be specific.\n\nTASK: ${t.task}\nSTATUS: ${t.status || "—"}\nOWNER: ${t.owner || "—"}\nSITE: ${t.site || "—"}\nNOTES: ${t.notes || "(none)"}` },
    { id: "history", icon: "list", label: "Talking Points for 1:1",
      prompt: (t) => `Generate talking points for a 1:1 conversation about this task. What to ask, what to confirm, what to push on. 5-7 bullet-style points but in plain prose paragraphs.\n\nTASK: ${t.task}\nSTATUS: ${t.status || "—"}\nOWNER: ${t.owner || "—"}\nSITE: ${t.site || "—"}\nDUE: ${t.dueDate || "—"}\nNOTES: ${t.notes || "(none)"}` },
  ];
  const runTaskAi = async (action) => {
    if (!activeTask || !apiKey) return;
    setTaskAiBusy(action.id);
    setTaskAiOutput("");
    try {
      const out = await callClaude({
        prompt: action.prompt(activeTask),
        apiKey, model,
        source: "dashboard-task-" + action.id,
        maxTokens: 2048,
      });
      setTaskAiOutput(out);
    } catch (e) {
      setTaskAiOutput("Error: " + e.message);
    } finally {
      setTaskAiBusy("");
    }
  };
  const activeTaskOverdue = activeTask ? TaskUtil.isOverdue(activeTask) : false;
  const activeTaskAge = activeTask ? TaskUtil.ageInDays(activeTask) : null;
  const activeTaskStatusColor = activeTask ? TaskUtil.statusColor(activeTask) : T.textDim;
  // Build list of "extra" raw fields not already shown in the main grid
  const SHOWN_FIELDS = new Set(["task", "status", "owner", "due date", "due", "priority", "notes", "site", "comments"]);
  const extraFields = activeTask && activeTask.raw
    ? Object.entries(activeTask.raw).filter(([k, v]) => v && !SHOWN_FIELDS.has(k.toLowerCase()) && String(v).trim())
    : [];

  return (
    <>
    <div style={{ padding: S.xxl, display: "flex", flexDirection: "column", gap: S.xl, maxWidth: 1600, margin: "0 auto" }}>

      {/* Header — minimal, contextual */}
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: S.lg }}>
        <div>
          <div style={{ ...TS.label, color: T.textDim, textTransform: "uppercase", marginBottom: S.xs }}>Executive Dashboard</div>
          <div style={{ ...TS.h1, color: T.text }}>Operations Overview</div>
        </div>
        <div style={{ display: "flex", gap: S.md, alignItems: "center" }}>
          {fetchedAt > 0 && (
            <span style={{ ...TS.micro, color: T.textFaint, fontFamily: FF.mono }}>
              Updated {lastUpdate < 60 ? `${lastUpdate}s` : `${Math.floor(lastUpdate / 60)}m`} ago
            </span>
          )}
          <Btn icon="load" onClick={() => setRefreshTick(x => x + 1)} size="sm" variant="ghost">Refresh</Btn>
          <Btn icon="spark" variant="primary" size="sm" onClick={() => {
            // Build the daily briefing context — focused on Antoine personally.
            // Includes: today's calendar events, today's TODO list, his open/overdue tasks
            // from Smartsheet, and a brief portfolio status section (informational only).
            const now = new Date();
            const dateStr = now.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
            const todayYmd = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");

            // --- Smartsheet tasks filtered to ANTOINE ONLY ---
            const isDone = (s) => /complete|done|closed/i.test(s || "");
            const isMine = (t) => /antoine|riley/i.test(t.owner || "");
            const myOpen = (tasks || []).filter(t => isMine(t) && !isDone(t.status));
            const myOverdue = myOpen.filter(t => {
              if (!t.dueDate) return false;
              try { return new Date(t.dueDate) < new Date(now.toDateString()); } catch { return false; }
            });
            const myBlocked = myOpen.filter(t => /block/i.test(t.status || ""));
            const myHighPri = myOpen.filter(t => /high|urgent|critical|p1|p2/i.test(t.priority || "")).slice(0, 8);

            // --- Today's calendar events ---
            const allEvents = LS.get("calendar_events", []);
            const todayEvents = allEvents
              .filter(e => e.date === todayYmd)
              .sort((a, b) => (a.startTime || "").localeCompare(b.startTime || ""));

            // --- TODO TODAY (only open items) ---
            const todoItems = LS.get("todo_today", []).filter(t => !t.done);

            // --- Portfolio context (informational only, not action items) ---
            const alertSites = (sites || []).filter(s => s.status === "alert");
            const watchSites = (sites || []).filter(s => s.status === "watch");
            const recentErrors = (audit || [])
              .filter(a => a.status === "error" && (Date.now() - new Date(a.ts).getTime()) < 86400000)
              .slice(0, 3);

            const ctxLines = [
              `Today is ${dateStr}. Give Antoine his daily executive briefing — focused on HIM, not the whole portfolio.`,
              ``,
            ];

            // Calendar comes FIRST — it's time-anchored
            if (todayEvents.length) {
              ctxLines.push(`YOUR CALENDAR TODAY:`);
              todayEvents.forEach(e => {
                const time = e.startTime ? e.startTime + (e.endTime ? "–" + e.endTime : "") : "all day";
                const loc = e.location ? " @ " + e.location : "";
                const site = e.site && e.site !== "—" ? " [" + e.site + "]" : "";
                const cat = e.category ? " (" + e.category + ")" : "";
                ctxLines.push(`- ${time} — ${e.title}${site}${loc}${cat}${e.notes ? "\n    notes: " + e.notes.slice(0, 200) : ""}`);
              });
              ctxLines.push(``);
            } else {
              ctxLines.push(`YOUR CALENDAR TODAY: nothing scheduled.`, ``);
            }

            // TODO TODAY
            if (todoItems.length) {
              ctxLines.push(`YOUR TODO TODAY (${todoItems.length} open):`);
              todoItems.forEach(t => ctxLines.push(`- [ ] ${t.text}`));
              ctxLines.push(``);
            }

            // YOUR tasks from Smartsheet
            ctxLines.push(`YOUR SMARTSHEET TASKS:`);
            ctxLines.push(`- Open assigned to you: ${myOpen.length}`);
            ctxLines.push(`- Overdue (yours): ${myOverdue.length}`);
            ctxLines.push(`- Blocked (yours): ${myBlocked.length}`);

            if (myOverdue.length) {
              ctxLines.push(``, `YOUR OVERDUE TASKS:`);
              myOverdue.slice(0, 8).forEach(t => {
                ctxLines.push(`- ${t.task} | site: ${t.site || "—"} | due: ${t.dueDate || "—"} | status: ${t.status || "—"}`);
              });
            }

            if (myHighPri.length) {
              ctxLines.push(``, `YOUR HIGH / URGENT OPEN TASKS:`);
              myHighPri.forEach(t => {
                ctxLines.push(`- ${t.task} | site: ${t.site || "—"} | due: ${t.dueDate || "—"} | status: ${t.status || "—"}`);
              });
            }

            // Portfolio-level info — informational, NOT action items for Antoine
            if (alertSites.length || watchSites.length || recentErrors.length) {
              ctxLines.push(``, `PORTFOLIO CONTEXT (situational awareness only):`);
              if (alertSites.length) {
                alertSites.forEach(s => ctxLines.push(`- ALERT — ${s.code}: ${s.name || ""} ${s.lastIssue ? "— " + s.lastIssue : ""}`));
              }
              if (watchSites.length) {
                watchSites.forEach(s => ctxLines.push(`- WATCH — ${s.code}: ${s.name || ""} ${s.lastIssue ? "— " + s.lastIssue : ""}`));
              }
              if (recentErrors.length) {
                ctxLines.push(`- Recent AI errors (24h): ${recentErrors.length}`);
              }
            }

            ctxLines.push(``,
              `Brief Antoine in plain executive prose. Lead with what he needs to handle today — calendar first, then TODO list, then his Smartsheet tasks. ` +
              `Treat the portfolio context section as situational awareness, not as items he must personally action. ` +
              `End with the top 3 things HE should personally do today, in order. ` +
              `Match his voice: direct, technically precise, no hyphens as structure, no unnecessary bullets unless there's a real list.`
            );

            const briefingPrompt = ctxLines.join("\n");
            LS.set("terminal_prefill", briefingPrompt);
            LS.set("terminal_autosend", true);
            onJump("terminal");
          }}>Brief Me</Btn>
        </div>
      </div>

      {/* Alerts strip — only renders when there are alerts */}
      {alerts.length > 0 && (
        <div style={{
          display: "grid",
          gridTemplateColumns: `repeat(${Math.min(alerts.length, 3)}, 1fr)`,
          gap: S.md,
        }}>
          {alerts.slice(0, 6).map((a, i) => {
            const c = a.level === "alert" ? T.red : T.amber;
            return (
              <button key={i} onClick={a.action} style={{
                background: c + "0d",
                border: "1px solid " + c + "33",
                borderLeft: "2px solid " + c,
                borderRadius: 3,
                padding: `${S.md}px ${S.lg}px`,

                <div style={{ width: 6, height: 6, borderRadius: 3, background: c, boxShadow: `0 0 5px ${c}88` }} />
                <span style={{ ...TS.body, color: T.text, flex: 1 }}>{a.text}</span>
                <span style={{ ...TS.micro, color: T.textFaint, fontFamily: FF.mono }}>→</span>
              </button>
            );
          })}
        </div>

      {/* KPI strip — 6 metrics from real data */}
      <div data-dash-kpis style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: S.md }}>
        <KPI label="Open Tasks"   value={kpis.openTasks}   sub={`of ${tasks.length} total`}    source="Smartsheet" onClick={() => setFilter("open")} />
        <KPI label="Overdue"      value={kpis.overdue}     status={kpis.overdue > 0 ? "alert" : "good"} source="Smartsheet" onClick={() => setFilter("overdue")} />
        <KPI label="Blocked"      value={kpis.blocked}     status={kpis.blocked > 0 ? "warn" : "good"} source="Smartsheet" onClick={() => setFilter("blocked")} />
        <KPI label="My Tasks"     value={kpis.mine}        sub="open · assigned to me" source="Smartsheet" onClick={() => setFilter("mine")} />
        <KPI label="Closed · 7d"  value={kpis.completedThisWeek} sub="rolling week"   source="Smartsheet" />
        <KPI label="Sites Alert"  value={kpis.alertSites}  sub={`${kpis.watchSites} on watch`} status={kpis.alertSites > 0 ? "alert" : kpis.watchSites > 0 ? "warn" : "good"} source="Sites" onClick={() => onJump("sites")} />
      </div>

      {/* Tasks table — dense, sortable, filterable */}
      <Panel
        title={sheetName ? sheetName : "Priority Tasks"}
        subtitle={tasksApi ? "Live · auto-refresh 60s" : "Configure endpoint"}
        action={
          <>
            {tasksLoading && <span style={{ ...TS.micro, color: T.cyan, fontFamily: FF.mono }}>SYNCING</span>}
            <Btn size="sm" variant="ghost" onClick={startEdit}>Configure</Btn>
          </>

        noPad
      >
        {editing && (
          <div style={{ padding: S.xl, borderBottom: "1px solid " + T.borderFaint, background: T.bgSunken }}>

            <div style={{ display: "flex", gap: S.md }}>
              <input value={draftTasksApi} onChange={e => setDraftTasksApi(e.target.value)}

                style={{
                  flex: 1,
                  background: T.bg, border: "1px solid " + T.border,
                  color: T.text, fontFamily: FF.mono, fontSize: 12,

              <Btn size="sm" onClick={() => setEditing(false)}>Cancel</Btn>
              <Btn size="sm" variant="primary" onClick={saveUrls}>Save</Btn>
            </div>
          </div>
        )}

        {/* Filter bar */}
        <div style={{
          display: "flex",
          gap: S.xs,
          padding: `${S.md}px ${S.lg}px`,
          borderBottom: "1px solid " + T.borderFaint,
          background: T.bgSunken,
          flexWrap: "wrap",
          alignItems: "center",
        }}>
          {[
            { id: "open",    label: "Open",     n: kpis.openTasks },
            { id: "overdue", label: "Overdue",  n: kpis.overdue, color: T.red },
            { id: "blocked", label: "Blocked",  n: kpis.blocked, color: T.amber },
            { id: "high",    label: "High",     n: tasks.filter(t => TaskUtil.isHigh(t) && !TaskUtil.isDone(t)).length },
            { id: "mine",    label: "Mine",     n: kpis.mine },

          ].map(f => {

            return (
              <button key={f.id} onClick={() => setFilter(f.id)} style={{

                fontFamily: FF.body, fontSize: 11, fontWeight: 500,
                padding: `${S.xs}px ${S.md}px`, height: 24, cursor: "pointer", borderRadius: 3,
                display: "inline-flex", alignItems: "center", gap: S.sm,
                transition: "all 0.12s",

              onMouseEnter={e => { if (!active) e.currentTarget.style.color = T.text; }}
              onMouseLeave={e => { if (!active) e.currentTarget.style.color = T.textDim; }}>
                <span>{f.label}</span>
                <span style={{ fontFamily: FF.mono, fontSize: 10, color: active ? c : T.textFaint, fontVariantNumeric: "tabular-nums" }}>{f.n}</span>
              </button>
            );
          })}
          {sitesInTasks.length > 0 && (
            <>
              <div style={{ width: 1, height: 18, background: T.borderFaint, margin: `0 ${S.sm}px` }} />
              <span style={{ ...TS.micro, color: T.textFaint, fontFamily: FF.mono, marginRight: S.xs }}>SITE</span>
              <button onClick={() => setSiteFilter("")} style={{
                background: !siteFilter ? T.surface : "transparent",
                border: "1px solid " + (!siteFilter ? T.borderBright : "transparent"),
                color: !siteFilter ? T.text : T.textDim,
                fontFamily: FF.mono, fontSize: 10,
                padding: `${S.xs}px ${S.md}px`, height: 24, cursor: "pointer", borderRadius: 3,
              }}>ALL</button>
              {sitesInTasks.map(s => (
                <button key={s} onClick={() => setSiteFilter(s === siteFilter ? "" : s)} style={{
                  background: siteFilter === s ? T.accent + "1a" : "transparent",
                  border: "1px solid " + (siteFilter === s ? T.accent + "55" : "transparent"),
                  color: siteFilter === s ? T.accent : T.textDim,
                  fontFamily: FF.mono, fontSize: 10,
                  padding: `${S.xs}px ${S.md}px`, height: 24, cursor: "pointer", borderRadius: 3,
                }}>{s}</button>
              ))}
            </>
          )}
          <div style={{ flex: 1 }} />
          <span style={{ ...TS.micro, color: T.textFaint, fontFamily: FF.mono }}>{sortedTasks.length} shown</span>
        </div>

        {/* Error state */}
        {tasksError && (
          <div style={{ padding: S.xl }}>
            <div style={{
              ...TS.body, color: T.red, lineHeight: 1.5,
              padding: `${S.md}px ${S.lg}px`,
              background: T.red + "0d", border: "1px solid " + T.red + "33", borderRadius: 3,
            }}>{tasksError}</div>
          </div>
        )}

        {/* Empty state */}
        {!tasksError && sortedTasks.length === 0 && (
          <div style={{
            padding: `${S.xxxl}px ${S.xl}px`,
            textAlign: "center", color: T.textFaint,

          }}>
            No tasks match the current filter.
          </div>
        )}

        {/* Task table */}
        {!tasksError && sortedTasks.length > 0 && (
          <div style={{ maxHeight: 560, overflowY: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", tableLayout: "auto" }}>
              <thead>
                <tr style={{
                  position: "sticky", top: 0, background: T.bgSunken, zIndex: 2,
                  borderBottom: "1px solid " + T.border,
                }}>
                  <th style={{ width: 24 }}></th>
                  {[
                    { f: "task",    label: "Task" },
                    { f: "status",  label: "Status" },
                    { f: "owner",   label: "Owner" },
                    { f: "site",    label: "Site" },
                    { f: "dueDate", label: "Due" },
                    { f: null,      label: "Age", align: "right" },
                  ].map(col => (
                    <th key={col.label} style={{
                      ...TS.micro,
                      color: T.textDim,
                      textTransform: "uppercase",
                      fontWeight: 600,
                      textAlign: col.align || "left",
                      padding: `${S.md}px ${S.md}px`,
                      whiteSpace: "nowrap",
                      cursor: col.f ? "pointer" : "default",
                      userSelect: "none",
                    }}
                    onClick={() => col.f && setSortBy(s => ({ field: col.f, dir: s.field === col.f && s.dir === "asc" ? "desc" : "asc" }))}>
                      {col.label}
                      {sortBy.field === col.f && <span style={{ marginLeft: 4 }}>{sortBy.dir === "asc" ? "↑" : "↓"}</span>}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {sortedTasks.map(t => (
                  <TaskRow key={t.id} task={t} onClick={() => { setActiveTask(t); setTaskAiOutput(""); }} />
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Panel>

      {/* Bottom row — owner load + workstreams */}
      <div data-grid="dash-split" style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: S.xl }}>
        <Panel title="Open Tasks by Owner" subtitle="Workload distribution">
          {(() => {
            const ownerLoad = {};
            for (const t of tasks.filter(x => !TaskUtil.isDone(x))) {
              const o = t.owner || "Unassigned";
              if (!ownerLoad[o]) ownerLoad[o] = { open: 0, overdue: 0, blocked: 0 };
              ownerLoad[o].open++;
              if (TaskUtil.isOverdue(t)) ownerLoad[o].overdue++;
              if (TaskUtil.isBlocked(t)) ownerLoad[o].blocked++;
            }
            const sorted = Object.entries(ownerLoad).sort((a, b) => b[1].open - a[1].open);
            const max = Math.max(...sorted.map(([_, v]) => v.open), 1);
            return sorted.length === 0
              ? <div style={{ ...TS.body, color: T.textFaint, padding: S.lg, textAlign: "center" }}>No open tasks.</div>
              : (
                <div style={{ display: "flex", flexDirection: "column", gap: S.md }}>
                  {sorted.map(([name, v]) => (
                    <div key={name} style={{ display: "flex", alignItems: "center", gap: S.lg }}>
                      <div style={{ ...TS.body, color: T.text, width: 160, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{name}</div>
                      <div style={{ flex: 1, height: 6, background: T.bgSunken, borderRadius: 3, overflow: "hidden", display: "flex" }}>
                        <div style={{
                          width: `${(v.open / max) * 100}%`,
                          background: v.overdue > 0 ? T.red : v.blocked > 0 ? T.amber : T.accent,
                          height: "100%",
                          transition: "width 0.3s",
                        }} />
                      </div>
                      <div style={{ display: "flex", gap: S.md, fontFamily: FF.mono, fontSize: 11, color: T.textDim, fontVariantNumeric: "tabular-nums", minWidth: 80, justifyContent: "flex-end" }}>
                        <span style={{ color: T.text }}>{v.open}</span>
                        {v.overdue > 0 && <span style={{ color: T.red }}>{v.overdue}⚠</span>}
                        {v.blocked > 0 && <span style={{ color: T.amber }}>{v.blocked}◐</span>}
                      </div>
                    </div>
                  ))}
                </div>
              );
          })()}
        </Panel>

        <Panel title="System" subtitle="Today">
          <div style={{ display: "flex", flexDirection: "column", gap: S.md }}>
            <div style={{ display: "flex", justifyContent: "space-between", padding: `${S.sm}px 0`, borderBottom: "1px solid " + T.borderFaint }}>
              <span style={{ ...TS.body, color: T.textDim }}>AI calls today</span>
              <span style={{ ...TS.data, fontFamily: FF.mono, color: T.text, fontVariantNumeric: "tabular-nums" }}>{kpis.auditTodayCount}</span>
            </div>
            <div onClick={() => {
              if (kpis.auditErrors > 0) {
                LS.set("audit_filter_oneshot", "errors");
                onJump("audit");
              }
            }} style={{ display: "flex", justifyContent: "space-between", padding: `${S.sm}px 0`, borderBottom: "1px solid " + T.borderFaint, cursor: kpis.auditErrors > 0 ? "pointer" : "default", borderRadius: 2, transition: "background 0.12s" }}
              onMouseEnter={e => { if (kpis.auditErrors > 0) e.currentTarget.style.background = T.red + "08"; }}
              onMouseLeave={e => { e.currentTarget.style.background = "transparent"; }}>
              <span style={{ ...TS.body, color: T.textDim, display: "flex", alignItems: "center", gap: 6 }}>
                Errors
                {kpis.auditErrors > 0 && <span style={{ fontFamily: FF.mono, fontSize: 9, color: T.red, letterSpacing: 1.2 }}>→ VIEW</span>}
              </span>
              <span style={{ ...TS.data, fontFamily: FF.mono, color: kpis.auditErrors > 0 ? T.red : T.text, fontVariantNumeric: "tabular-nums" }}>{kpis.auditErrors}</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", padding: `${S.sm}px 0`, borderBottom: "1px solid " + T.borderFaint }}>
              <span style={{ ...TS.body, color: T.textDim }}>Sites configured</span>
              <span style={{ ...TS.data, fontFamily: FF.mono, color: T.text, fontVariantNumeric: "tabular-nums" }}>{sites.filter(s => s.name).length} / {sites.length || 10}</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", padding: `${S.sm}px 0` }}>
              <span style={{ ...TS.body, color: T.textDim }}>Memory entries</span>
              <span style={{ ...TS.data, fontFamily: FF.mono, color: T.text, fontVariantNumeric: "tabular-nums" }}>{LS.get("memories", []).length}</span>
            </div>
          </div>
        </Panel>
      </div>
    </div>

    {/* Task Detail slide-in panel */}
    {activeTask && (
      <>
        {/* Backdrop */}
        <div onClick={() => { setActiveTask(null); setTaskAiOutput(""); }}
          style={{
            position: "fixed", top: 0, left: 0, right: 0, bottom: 0,
            background: "rgba(0,0,0,0.55)", zIndex: 90,
            animation: "fadeIn 0.15s ease-out",
          }} />
        {/* Panel */}
        <div style={{
          position: "fixed", top: 0, right: 0, bottom: 0,
          width: "min(720px, 92vw)",
          background: T.bgRaised,
          borderLeft: "1px solid " + T.border,
          boxShadow: "-8px 0 32px rgba(0,0,0,0.5)",
          zIndex: 91,
          overflowY: "auto",
          animation: "slideInRight 0.2s ease-out",
        }}>
          <div style={{ padding: `${S.lg}px ${S.xxl}px`, borderBottom: "1px solid " + T.border, display: "flex", justifyContent: "space-between", alignItems: "center", position: "sticky", top: 0, background: T.bgRaised, zIndex: 1 }}>
            <div style={{ ...TS.label, color: T.textDim, textTransform: "uppercase", letterSpacing: 2 }}>Task Detail</div>
            <button onClick={() => { setActiveTask(null); setTaskAiOutput(""); }}
              style={{ background: "transparent", border: "none", color: T.textDim, fontSize: 18, cursor: "pointer", padding: `${S.xs}px ${S.sm}px`, lineHeight: 1 }}
              aria-label="Close">×</button>
          </div>

          <div style={{ padding: `${S.xl}px ${S.xxl}px` }}>
            {/* Status + priority pills */}
            <div style={{ display: "flex", gap: S.sm, alignItems: "center", marginBottom: S.md, flexWrap: "wrap" }}>
              <Pill color={activeTaskStatusColor}>{activeTask.status || "—"}</Pill>
              {activeTask.priority && <Pill color={T.amber} variant="soft">{activeTask.priority}</Pill>}
              {activeTask.site && <Pill color={T.accent} variant="soft">{activeTask.site}</Pill>}
              {activeTaskOverdue && <Pill color={T.red}>OVERDUE</Pill>}
              {activeTaskAge != null && (
                <span style={{ ...TS.micro, color: T.textFaint, fontFamily: FF.mono, marginLeft: S.xs }}>
                  {activeTaskAge}d in queue
                </span>
              )}
            </div>

            {/* Title */}
            <div style={{ ...TS.h2, color: T.text, lineHeight: 1.3, marginBottom: S.lg }}>
              {activeTask.task || "(untitled)"}
            </div>

            {/* Meta grid */}
            <div style={{
              display: "grid",
              gridTemplateColumns: "1fr 1fr",
              gap: S.md,

            {/* Footer actions */}
            <div style={{ display: "flex", gap: S.sm, marginTop: S.xl, paddingTop: S.lg, borderTop: "1px solid " + T.border, flexWrap: "wrap" }}>
              <Btn icon="copy" size="sm" onClick={() => navigator.clipboard?.writeText(String(activeTask.id || ""))}>Copy Row ID</Btn>
              <Btn icon="term" size="sm" onClick={() => {
                // Pre-load context into terminal and route
                const ctx = `I want to talk about this priority task:\n\nTASK: ${activeTask.task}\nSTATUS: ${activeTask.status || "—"}\nOWNER: ${activeTask.owner || "—"}\nSITE: ${activeTask.site || "—"}\nDUE: ${activeTask.dueDate || "—"}\nNOTES: ${activeTask.notes || "(none)"}`;
                LS.set("terminal_prefill", ctx);
                setActiveTask(null);
                onJump("terminal");
              }}>Open in Terminal</Btn>
            </div>
          </div>
        </div>
      </>
    )}

  );
};
