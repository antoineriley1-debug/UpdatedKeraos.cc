// ---------- VOICE / CONVERSATION ENGINE ----------
// Two layers:
//   - Voice (low-level): wraps SpeechRecognition + speechSynthesis APIs
//   - Convo (high-level): runs the conversation loop with silence detection,
//     auto-restart, and interrupt handling.
const Voice = {
  rec: null,
  startedAt: 0,

  start({ onPartial, onFinal, onError, onEnd }) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      alert("Voice not supported. Use Chrome, Edge, or Safari.");
      return false;
    }
    this.stop();
    const rec = new SR();
    rec.continuous = true;        // keep listening even with pauses
    rec.interimResults = true;
    rec.lang = "en-US";
    rec.maxAlternatives = 1;
    let finalText = "";
    rec.onresult = (e) => {
      let interim = "";
      let gotFinal = false;
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) { finalText += r[0].transcript; gotFinal = true; }
        else interim += r[0].transcript;
      }
      if (onPartial) onPartial(finalText + interim);
      if (gotFinal && onFinal) onFinal(finalText);
    };
    rec.onerror = (e) => {
      if (e.error === "no-speech" || e.error === "aborted") return;
      if (onError) onError(e.error);
    };
    rec.onend = () => {
      this.rec = null;
      if (onEnd) onEnd(finalText);
    };
    try {
      rec.start();
      this.rec = rec;
      this.startedAt = Date.now();
      return true;
    } catch (err) {
      // Some browsers throw if start() called too quickly after stop()
      console.warn("Voice start failed:", err);
      return false;
    }
  },

  stop() {
    if (this.rec) {
      try { this.rec.stop(); } catch {}
      this.rec = null;
    }
  },

  // TTS — accept onStart and onEnd so caller can sync UI
  speak(text, { onStart, onEnd } = {}) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    // Pick a natural-sounding female voice for Kera if available.
    // Order: high-quality female voices first, then any en-US female, then any en-US.
    const voices = window.speechSynthesis.getVoices();
    const isFemaleish = (v) => /aria|samantha|jenny|natasha|google us english(?! male)|female|allison|ava|emma|joanna|salli|kendra|kimberly|kate|serena|veena|tessa|moira/i.test(v.name);
    const preferred = voices.find(v => v.lang.startsWith("en") && /Microsoft Aria/i.test(v.name))
                   || voices.find(v => v.lang.startsWith("en") && /Samantha/i.test(v.name))
                   || voices.find(v => v.lang.startsWith("en") && /Google US English/i.test(v.name) && !/male/i.test(v.name))
                   || voices.find(v => v.lang.startsWith("en") && !v.localService && isFemaleish(v))
                   || voices.find(v => v.lang.startsWith("en") && isFemaleish(v))
                   || voices.find(v => v.lang === "en-US" && !v.localService)
                   || voices.find(v => v.lang === "en-US");
    const u = new SpeechSynthesisUtterance(text);
    if (preferred) u.voice = preferred;
    u.rate = 1.05;
    u.pitch = 1.0;
    u.volume = 1.0;
    if (onStart) u.onstart = onStart;
    if (onEnd) u.onend = onEnd;
    u.onerror = onEnd; // treat error as end so loop continues
    window.speechSynthesis.speak(u);
  },

  stopSpeaking() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  },

  isSpeaking() {
    return window.speechSynthesis ? window.speechSynthesis.speaking : false;
  },
};

// Conversation engine — runs the whole hands-free loop.
// States: idle | listening | thinking | speaking
const Convo = {
  state: "idle",
  active: false,             // master toggle
  silenceTimer: null,
  silenceMs: 1400,           // how long to wait after last speech before submitting
  lastTranscript: "",
  callbacks: {},

  setCallbacks(cb) { this.callbacks = cb; },

  setState(s) {
    this.state = s;
    if (this.callbacks.onState) this.callbacks.onState(s);
  },

  // Begin hands-free conversation mode
  start() {
    this.active = true;
    this.beginListening();
  },

  // End hands-free mode entirely
  stop() {
    this.active = false;
    this.clearSilence();
    Voice.stop();
    Voice.stopSpeaking();
    this.setState("idle");
  },

  // User tapped to interrupt mid-conversation
  interrupt() {
    if (this.state === "speaking") {
      Voice.stopSpeaking();
      if (this.active) this.beginListening();
      else this.setState("idle");
    } else if (this.state === "listening") {
      // Manual stop — submit whatever we have
      this.submitCurrent();
    }
  },

  beginListening() {
    if (!this.active) return;
    this.lastTranscript = "";
    this.clearSilence();
    this.setState("listening");
    Voice.start({
      onPartial: (t) => {
        this.lastTranscript = t;
        if (this.callbacks.onPartial) this.callbacks.onPartial(t);
        // Each time speech is detected, restart the silence timer
        this.scheduleSilenceSubmit();
      },
      onFinal: (t) => {
        // Final chunk arrived — let silence timer keep running in case more speech comes
        this.lastTranscript = t;
        if (this.callbacks.onPartial) this.callbacks.onPartial(t);
        this.scheduleSilenceSubmit();
      },
      onError: (err) => {
        // Most errors mean we should just restart
        if (this.active && this.state === "listening") {
          setTimeout(() => { if (this.active && this.state === "listening") this.beginListening(); }, 300);
        }
      },
      onEnd: () => {
        // Recognition ended (either we stopped it or browser timed out)
        // If we still have an unsent transcript and we're active, submit it
        if (this.active && this.state === "listening") {
          const text = this.lastTranscript.trim();
          if (text) this.submitTranscript(text);
          else {
            // Restart listening
            setTimeout(() => { if (this.active && this.state === "listening") this.beginListening(); }, 200);
          }
        }
      },
    });
  },

  scheduleSilenceSubmit() {
    this.clearSilence();
    this.silenceTimer = setTimeout(() => this.submitCurrent(), this.silenceMs);
  },

  clearSilence() {
    if (this.silenceTimer) {
      clearTimeout(this.silenceTimer);
      this.silenceTimer = null;
    }
  },

  submitCurrent() {
    this.clearSilence();
    const text = this.lastTranscript.trim();
    Voice.stop();
    if (!text) {
      // Nothing to send — restart listening if still active
      if (this.active) setTimeout(() => { if (this.active) this.beginListening(); }, 200);
      return;
    }
    this.submitTranscript(text);
  },

  submitTranscript(text) {
    this.setState("thinking");
    this.lastTranscript = "";
    if (this.callbacks.onSubmit) this.callbacks.onSubmit(text);
  },

  // Called by Terminal once it has Claude's reply
  speakReply(text) {
    if (!text) {
      if (this.active) this.beginListening();
      else this.setState("idle");
      return;
    }
    this.setState("speaking");
    Voice.speak(text, {
      onEnd: () => {
        if (this.active) {
          // small delay so the user doesn't hear their own breath in the mic
          setTimeout(() => { if (this.active) this.beginListening(); }, 250);
        } else {
          this.setState("idle");
        }
      },
    });
  },

  // Called by Terminal if Claude failed
  handleError() {
    if (this.active) this.beginListening();
    else this.setState("idle");
  },
};

// ---------- MEMORY VIEW ----------
const MemoryView = () => {
  const [memories, setMemories] = useState(() => LS.get("memories", []));
  const [draft, setDraft] = useState("");
  const [dragActive, setDragActive] = useState(false);
  const [uploadError, setUploadError] = useState("");
  // Pending upload state — when a file is dropped, ask the user how to add it.
  // pending = { filename, text } if a decision is needed; null otherwise.
  const [pendingUpload, setPendingUpload] = useState(null);
  const dropZoneRef = useRef(null);
  const persist = (next) => { setMemories(next); LS.set("memories", next); };
  const add = () => {
    const t = draft.trim();
    if (!t) return;
    persist([{ id: Date.now(), text: t, pinned: false, createdAt: Date.now() }, ...memories]);
    setDraft("");
  };
  const remove = (id) => persist(memories.filter(m => m.id !== id));
  const togglePin = (id) => persist(memories.map(m => m.id === id ? { ...m, pinned: !m.pinned } : m));

  // Memory upload — accepts plain-text formats only. Images and PDFs are rejected
  // with a clear message; vision content doesn't belong in long-term memory anyway.
  const TEXT_RE = /\.(txt|md|markdown|eml|msg|csv|json|log|html|rtf)$/i;
  const ingestFile = (file) => {
    setUploadError("");
    if (!file) return;
    const name = file.name || "memory-upload";
    if (/\.(pdf|png|jpe?g|gif|webp|heic|mp4|mov)$/i.test(name)) {
      setUploadError(name + " — binary file types aren't supported for memory. Use Notes for documents that need vision or PDF parsing.");
      return;
    }
    if (!TEXT_RE.test(name) && !(file.type && file.type.startsWith("text/"))) {
      setUploadError(name + " — unsupported file type. Use .txt, .md, .eml, .csv, .json, .log, or .html.");
      return;
    }
    if (file.size > 1_000_000) {
      setUploadError(name + " — file too large (" + Math.round(file.size / 1024) + "KB). Memory entries should stay under 1MB. Use Notes for large reference docs.");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const text = String(reader.result || "").trim();
      if (!text) { setUploadError(name + " — file is empty."); return; }
      // Offer the user a choice via the pendingUpload modal.
      setPendingUpload({ filename: name, text });
    };
    reader.onerror = () => setUploadError("Couldn't read " + name);
    reader.readAsText(file);
  };

  // After the user picks how to import, actually add to memories.
  // mode === "single" → one memory entry containing the whole file body.
  // mode === "lines"  → split into atomic memories (one per non-empty line).
  // mode === "sections" → split on Markdown headings (## or ---) into one memory per section.
  const commitPending = (mode) => {
    if (!pendingUpload) return;
    const ts = Date.now();
    const entries = [];
    if (mode === "single") {
      entries.push({ id: ts, text: pendingUpload.text, pinned: false, createdAt: ts, source: pendingUpload.filename });
    } else if (mode === "lines") {
      const lines = pendingUpload.text
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(l => l && !l.startsWith("#") && !/^[-*=]{3,}$/.test(l));
      lines.forEach((line, i) => {
        entries.push({ id: ts + i, text: line, pinned: false, createdAt: ts + i, source: pendingUpload.filename });
      });
    } else if (mode === "sections") {
      // Split on Markdown headings. A "section" = heading line + content until the next heading.
      const raw = pendingUpload.text;
      const parts = raw.split(/^(#{1,6}\s+.+)$/m);
      // After splitting on a capturing regex, every other element is the heading.
      const sections = [];
      for (let i = 1; i < parts.length; i += 2) {
        const heading = parts[i].trim();
        const body = (parts[i + 1] || "").trim();
        if (heading || body) sections.push((heading + "\n" + body).trim());
      }
      // If no headings were found, fall back to splitting on horizontal rules / blank-line clusters.
      if (sections.length === 0) {
        const fallback = raw.split(/\n{2,}/).map(s => s.trim()).filter(Boolean);
        fallback.forEach(s => sections.push(s));
      }
      sections.forEach((s, i) => entries.push({ id: ts + i, text: s, pinned: false, createdAt: ts + i, source: pendingUpload.filename }));
    }
    if (entries.length === 0) {
      setUploadError("Nothing to add — file produced no usable memory entries.");
      setPendingUpload(null);
      return;
    }
    persist([...entries, ...memories]);
    setPendingUpload(null);
  };

  // Drag handlers
  const onDragOver = (e) => { e.preventDefault(); e.stopPropagation(); setDragActive(true); };
  const onDragLeave = (e) => {
    e.preventDefault(); e.stopPropagation();
    // Only deactivate when actually leaving the drop zone, not when crossing a child element
    if (e.currentTarget === e.target) setDragActive(false);
  };
  const onDrop = (e) => {
    e.preventDefault(); e.stopPropagation();
    setDragActive(false);
    const files = Array.from(e.dataTransfer?.files || []);
    if (files.length === 0) return;
    // Memory uploads handle one file at a time so the per-file ingest dialog
    // doesn't pile up. If the user dropped multiple, process the first and
    // tell them about the others.
    if (files.length > 1) {
      setUploadError("Multiple files dropped — only processing the first (" + files[0].name + "). Drop one at a time for more control.");
    }
    ingestFile(files[0]);
  };

  return (
    <div style={{ padding: 22 }}>
      <div style={{ marginBottom: 20 }}>
        <div style={{ fontFamily: FF.mono, fontSize: 10, letterSpacing: 2.4, color: T.brass, textTransform: "uppercase" }}>Long-Term Memory</div>
        <h1 style={{ fontFamily: FF.display, fontSize: 28, fontWeight: 500, color: T.text, margin: "4px 0 0", fontStyle: "italic", letterSpacing: -0.5 }}>Things EXEC-OS will remember.</h1>
        <div style={{ fontFamily: FF.body, fontSize: 13, color: T.textDim, marginTop: 6, lineHeight: 1.5, maxWidth: 720 }}>
          Anything here gets injected into every conversation as context. Use it for facts you don't want to repeat: vendor preferences, naming conventions, recurring contacts, project context, your writing style.
        </div>
      </div>

      {/* Drop zone — also serves as the click-to-upload affordance */}
      <div
        ref={dropZoneRef}
        onDragOver={onDragOver}
        onDragEnter={onDragOver}
        onDragLeave={onDragLeave}
        onDrop={onDrop}
        style={{
          marginBottom: 16,
          background: dragActive ? T.cyan + "22" : T.bgSunken,
          border: "1px dashed " + (dragActive ? T.cyan : T.border),
          borderRadius: 2,
          padding: "16px 18px",
          display: "flex",
          alignItems: "center",
          gap: 14,
          flexWrap: "wrap",
          transition: "background 0.15s, border-color 0.15s",
        }}
      >
        <div style={{ flex: "1 1 280px", minWidth: 200 }}>
          <div style={{ fontFamily: FF.mono, fontSize: 11, color: dragActive ? T.cyan : T.textDim, letterSpacing: 1.4, marginBottom: 4 }}>
            {dragActive ? "DROP TO IMPORT" : "DRAG & DROP A FILE TO IMPORT MEMORIES"}
          </div>
          <div style={{ color: T.textFaint, fontFamily: FF.mono, fontSize: 10, letterSpacing: 0.5, lineHeight: 1.5 }}>
            Plain-text formats: .txt .md .eml .csv .json .log .html · max 1MB · drop a memory dump and pick how to import it
          </div>
        </div>
        <label style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "8px 14px", background: T.bgRaised, border: "1px solid " + T.border, borderRadius: 2, cursor: "pointer", color: T.text, fontFamily: FF.mono, fontSize: 11, letterSpacing: 1.2 }}>
          <Icon name="file" size={12} />
          BROWSE
          <input
            type="file"
            accept=".txt,.md,.markdown,.eml,.msg,.csv,.json,.log,.html,.rtf,text/*"
            onChange={e => { ingestFile(e.target.files?.[0]); e.target.value = ""; }}
            style={{ display: "none" }}
          />
        </label>
      </div>
      {uploadError && (
        <div style={{ background: T.red + "11", border: "1px solid " + T.red + "33", color: T.red, padding: "10px 14px", borderRadius: 2, fontFamily: FF.mono, fontSize: 11, marginBottom: 14 }}>
          {uploadError}
        </div>
      )}

      <Panel title="Add Memory">
        {/* Paste / Clear controls — quick clipboard access for memory entries */}
        <div style={{ display: "flex", gap: 6, marginBottom: 8, flexWrap: "wrap" }}>
          <PasteButton onPaste={(t) => setDraft(draft ? draft + "\n\n" + t : t)} label="Paste" />
          {draft && (
            <button onClick={() => setDraft("")} title="Clear draft" style={{
              background: "transparent", color: T.textFaint, border: "1px solid " + T.borderFaint,
              fontFamily: FF.mono, fontSize: 10, letterSpacing: 1.2, textTransform: "uppercase",
              padding: "5px 10px", borderRadius: 2, cursor: "pointer",
            }}>Clear</button>
          )}
        </div>
        <textarea value={draft} onChange={e => setDraft(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) add(); }}
          placeholder="e.g. When drafting to Chris Castle, always lead with operational risk before context."
          rows={3}
          style={{ width: "100%", background: T.bgSunken, border: "1px solid " + T.border, color: T.text, fontFamily: FF.body, fontSize: 13.5, padding: 14, borderRadius: 2, resize: "vertical", lineHeight: 1.5 }} />
        <div style={{ marginTop: 12, display: "flex", justifyContent: "flex-end" }}>
          <Btn icon="check" variant="primary" onClick={add} disabled={!draft.trim()}>Remember</Btn>
        </div>
      </Panel>

      <div style={{ marginTop: 16 }}>
        <Panel title={"Stored Memories — " + memories.length}>
          {memories.length === 0 ? (
            <div style={{ fontFamily: FF.mono, fontSize: 11, color: T.textFaint, padding: "30px 0", textAlign: "center", letterSpacing: 1.2 }}>NOTHING REMEMBERED YET</div>
          ) : memories.map((m, i) => (
            <div key={m.id} style={{ display: "flex", gap: 12, padding: "12px 0", borderBottom: i < memories.length - 1 ? "1px solid " + T.border : "none", alignItems: "flex-start" }}>
              <button onClick={() => togglePin(m.id)} title={m.pinned ? "Unpin" : "Pin"}
                style={{ background: "transparent", border: "none", color: m.pinned ? T.brass : T.textFaint, cursor: "pointer", padding: "2px 4px", fontSize: 14, lineHeight: 1 }}>
                {m.pinned ? "★" : "☆"}
              </button>
              <div style={{ flex: 1, fontFamily: FF.body, fontSize: 13.5, color: T.text, lineHeight: 1.55, whiteSpace: "pre-wrap" }}>
                {m.text}
                {m.source && (
                  <div style={{ fontFamily: FF.mono, fontSize: 9, color: T.textFaint, letterSpacing: 1, marginTop: 4 }}>SOURCE: {m.source}</div>
                )}
              </div>
              <div style={{ fontFamily: FF.mono, fontSize: 9, color: T.textFaint, letterSpacing: 0.6, marginTop: 2 }}>
                {new Date(m.createdAt).toLocaleDateString()}
              </div>
              <button onClick={() => remove(m.id)} title="Delete"
                style={{ background: "transparent", border: "none", color: T.textFaint, cursor: "pointer", padding: "0 4px", fontSize: 16, lineHeight: 1 }}
                onMouseEnter={e => e.currentTarget.style.color = T.red}
                onMouseLeave={e => e.currentTarget.style.color = T.textFaint}>
                ×
              </button>
            </div>
          ))}
        </Panel>
      </div>

      {/* Import-mode dialog. Shown after a file is read so the user can pick
          how memories get split. Backdrop click cancels without importing. */}
      {pendingUpload && (
        <>
          <div onClick={() => setPendingUpload(null)}
            style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.55)", zIndex: 90 }} />
          <div style={{
            position: "fixed", top: "50%", left: "50%", transform: "translate(-50%, -50%)",
            width: "min(560px, 92vw)", maxHeight: "85vh", overflowY: "auto",
            background: T.bgRaised, border: "1px solid " + T.border, borderRadius: 2,
            boxShadow: "0 12px 40px rgba(0,0,0,0.6)", zIndex: 91,
            padding: "22px 24px",
          }}>
            <div style={{ fontFamily: FF.mono, fontSize: 10, color: T.brass, letterSpacing: 1.6, marginBottom: 6 }}>IMPORT MEMORY</div>
            <div style={{ ...TS.h3, color: T.text, marginBottom: 4 }}>{pendingUpload.filename}</div>
            <div style={{ color: T.textDim, fontFamily: FF.mono, fontSize: 11, marginBottom: 18 }}>
              {pendingUpload.text.length.toLocaleString()} chars · how would you like this stored?
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <button onClick={() => commitPending("single")}
                style={{ textAlign: "left", padding: "12px 14px", background: T.bgSunken, border: "1px solid " + T.borderFaint, borderRadius: 2, cursor: "pointer", color: T.text }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = T.cyan; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = T.borderFaint; }}>
                <div style={{ fontFamily: FF.body, fontSize: 14, fontWeight: 500, color: T.text, marginBottom: 2 }}>Single memory</div>
                <div style={{ fontFamily: FF.mono, fontSize: 11, color: T.textDim, lineHeight: 1.5 }}>Add the whole file as one entry. Best for memory dumps, profiles, or briefs.</div>
              </button>
              <button onClick={() => commitPending("sections")}
                style={{ textAlign: "left", padding: "12px 14px", background: T.bgSunken, border: "1px solid " + T.borderFaint, borderRadius: 2, cursor: "pointer", color: T.text }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = T.cyan; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = T.borderFaint; }}>
                <div style={{ fontFamily: FF.body, fontSize: 14, fontWeight: 500, color: T.text, marginBottom: 2 }}>Split by section</div>
                <div style={{ fontFamily: FF.mono, fontSize: 11, color: T.textDim, lineHeight: 1.5 }}>One memory per Markdown heading (##, ###). Best for structured docs with named sections.</div>
              </button>
              <button onClick={() => commitPending("lines")}
                style={{ textAlign: "left", padding: "12px 14px", background: T.bgSunken, border: "1px solid " + T.borderFaint, borderRadius: 2, cursor: "pointer", color: T.text }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = T.cyan; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = T.borderFaint; }}>
                <div style={{ fontFamily: FF.body, fontSize: 14, fontWeight: 500, color: T.text, marginBottom: 2 }}>One per line</div>
                <div style={{ fontFamily: FF.mono, fontSize: 11, color: T.textDim, lineHeight: 1.5 }}>Each non-empty line becomes a separate memory. Best for atomic memory lists (rules, facts, preferences).</div>
              </button>
            </div>

            <div style={{ marginTop: 18, display: "flex", justifyContent: "flex-end" }}>
              <button onClick={() => setPendingUpload(null)}
                style={{ background: "transparent", border: "1px solid " + T.border, color: T.textDim, padding: "8px 16px", borderRadius: 2, cursor: "pointer", fontFamily: FF.mono, fontSize: 11, letterSpacing: 1.2 }}>
                CANCEL
              </button>
            </div>
          </div>
        </>
      )}
    </div>
  );
};

// TODO TODAY — quick daily action list, lives at top of Notes view.
// Shape per item: { id, text, done, createdAt }
// Stored at LS key "todo_today" (syncs via Cloud since not in LOCAL_ONLY_KEYS).
// Items persist until manually cleared — they don't auto-reset at midnight.
const TodoToday = () => {
  const [items, setItems] = useState(() => LS.get("todo_today", []));
  const [draft, setDraft] = useState("");
  const persist = (next) => {
    setItems(next);
    LS.set("todo_today", next);
    window.dispatchEvent(new Event("execos:data-updated"));
  };

  const add = () => {
    const t = draft.trim();
    if (!t) return;
    persist([{ id: Date.now() + Math.random(), text: t, done: false, createdAt: Date.now() }, ...items]);
    setDraft("");
  };
  const toggle = (id) => persist(items.map(i => i.id === id ? { ...i, done: !i.done } : i));
  const remove = (id) => persist(items.filter(i => i.id !== id));
  const clearDone = () => persist(items.filter(i => !i.done));

  const openCount = items.filter(i => !i.done).length;
  const doneCount = items.length - openCount;

  return (
    <div style={{ marginBottom: 16, background: T.bgSunken, border: "1px solid " + T.border, borderRadius: 4, padding: 14 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ fontFamily: FF.mono, fontSize: 10, letterSpacing: 2.4, color: T.brass, textTransform: "uppercase" }}>Todo Today</div>
          <span style={{ fontFamily: FF.mono, fontSize: 10, color: T.textDim, letterSpacing: 1, textTransform: "uppercase" }}>
            {openCount} open{doneCount > 0 ? " · " + doneCount + " done" : ""}
          </span>
        </div>
        {doneCount > 0 && (
          <button onClick={clearDone} style={{
            background: "transparent", border: "1px solid " + T.border, color: T.textDim,
            fontFamily: FF.mono, fontSize: 10, letterSpacing: 1.2, textTransform: "uppercase",
            padding: "4px 10px", cursor: "pointer", borderRadius: 2,
          }}>Clear Done</button>
        )}
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: items.length ? 10 : 0 }}>
        <input value={draft} onChange={e => setDraft(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter") add(); }}
          placeholder="Add something for today — Enter to save"
          style={{ flex: 1, background: T.bg, border: "1px solid " + T.border, color: T.text, fontFamily: FF.body, fontSize: 13, padding: "8px 12px", borderRadius: 2 }} />
        <PasteButton onPaste={(t) => setDraft(t)} label="Paste" />
        <button onClick={add} disabled={!draft.trim()}
          style={{ background: T.brass, border: "1px solid " + T.brass, color: T.bg, fontFamily: FF.mono, fontSize: 11, padding: "0 14px", cursor: draft.trim() ? "pointer" : "not-allowed", opacity: draft.trim() ? 1 : 0.4, borderRadius: 2, fontWeight: 600, letterSpacing: 1, textTransform: "uppercase" }}>Add</button>
      </div>

      {items.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          {items.map(item => (
            <div key={item.id} style={{
              display: "flex", alignItems: "center", gap: 10,
              padding: "6px 8px", borderRadius: 2,
              background: item.done ? "transparent" : T.bg,
              opacity: item.done ? 0.55 : 1,
            }}>
              <input type="checkbox" checked={item.done} onChange={() => toggle(item.id)}
                style={{ accentColor: T.brass, width: 14, height: 14, cursor: "pointer", flexShrink: 0 }} />
              <span style={{
                flex: 1, fontFamily: FF.body, fontSize: 13, color: T.text,
                textDecoration: item.done ? "line-through" : "none",
                wordBreak: "break-word",
              }}>{item.text}</span>
              <button onClick={() => remove(item.id)} title="Remove"
                style={{ background: "transparent", border: "none", color: T.textFaint, cursor: "pointer", padding: "2px 6px", fontSize: 16, lineHeight: 1, flexShrink: 0 }}>×</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

const NotesView = () => {
  const [notes, setNotes] = useState(() => LS.get("notes", []));
  const [active, setActive] = useState(null);
  const [draftTitle, setDraftTitle] = useState("");
  const [draftBody, setDraftBody] = useState("");
  const [draftProject, setDraftProject] = useState("");
  const [draftActive, setDraftActive] = useState(true);
  const [editingBody, setEditingBody] = useState(false);
  const [editBody, setEditBody] = useState("");
  const [query, setQuery] = useState("");
  const [projectFilter, setProjectFilter] = useState("");
  const [adding, setAdding] = useState(false);
  const persist = (next) => { setNotes(next); LS.set("notes", next); window.dispatchEvent(new Event("execos:data-updated")); };

  // Build distinct project list for suggestions / filter chips
  const allProjects = useMemo(() => {
    const set = new Set();
    notes.forEach(n => { if (n.project && n.project.trim()) set.add(n.project.trim()); });
    return [...set].sort();
  }, [notes]);

  const add = () => {
    const t = draftTitle.trim() || "Untitled";
    const b = draftBody.trim();
    if (!b) return;
    const note = {
      id: Date.now(),
      title: t,
      body: b,
      project: draftProject.trim() || "",
      pinned: false,
      active: draftActive,
      createdAt: Date.now(),
      updatedAt: Date.now(),
    };
    persist([note, ...notes]);
    setDraftTitle(""); setDraftBody(""); setDraftProject(""); setDraftActive(true);
    setAdding(false); setActive(note);
  };
  const remove = (id) => { persist(notes.filter(n => n.id !== id)); if (active && active.id === id) setActive(null); };
  const togglePin = (id) => persist(notes.map(n => n.id === id ? { ...n, pinned: !n.pinned, updatedAt: Date.now() } : n));
  const toggleActive = (id) => persist(notes.map(n => n.id === id ? { ...n, active: !n.active, updatedAt: Date.now() } : n));
  const updateProject = (id, project) => persist(notes.map(n => n.id === id ? { ...n, project, updatedAt: Date.now() } : n));
  const updateBody = (id, body) => persist(notes.map(n => n.id === id ? { ...n, body, updatedAt: Date.now() } : n));

  const handleFile = async (file) => {
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { alert("File too large. 2MB max for plain text. For PDFs, use copy/paste instead."); return; }
    const text = await file.text();
    setDraftTitle(file.name);
    setDraftBody(text);
    setAdding(true);
  };

  const filtered = useMemo(() => {
    let list = notes;
    if (projectFilter) {
      list = list.filter(n => (n.project || "") === projectFilter);
    }
    if (query.trim()) {
      const q = query.toLowerCase();
      list = list.filter(n => (n.title + " " + n.body + " " + (n.project || "")).toLowerCase().includes(q));
    }
    return list;
  }, [notes, query, projectFilter]);

  return (
    <div style={{ padding: 22, height: "100%", display: "flex", flexDirection: "column" }}>
      <div style={{ marginBottom: 16, display: "flex", justifyContent: "space-between", alignItems: "flex-end" }}>
        <div>
          <div style={{ fontFamily: FF.mono, fontSize: 10, letterSpacing: 2.4, color: T.brass, textTransform: "uppercase" }}>Notes & Documents</div>
          <h1 style={{ fontFamily: FF.display, fontSize: 28, fontWeight: 500, color: T.text, margin: "4px 0 0", fontStyle: "italic", letterSpacing: -0.5 }}>Reference material EXEC-OS can read.</h1>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <label style={{ background: "transparent", border: "1px solid " + T.border, color: T.text, fontFamily: FF.mono, fontSize: 11, letterSpacing: 1.4, textTransform: "uppercase", padding: "9px 14px", cursor: "pointer", borderRadius: 2, display: "inline-flex", alignItems: "center", gap: 7 }}>
            <Icon name="file" size={12} />UPLOAD .TXT/.MD
            <input type="file" accept=".txt,.md,.markdown" style={{ display: "none" }}
              onChange={e => handleFile(e.target.files?.[0])} />
          </label>
          <Btn icon="check" variant="primary" onClick={() => setAdding(true)}>New Note</Btn>
        </div>
      </div>

      <TodoToday />

      <div style={{ marginBottom: 12 }}>
        <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Search notes..."
          style={{ width: "100%", background: T.bgSunken, border: "1px solid " + T.border, color: T.text, fontFamily: FF.body, fontSize: 13, padding: "10px 14px", borderRadius: 2 }} />
      </div>

      {/* Project filter chips — tap to filter by project, tap again to clear */}
      {allProjects.length > 0 && (
        <div style={{ marginBottom: 12, display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
          <span style={{ fontFamily: FF.mono, fontSize: 9, letterSpacing: 1.4, color: T.textFaint, textTransform: "uppercase", marginRight: 4 }}>Projects:</span>
          <button onClick={() => setProjectFilter("")}
            style={{ background: projectFilter === "" ? T.brass + "22" : "transparent", border: "1px solid " + (projectFilter === "" ? T.brass : T.border), color: projectFilter === "" ? T.brass : T.textDim, fontFamily: FF.mono, fontSize: 10, letterSpacing: 1, padding: "4px 9px", borderRadius: 2, cursor: "pointer", textTransform: "uppercase" }}>All</button>
          {allProjects.map(p => (
            <button key={p} onClick={() => setProjectFilter(p === projectFilter ? "" : p)}
              style={{ background: projectFilter === p ? T.accent + "22" : "transparent", border: "1px solid " + (projectFilter === p ? T.accent : T.border), color: projectFilter === p ? T.accent : T.textDim, fontFamily: FF.mono, fontSize: 10, letterSpacing: 0.6, padding: "4px 9px", borderRadius: 2, cursor: "pointer" }}>
              {p}
            </button>
          ))}
        </div>
      )}

      <div data-grid="2col" style={{ flex: 1, display: "grid", gridTemplateColumns: "300px 1fr", gap: 14, minHeight: 0 }}>
        <Panel title={"Notes — " + filtered.length}>
          {filtered.length === 0 ? (
            <div style={{ fontFamily: FF.mono, fontSize: 10, color: T.textFaint, padding: "30px 0", textAlign: "center", letterSpacing: 1 }}>{query ? "NO MATCHES" : "NO NOTES YET"}</div>

            <div style={{ maxHeight: 500, overflowY: "auto" }}>
              {filtered.map(n => (
                <div key={n.id} onClick={() => setActive(n)}

                  placeholder="Tag with a project name"
                  style={{ flex: "1 1 220px", background: T.bgSunken, border: "1px solid " + T.borderFaint, color: T.text, fontFamily: FF.body, fontSize: 12.5, padding: "6px 10px", borderRadius: 2 }} />
                <button onClick={() => { toggleActive(active.id); setActive({ ...active, active: !active.active }); }}
                  style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "6px 10px", background: active.active ? T.green + "18" : T.bgSunken, border: "1px solid " + (active.active ? T.green : T.border), borderRadius: 2, cursor: "pointer", color: active.active ? T.green : T.textDim, fontFamily: FF.mono, fontSize: 10, letterSpacing: 1.2, textTransform: "uppercase" }}>
                  {active.active ? "✓ Active" : "Inactive"}
                </button>
                <button onClick={() => { setEditBody(active.body); setEditingBody(true); }}
                  style={{ padding: "6px 10px", background: T.bgSunken, border: "1px solid " + T.border, borderRadius: 2, cursor: "pointer", color: T.textDim, fontFamily: FF.mono, fontSize: 10, letterSpacing: 1.2, textTransform: "uppercase" }}>
                  Edit

                  <span style={{ fontFamily: FF.mono, fontSize: 10, color: T.textFaint, letterSpacing: 0.6 }}>
                    Updated {new Date(active.updatedAt).toLocaleString()}
                  </span>
                )}
              </div>
              {editingBody ? (
                <div>
                  <textarea value={editBody} onChange={e => setEditBody(e.target.value)}
                    rows={20}
                    style={{ width: "100%", background: T.bgSunken, border: "1px solid " + T.border, color: T.text, fontFamily: FF.body, fontSize: 13.5, padding: 14, borderRadius: 2, resize: "vertical", lineHeight: 1.65 }} />
                  <div style={{ marginTop: 10, display: "flex", justifyContent: "flex-end", gap: 8 }}>
                    <Btn size="sm" onClick={() => { setEditingBody(false); setEditBody(""); }}>Cancel</Btn>
                    <Btn size="sm" variant="primary" icon="check" onClick={() => {
                      updateBody(active.id, editBody);
                      setActive({ ...active, body: editBody, updatedAt: Date.now() });
                      setEditingBody(false); setEditBody("");
                    }}>Save</Btn>
                  </div>
                </div>
              ) : (
                <div style={{ maxHeight: 460, overflowY: "auto", fontFamily: FF.body, fontSize: 13.5, color: T.text, lineHeight: 1.65, whiteSpace: "pre-wrap" }}>{active.body}</div>
              )}
            </div>
          ) : (
            <div style={{ fontFamily: FF.mono, fontSize: 11, color: T.textFaint, padding: "60px 0", textAlign: "center", letterSpacing: 1 }}>SELECT A NOTE OR CREATE ONE</div>
          )}
        </Panel>
      </div>
    </div>
  );
};

// ---------- RECORDINGS VIEW (Plaud integration) ----------
// Pulls recordings from /api/plaud/list and /api/plaud/detail (Vercel routes).
// The Plaud bearer token never touches the browser — it lives in Vercel env vars.
// Site codes detected in transcripts auto-tag recordings to hospitals.

const HOSPITAL_CODE_REGEX = /\b(MWHC|MGUH|MMMC|MUMH|MHH|MGSH|MSMHC|MSMH|MNRH|MFSHC)\b/gi;
const HOSPITAL_NAME_PATTERNS = {
  MWHC: /washington hospital center/i,
  MGUH: /georgetown(?: university)?(?: hospital)?/i,
  MMMC: /montgomery medical/i,
  MUMH: /union memorial/i,
  MHH: /\bharbor hospital/i,
  MGSH: /good samaritan/i,
  MSMHC: /southern maryland/i,
  MSMH: /(?:saint|st\.?) mary['']?s/i,
  MNRH: /national rehab/i,
  MFSHC: /franklin square/i,
};

function detectSiteCodes(text) {
  if (!text) return [];
  const found = new Set();
  let m;
  HOSPITAL_CODE_REGEX.lastIndex = 0;
  while ((m = HOSPITAL_CODE_REGEX.exec(text))) found.add(m[1].toUpperCase());
  for (const [code, pattern] of Object.entries(HOSPITAL_NAME_PATTERNS)) {
    if (pattern.test(text)) found.add(code);
  }
  return [...found];
}

function fmtDuration(secs) {
  if (!secs || secs < 0) return "—";
  const s = Math.round(secs);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${sec}s`;
  return `${sec}s`;
}

function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  const now = new Date();
  const diffMs = now - d;
  const diffMin = Math.floor(diffMs / 60000);
  if (diffMin < 60) return `${diffMin}m ago`;
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return `${diffHr}h ago`;
  const diffDay = Math.floor(diffHr / 24);
  if (diffDay < 7) return `${diffDay}d ago`;
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: d.getFullYear() === now.getFullYear() ? undefined : "2-digit" });
}

const RecordingsView = ({ apiKey, model }) => {
  // One-time migration: clear out the OLD broken auto-saved default URL so existing
  // users stop hitting the 404. After this runs once, the saved URL is either empty
  // (showing setup screen) or whatever the user explicitly entered.
  useEffect(() => {
    if (LS.get("plaud_migration_v1", false)) return;
    const saved = LS.get("plaud_api_base", "");
    const BROKEN = "https://priority-task-six.vercel.app/api/plaud/list?token=xK7mP2nQ8jR4vL9wY3sB6fH1tA5dG0cZ";
    if (saved === BROKEN) {
      LS.set("plaud_api_base", "");
    }
    LS.set("plaud_migration_v1", true);
  }, []);

  // Same pattern as Dashboard — saved URL wins, otherwise use baked-in default.
  const savedPlaudBase = LS.get("plaud_api_base", "");
  const [apiBase, setApiBase] = useState(() => (savedPlaudBase && savedPlaudBase.trim()) ? savedPlaudBase : EXEC_OS_DEFAULTS.plaudListUrl);
  // Persist the default so cloud sync doesn't null it out across devices.
  useEffect(() => {
    if ((!savedPlaudBase || !savedPlaudBase.trim()) && EXEC_OS_DEFAULTS.plaudListUrl) {
      LS.set("plaud_api_base", EXEC_OS_DEFAULTS.plaudListUrl);
    }
  }, []);
  const [recordings, setRecordings] = useState(() => LS.get("plaud_recordings", []));
  // Local metadata overrides — stored separately from raw Plaud data so a fresh sync
  // never destroys user edits. Keyed by Plaud file_id.
  // Shape: { [fileId]: { title, tags: [], notes, siteCodes: [], pinned, hidden, manualSiteCodes: [] } }
  const [overrides, setOverrides] = useState(() => LS.get("plaud_overrides", {}));
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [fetchedAt, setFetchedAt] = useState(() => LS.get("plaud_fetched_at", 0));
  const [activeId, setActiveId] = useState(null);
  const [detail, setDetail] = useState(null);
  const [detailLoading, setDetailLoading] = useState(false);
  // Close detail view on global Escape
  useEffect(() => {
    const onEscape = () => { setActiveId(null); setDetail(null); };
    window.addEventListener("execos:escape", onEscape);
    return () => window.removeEventListener("execos:escape", onEscape);
  }, []);
  // Setup screen only shows if there's no saved URL AND no default. With defaults
  // baked in, this is effectively never — the list view loads immediately.
  const [editingApi, setEditingApi] = useState(!LS.get("plaud_api_base", "") && !EXEC_OS_DEFAULTS.plaudListUrl);
  const [draftApi, setDraftApi] = useState("");
  const [aiBusy, setAiBusy] = useState("");
  const [aiOutput, setAiOutput] = useState("");
  // Site Mechanical Tour — parsed JSON from the tour extraction action.
  // Held separately from aiOutput so the "File to Site" UI can render.
  // Shape: { site_code, tour_date, areas_walked[], personnel_present[], equipment{}, open_issues[], follow_ups[], raw_observations }
  const [tourData, setTourData] = useState(null);
  const [tourError, setTourError] = useState("");
  const [tourTargetSite, setTourTargetSite] = useState("");
  const [tourFileStatus, setTourFileStatus] = useState("");
  const [filter, setFilter] = useState("all"); // all | tagged | untagged | pinned | hidden
  const [siteFilter, setSiteFilter] = useState("");
  const [tagFilter, setTagFilter] = useState("");
  const [query, setQuery] = useState("");
  // Edit-mode state for detail view
  const [editingTitle, setEditingTitle] = useState(false);
  const [draftTitle, setDraftTitle] = useState("");
  const [editingNotes, setEditingNotes] = useState(false);
  const [draftNotes, setDraftNotes] = useState("");
  const [draftTagInput, setDraftTagInput] = useState("");

  const persist = (next) => {
    setRecordings(next);
    LS.set("plaud_recordings", next);
  };

  // Update or create the override row for one recording
  const updateOverride = (fileId, patch) => {
    setOverrides(prev => {
      const cur = prev[fileId] || {};
      const next = { ...prev, [fileId]: { ...cur, ...patch, updatedAt: Date.now() } };
      LS.set("plaud_overrides", next);
      return next;
    });
  };

  // Get the effective recording (raw + override merged)
  const effective = (r) => {
    const ov = overrides[r.id] || {};
    return {
      ...r,
      displayName: ov.title || r.name,
      title: ov.title || null,           // user-provided override
      tags: ov.tags || [],
      notes: ov.notes || "",
      manualSiteCodes: ov.manualSiteCodes || [],
      siteCodes: [...new Set([...(r.siteCodes || []), ...(ov.manualSiteCodes || [])])],
      pinned: !!ov.pinned,
      hidden: !!ov.hidden,
    };
  };

  const loadList = useCallback(async () => {
    if (!apiBase) return;
    setLoading(true); setError("");
    try {
      const res = await fetch(apiBase, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      const list = (data.recordings || []).map(r => ({ ...r, siteCodes: [] }));
      persist(list);
      const now = Date.now();
      setFetchedAt(now);
      LS.set("plaud_fetched_at", now);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }, [apiBase]);

  useEffect(() => {
    if (apiBase && recordings.length === 0) loadList();
  }, [apiBase]);

  const saveApi = () => {
    const u = draftApi.trim();
    if (!u) return;
    setApiBase(u);
    LS.set("plaud_api_base", u);
    setEditingApi(false);
  };

  const openRecording = async (id) => {
    setActiveId(id);
    setDetail(null);
    setAiOutput("");
    setTourData(null);
    setTourError("");
    setTourTargetSite("");
    setTourFileStatus("");
    setDetailLoading(true);
    try {
      // Derive detail URL from list URL — same base, swap path
      // Expected list URL pattern: https://.../api/plaud/list?token=XXX
      const listUrl = new URL(apiBase);
      listUrl.pathname = listUrl.pathname.replace(/\/list\/?$/, "/detail");
      listUrl.searchParams.set("id", id);
      const res = await fetch(listUrl.toString(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      // Detect site codes from transcript and summary
      const fullText = (data.transcript || "") + " " + (data.summary || "") + " " + (data.name || "");
      const siteCodes = detectSiteCodes(fullText);

      setDetail({ ...data, siteCodes });

      // Update the recording in the list with discovered tags
      if (siteCodes.length > 0) {
        const next = recordings.map(r => r.id === id ? { ...r, siteCodes } : r);
        persist(next);
      }
    } catch (e) {
      setDetail({ error: e.message });
    } finally {
      setDetailLoading(false);
    }
  };

  const runAi = async (action) => {
    if (!detail || !detail.transcript || !apiKey) return;
    setAiBusy(action.id);
    setAiOutput("");
    setTourData(null);
    setTourError("");
    setTourFileStatus("");
    try {
      // Merge user overrides into the detail object so AI prompts can reference them
      const ov = overrides[active.id] || {};
      const enriched = {
        ...detail,
        userTitle: ov.title || null,
        userNotes: ov.notes || "",
        userTags: ov.tags || [],
        userSiteCodes: ov.manualSiteCodes || [],
      };
      const out = await callClaude({
        prompt: action.prompt(enriched),
        apiKey, model,
        source: "recordings-" + action.id,
        maxTokens: action.structured ? 4000 : 2048,
      });

      if (action.structured) {
        // Strip code fences if Kera added them anyway, then locate the JSON object
        let jsonStr = out.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim();
        const firstBrace = jsonStr.indexOf("{");
        const lastBrace = jsonStr.lastIndexOf("}");
        if (firstBrace >= 0 && lastBrace > firstBrace) jsonStr = jsonStr.slice(firstBrace, lastBrace + 1);
        try {
          const parsed = JSON.parse(jsonStr);
          setTourData(parsed);
          // Pre-populate the target site dropdown using detection order:
          //   1) Kera's site_code from the transcript
          //   2) Any user-assigned site codes
          //   3) Auto-detected codes from the transcript
          const candidate = parsed.site_code
            || (enriched.userSiteCodes && enriched.userSiteCodes[0])
            || (detail.siteCodes && detail.siteCodes[0])
            || "";
          if (candidate && SITE_CODES.includes(candidate)) setTourTargetSite(candidate);
          // Keep the raw text available too in case Antoine wants to copy it
          setAiOutput(out);
        } catch (parseErr) {
          // Fall back gracefully — show the raw output and let Antoine see what came back
          setTourError("Kera didn't return valid JSON. Raw output is shown below.");
          setAiOutput(out);
        }
      } else {
        setAiOutput(out);
      }
    } catch (e) {
      setAiOutput("Error: " + e.message);
    } finally {
      setAiBusy("");
    }
  };

  // Merge tour findings into the target site profile non-destructively.
  // Existing equipment text is preserved; new findings are appended with a
  // dated header so prior context is never overwritten.
  const fileTourToSite = () => {
    if (!tourData || !tourTargetSite) { setTourFileStatus("Pick a site first."); return; }
    if (!SITE_CODES.includes(tourTargetSite)) { setTourFileStatus("Invalid site code."); return; }

    const sites = LS.get("sites", []);
    let target = sites.find(s => s.code === tourTargetSite);
    if (!target) {
      // First-time write — seed the site row
      target = { code: tourTargetSite, name: SITE_NAMES[tourTargetSite] || "", equipment: {}, temporaryEquipment: {}, vendors: {}, bas: {}, credentials: {}, openItems: "", notes: "" };
    }

    const dateStamp = tourData.tour_date || new Date().toISOString().slice(0, 10);
    const tourHeader = `[Tour ${dateStamp}]`;

    // Merge equipment fields. Append (don't overwrite) so prior intake data is preserved.
    const nextEquipment = { ...(target.equipment || {}) };
    Object.entries(tourData.equipment || {}).forEach(([key, val]) => {
      if (!val || !String(val).trim()) return;
      const existing = (nextEquipment[key] || "").trim();
      const newEntry = `${tourHeader} ${String(val).trim()}`;
      // Avoid duplicating an identical tour entry on re-file
      if (existing.includes(newEntry)) return;
      nextEquipment[key] = existing ? `${existing}\n\n${newEntry}` : newEntry;
    });

    // Same merge logic for temporary / rental equipment
    const nextTemporary = { ...(target.temporaryEquipment || {}) };
    Object.entries(tourData.temporaryEquipment || {}).forEach(([key, val]) => {
      if (!val || !String(val).trim()) return;
      const existing = (nextTemporary[key] || "").trim();
      const newEntry = `${tourHeader} ${String(val).trim()}`;
      if (existing.includes(newEntry)) return;
      nextTemporary[key] = existing ? `${existing}\n\n${newEntry}` : newEntry;
    });

    // Append open issues to openItems
    let nextOpenItems = (target.openItems || "").trim();
    const issues = (tourData.open_issues || []).filter(Boolean);
    if (issues.length) {
      const issueBlock = `${tourHeader} Open issues from tour:\n${issues.map(i => "  - " + i).join("\n")}`;
      if (!nextOpenItems.includes(issueBlock)) {
        nextOpenItems = nextOpenItems ? `${nextOpenItems}\n\n${issueBlock}` : issueBlock;
      }
    }

    // Append everything else (areas, personnel, follow-ups, raw observations) to notes
    let nextNotes = (target.notes || "").trim();
    const noteLines = [];
    if (tourData.areas_walked && tourData.areas_walked.length) noteLines.push(`Areas walked: ${tourData.areas_walked.join(", ")}`);
    if (tourData.personnel_present && tourData.personnel_present.length) noteLines.push(`Personnel present: ${tourData.personnel_present.join(", ")}`);
    if (tourData.follow_ups && tourData.follow_ups.length) {
      noteLines.push("Follow-ups:");
      tourData.follow_ups.forEach(f => noteLines.push("  - " + f));
    }
    if (tourData.raw_observations && String(tourData.raw_observations).trim()) {
      noteLines.push(`Raw observations: ${tourData.raw_observations}`);
    }
    if (noteLines.length) {
      const noteBlock = `${tourHeader} Mechanical tour\n${noteLines.join("\n")}`;
      if (!nextNotes.includes(noteBlock)) {
        nextNotes = nextNotes ? `${nextNotes}\n\n${noteBlock}` : noteBlock;
      }
    }

    const updated = {
      ...target,
      name: target.name || SITE_NAMES[tourTargetSite] || "",
      equipment: nextEquipment,
      temporaryEquipment: nextTemporary,
      openItems: nextOpenItems,
      notes: nextNotes,
      updatedAt: Date.now(),
    };

    // Write back. If the site row didn't exist, append it.
    let nextSites;
    if (sites.find(s => s.code === tourTargetSite)) {
      nextSites = sites.map(s => s.code === tourTargetSite ? updated : s);
    } else {
      nextSites = [...sites, updated];
    }
    LS.set("sites", nextSites);

    // Tag the recording with the site code so it's findable later
    if (active && active.id) {
      const cur = overrides[active.id] || {};
      const curSites = cur.manualSiteCodes || [];
      if (!curSites.includes(tourTargetSite)) {
        const nextOv = { ...overrides, [active.id]: { ...cur, manualSiteCodes: [...curSites, tourTargetSite] } };
        setOverrides(nextOv);
        LS.set("plaud_overrides", nextOv);
      }
    }

    const filed = Object.values(nextEquipment).filter(Boolean).length + Object.values(nextTemporary).filter(Boolean).length;

  const AI_ACTIONS = [

Use this exact schema:

{

  "tour_date": "YYYY-MM-DD or null",

    "medAirCompressors":  "free-text inventory — count, make/model, condition",
    "vacuumPumps":        "free-text inventory — count, make/model, condition",
    "upsSystems":         "free-text inventory — count, kVA rating, condition",
    "heatExchangers":     "free-text inventory — count, application, condition"
  },
  "temporaryEquipment": {
    "tempBoilers":        "rental boilers on-site — vendor, capacity, on-site dates, cost if mentioned, reason (e.g. supplementing B3 during retube). Empty string if none.",

  "follow_ups":      ["specific actions Antoine flagged for follow-up"],

RULES:

- For each populated category, write tight executive prose (not lists). Example: "3 Trane CenTraVac, 1200 tons each, R-134a, all in service; lead chiller showing 38% load on tour."

- Do not invent equipment. If Antoine didn't mention boilers, return "" for boilers.

TRANSCRIPT:
${d.transcript.slice(0, 16000)}` },

        (r.tags || []).join(" "),

        </div>
      )}

// Lookup contacts for a given site code. Returns empty array if site has no entries.
function getSiteContacts(code) {
  if (!code || !HOSPITAL_DIRECTORY.sites) return [];
  return HOSPITAL_DIRECTORY.sites[code] || [];
}

// Returns [directors, assistantDirectors, others] for a site
function splitSiteContacts(code) {
  const contacts = getSiteContacts(code);
  const directors = contacts.filter(c => /Facilities Director$|^Director\b/i.test(c.position || ""));
  const ads = contacts.filter(c => /Assistant Director|\(AD\)|Senior Assistant Director|Sr AD|- AD\b/i.test(c.position || ""));
  const seen = new Set([...directors.map(c => c.name), ...ads.map(c => c.name)]);
  const others = contacts.filter(c => !seen.has(c.name));
  return [directors, ads, others];
}

});

function getOrInitSites() {
  const stored = LS.get("sites", null);
  if (stored && stored.length) {
    // Migrate older site rows that predate the temporaryEquipment block.
    // Without this, existing users would see undefined errors when rendering.
    let migrated = false;
    const next = stored.map(s => {
      if (!s.temporaryEquipment) {
        migrated = true;
        return { ...s, temporaryEquipment: { tempBoilers: "", tempChillers: "", tempCoolingTowers: "", tempGenerators: "" } };
      }
      return s;
    });
    if (migrated) LS.set("sites", next);
    return next;
  }
  const seeded = SITE_CODES.map(EMPTY_SITE);
  LS.set("sites", seeded);
  return seeded;
}

function formatSiteForContext(s, includeCredentials = false) {
  const lines = [];
  lines.push(`## ${s.code} — ${s.name || "[name TBD]"}`);
  if (s.location) lines.push(`Location: ${s.location}`);
  if (s.director) lines.push(`Director: ${s.director}`);
  lines.push(`Status: ${s.status?.toUpperCase() || "OK"}`);

  const equipLines = Object.entries(s.equipment || {}).filter(([k, v]) => v && v !== "").map(([k, v]) => `  - ${k}: ${v}`);
  if (equipLines.length) { lines.push("Equipment:"); lines.push(...equipLines); }

  // Temporary equipment surfaces with a clear marker so Kera weighs it as
  // active/transient (relevant for emergency event briefings, summer cooling
  // readiness, outage planning).
  const tempLines = Object.entries(s.temporaryEquipment || {}).filter(([k, v]) => v && v !== "").map(([k, v]) => `  - ${k}: ${v}`);
  if (tempLines.length) { lines.push("Temporary / Rental Equipment on-site:"); lines.push(...tempLines); }

  const vendorLines = Object.entries(s.vendors || {}).filter(([k, v]) => v && v !== "").map(([k, v]) => `  - ${k}: ${v}`);
  if (vendorLines.length) { lines.push("Vendors:"); lines.push(...vendorLines); }

  const basLines = Object.entries(s.bas || {}).filter(([k, v]) => v && v !== "").map(([k, v]) => `  - ${k}: ${v}`);
  if (basLines.length) { lines.push("BAS:"); lines.push(...basLines); }

  if (includeCredentials) {
    const credLines = Object.entries(s.credentials || {}).filter(([k, v]) => v && v !== "").map(([k, v]) => `  - ${k}: ${v}`);
    if (credLines.length) { lines.push("Credentials (sensitive):"); lines.push(...credLines); }
  }

  if (s.openItems) lines.push(`Open Items: ${s.openItems}`);
  if (s.notes) lines.push(`Notes: ${s.notes}`);
  return lines.join("\n");
}

function sitePercentComplete(s) {
  let total = 0, filled = 0;
  const sections = ["equipment", "vendors", "bas", "credentials"];
  for (const sec of sections) {
    const obj = s[sec] || {};
    for (const k of Object.keys(obj)) { total++; if (obj[k] && obj[k] !== "") filled++; }
  }
  if (s.name) filled++; if (s.location) filled++; if (s.director) filled++;
  total += 3;
  return Math.round((filled / total) * 100);
}

// ---------- SITES VIEW ----------
const SitesView = ({ apiKey, model }) => {
  const [sites, setSites] = useState(() => getOrInitSites());
  const [activeCode, setActiveCode] = useState(null);
  const [showCreds, setShowCreds] = useState(false);
  const [parsing, setParsing] = useState(false);
  const [pasteOpen, setPasteOpen] = useState(false);
  const [pasteText, setPasteText] = useState("");
  const [pasteError, setPasteError] = useState("");
  const [uploadedImages, setUploadedImages] = useState([]);
  const fileInputRef = useRef(null);
  const cameraInputRef = useRef(null);

  const persist = (next) => { setSites(next); LS.set("sites", next); };
  const updateActive = (mutator) => {
    persist(sites.map(s => s.code === activeCode ? { ...mutator(s), updatedAt: Date.now() } : s));
  };
  const active = sites.find(s => s.code === activeCode);

  // Compress and convert image to base64. Resizes large photos to 1600px max edge
  // for faster upload, smaller cost, and to stay under Anthropic's 5MB limit.
  const fileToBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1600;
        let w = img.width, h = img.height;
        if (Math.max(w, h) > MAX) {
          const scale = MAX / Math.max(w, h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
        const comma = dataUrl.indexOf(",");
        resolve({
          name: file.name,
          mediaType: "image/jpeg",
          data: dataUrl.slice(comma + 1),
          dataUrl,
          width: w,
          height: h,
          size: Math.round(dataUrl.length * 0.75),
        });
      };
      img.onerror = () => reject(new Error("Couldn't decode image " + file.name));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Couldn't read file " + file.name));
    reader.readAsDataURL(file);
  });

  const handleFiles = async (fileList) => {
    if (!fileList || !fileList.length) return;
    setPasteError("");
    const accepted = [];
    for (const f of Array.from(fileList)) {
      if (!/^image\//.test(f.type)) {
        setPasteError(`"${f.name}" isn't an image. Photos only (JPEG, PNG, HEIC, WebP).`);
        continue;
      }
      try {
        const img = await fileToBase64(f);
        accepted.push(img);
      } catch (e) {
        setPasteError(e.message || "Couldn't read " + f.name);
      }
    }
    if (accepted.length) setUploadedImages(prev => [...prev, ...accepted].slice(0, 6));
  };

  const onPickFiles = (e) => {
    handleFiles(e.target.files);
    if (e.target) e.target.value = "";
  };

  const removeImage = (i) => setUploadedImages(prev => prev.filter((_, idx) => idx !== i));

  const closePaste = () => {
    setPasteOpen(false);
    setPasteText("");
    setPasteError("");
    setUploadedImages([]);
  };

  const parseAndApply = async () => {
    const hasText = pasteText.trim().length > 0;
    const hasImages = uploadedImages.length > 0;
    if (!hasText && !hasImages) return;
    if (parsing) return;
    setParsing(true); setPasteError("");
    try {
      let prompt = SITE_PARSER_PROMPT;
      if (hasImages && !hasText) {
        prompt += "(The source is one or more photos of a filled-in director intake form attached to this message. Read every visible field on the form. Where the same field appears in multiple photos, use the most legible version. Output the JSON object only.)";
      } else if (hasImages && hasText) {
        prompt += "\n[Photos of the intake form are attached. The pasted text below is supplementary — use the photos as the primary source and the text to disambiguate or fill gaps.]\n\nADDITIONAL TEXT:\n" + pasteText;
      } else {
        prompt += pasteText;
      }

      const reply = await callClaude({
        prompt,
        apiKey, model, source: "sites-parser",
        history: [],
        images: hasImages ? uploadedImages : null,
        maxTokens: 3000,
      });

      let jsonStr = reply.trim();
      const fenceMatch = jsonStr.match(/```(?:json)?\s*([\s\S]+?)```/);
      if (fenceMatch) jsonStr = fenceMatch[1].trim();
      const firstBrace = jsonStr.indexOf("{");
      const lastBrace = jsonStr.lastIndexOf("}");
      if (firstBrace >= 0 && lastBrace > firstBrace) jsonStr = jsonStr.slice(firstBrace, lastBrace + 1);

      const parsed = JSON.parse(jsonStr);
      if (!parsed.code || !SITE_CODES.includes(parsed.code)) {
        throw new Error("Couldn't identify a valid site code. Got: " + (parsed.code || "(none)") + ". Check that the form shows the hospital name or code clearly.");
      }
      const existing = sites.find(s => s.code === parsed.code) || EMPTY_SITE(parsed.code);
      const merged = {
        ...existing,
        ...parsed,
        equipment: { ...existing.equipment, ...(parsed.equipment || {}) },
        temporaryEquipment: { ...(existing.temporaryEquipment || {}), ...(parsed.temporaryEquipment || {}) },
        vendors: { ...existing.vendors, ...(parsed.vendors || {}) },
        bas: { ...existing.bas, ...(parsed.bas || {}) },
        credentials: { ...existing.credentials, ...(parsed.credentials || {}) },
        updatedAt: Date.now(),
      };
      persist(sites.map(s => s.code === merged.code ? merged : s));
      setActiveCode(merged.code);
      closePaste();
    } catch (e) {
      setPasteError(e.message);
    } finally {
      setParsing(false);
    }
  };

  if (active) {
    return <SiteDetail site={active} onBack={() => setActiveCode(null)}
      update={updateActive} showCreds={showCreds} setShowCreds={setShowCreds} />;
  }

  return (
    <div style={{ padding: 22 }}>
      {/* Hidden file inputs — triggered by the buttons below */}
      <input ref={fileInputRef} type="file" accept="image/*" multiple onChange={onPickFiles} style={{ display: "none" }} />
      <input ref={cameraInputRef} type="file" accept="image/*" capture="environment" onChange={onPickFiles} style={{ display: "none" }} />

      <div style={{ marginBottom: 20, display: "flex", justifyContent: "space-between", alignItems: "flex-end", gap: 12, flexWrap: "wrap" }}>
        <div>
          <div style={{ fontFamily: FF.mono, fontSize: 10, letterSpacing: 2.4, color: T.accent, textTransform: "uppercase" }}>Portfolio Sites</div>
          <h1 style={{ fontFamily: FF.body, fontSize: 22, fontWeight: 600, color: T.text, margin: "4px 0 0", letterSpacing: -0.3 }}>10 hospitals. One operational picture.</h1>
        </div>
        <Btn icon="spark" variant="primary" onClick={() => setPasteOpen(true)}>Add Site Profile</Btn>
      </div>

      {pasteOpen && (
        <Panel title="Add Site Profile — AI Parser" subtitle="Photos or pasted text" action={
          <Btn size="sm" variant="ghost" onClick={closePaste}>Cancel</Btn>
        }>
          <div style={{ ...TS.body, color: T.textDim, marginBottom: S.lg, lineHeight: 1.55 }}>
            Snap photos of a filled-in director intake form (one form, multiple pages OK), or paste the text. Claude reads the source and fills the site profile. Always review the result before relying on it.
          </div>

          {/* Photo upload area */}
          <div style={{
            border: "1px dashed " + T.border,
            borderRadius: 4,
            padding: S.xl,
            display: "flex",
            flexDirection: "column",
            gap: S.md,
            background: T.bgSunken,
            marginBottom: S.lg,
          }}>
            <div style={{ display: "flex", gap: S.md, flexWrap: "wrap" }}>
              <Btn icon="spark" variant="soft" onClick={() => cameraInputRef.current?.click()}>📷 Take Photo</Btn>
              <Btn icon="file" variant="soft" onClick={() => fileInputRef.current?.click()}>📁 Choose Photos</Btn>
              <div style={{ flex: 1 }} />
              {uploadedImages.length > 0 && (
                <span style={{ ...TS.micro, color: T.textDim, fontFamily: FF.mono, alignSelf: "center" }}>
                  {uploadedImages.length} / 6 photo{uploadedImages.length === 1 ? "" : "s"}
                </span>
              )}
            </div>

            {uploadedImages.length > 0 && (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(120px, 1fr))", gap: S.md, marginTop: S.sm }}>
                {uploadedImages.map((img, i) => (
                  <div key={i} style={{ position: "relative", aspectRatio: "3/4", borderRadius: 3, overflow: "hidden", border: "1px solid " + T.border, background: "#000" }}>
                    <img src={img.dataUrl} alt={img.name}
                      style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />

    </div>

const SiteField = ({ label, value, onChange, mono = false, secret = false, type = "text" }) => {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(value || "");
  useEffect(() => { setDraft(value || ""); }, [value]);
  const display = (value || "").trim();
  const isEmpty = !display;
  const inputType = secret && !editing ? "password" : type;

  if (!editing) {
    return (
      <div onClick={() => setEditing(true)}
        style={{ padding: "8px 10px", border: "1px solid " + T.border, background: T.bgSunken, borderRadius: 2, cursor: "pointer", minHeight: 36, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
        <div style={{ flex: 1, fontFamily: mono ? FF.mono : FF.body, fontSize: 12.5, color: isEmpty ? T.textFaint : T.text, fontStyle: isEmpty ? "italic" : "normal", wordBreak: "break-word" }}>
          {isEmpty ? "(empty — click to add)" : (secret ? "••••••••" : display)}
        </div>
        {isEmpty && <span style={{ fontFamily: FF.mono, fontSize: 8, color: T.amber, letterSpacing: 1, padding: "2px 5px", border: "1px solid " + T.amber + "44", borderRadius: 2 }}>TBD</span>}
      </div>
    );
  }
  return (
    <input value={draft} autoFocus type={type === "textarea" ? "text" : type}
      onChange={e => setDraft(e.target.value)}
      onBlur={() => { onChange(draft); setEditing(false); }}
      onKeyDown={e => { if (e.key === "Enter") { onChange(draft); setEditing(false); } if (e.key === "Escape") { setDraft(value || ""); setEditing(false); } }}
      style={{ width: "100%", background: T.surface, border: "1px solid " + T.brass, color: T.text, fontFamily: mono ? FF.mono : FF.body, fontSize: 12.5, padding: "7px 10px", borderRadius: 2, boxSizing: "border-box" }} />
  );
};
