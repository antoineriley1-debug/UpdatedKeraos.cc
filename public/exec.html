</script>
<style>
  :root {
    --bg: #0a0908; --bg-raised: #13110f; --bg-sunken: #070605; --surface: #181513;
    --border: #2a2520; --border-bright: #3a342c;
    --text: #f4ede0; --text-dim: #9a9088; --text-faint: #5c554d;
    --brass: #c9a256; --cyan: #6dbed6; --red: #d96b5c; --green: #7fa86b; --amber: #e3b04b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  #root { height: 100vh; height: 100dvh; }
  @keyframes execspin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes execos-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes execos-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.7; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .spin { animation: execspin 0.9s linear infinite; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-sunken); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-bright); }
  button:focus, input:focus, textarea:focus { outline: none; }
  textarea, input { font-family: inherit; }

  /* ============================================================
     MOBILE RESPONSIVE LAYER
     Activated when body has class "mobile-view" (set via JS useViewport hook).
     Uses high specificity + !important to override inline styles where needed.
     ============================================================ */

  /* Touch target sizing — Apple HIG min 44px, Material 48dp */
  body.mobile-view button { min-height: 44px; min-width: 36px; }
  body.mobile-view button[data-nav] { min-height: 48px; }
  /* Tiny chip-style buttons keep their compact look but pad up for tappability */
  body.mobile-view button[style*="font-size: 9"],
  body.mobile-view button[style*="font-size: 10"] { padding-top: 8px !important; padding-bottom: 8px !important; }

  /* Sidebar — hidden by default on mobile, slides in as overlay when open */
  body.mobile-view #execos-sidebar {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    bottom: 0 !important;
    width: 240px !important;
    z-index: 200 !important;
    transform: translateX(-100%);
    transition: transform 0.22s ease;
    box-shadow: 4px 0 24px rgba(0,0,0,0.5);
  }
  body.mobile-view.sidebar-open #execos-sidebar {
    transform: translateX(0);
  }
  body.mobile-view #execos-sidebar-backdrop {
    display: block;
  }
  body.mobile-view.sidebar-open #execos-sidebar-backdrop {
    opacity: 1; pointer-events: auto;
  }
  #execos-sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 150;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  body.mobile-view #execos-hamburger { display: inline-flex !important; }

  /* Main content fills viewport on mobile */
  /* App root: use 100dvh on supported browsers to fix iOS Safari's 100vh bug
     (where 100vh includes area behind the URL bar, pushing content above the
     visible viewport). 100vh stays as the fallback for older browsers. */
  .execos-app-root {
    height: 100vh;
    height: 100dvh;
  }

  body.mobile-view #execos-main { padding: 14px !important; padding-bottom: max(14px, env(safe-area-inset-bottom)) !important; }

  /* Stack 2/3-column grids vertically on mobile via attribute selector */
  body.mobile-view [data-grid="2col"],
  body.mobile-view [data-grid="3col"],
  body.mobile-view [data-grid="dash-split"] {
    grid-template-columns: 1fr !important;
  }

  /* Notes view: when adding a new note on mobile, hide the list panel so the
     form gets full attention. The list returns when the user cancels or saves.
     Targets the first child of [data-notes-grid] (the "Notes — N" list panel). */
  body.mobile-view.notes-adding [data-notes-grid] > *:first-child {
    display: none !important;
  }

  /* Sticky Save row inside Add Note form on mobile — keeps Save reachable
     without endless scrolling. position: sticky on the row pins it at the
     bottom of #execos-main's scroll container. Backdrop ensures it's not
     transparent when content sits underneath. */
  body.mobile-view [data-sticky-save] {
    position: sticky !important;
    bottom: max(0px, env(safe-area-inset-bottom)) !important;
    background: linear-gradient(to top, rgba(13,18,25,0.98) 0%, rgba(13,18,25,0.92) 70%, rgba(13,18,25,0) 100%) !important;
    padding: 14px 0 max(12px, env(safe-area-inset-bottom)) 0 !important;
    margin-top: 12px !important;
    z-index: 5 !important;
  }
  /* Larger tap targets for Save/Cancel buttons in the sticky row */
  body.mobile-view [data-sticky-save] button {
    min-height: 44px !important;
    padding-left: 18px !important;
    padding-right: 18px !important;
  }

  /* Modals — go near-fullscreen on mobile */
  body.mobile-view [data-modal] {
    width: 100% !important;
    max-width: 100% !important;
    max-height: 100vh !important;
    border-radius: 0 !important;
    border: none !important;
  }
  body.mobile-view [data-modal-backdrop] {
    padding: 0 !important;
    align-items: stretch !important;
  }

  /* Top bar — denser on mobile. The topbar lives OUTSIDE the scroll container
     (#execos-main is what scrolls), so it stays pinned at top of the root flex
     column automatically. The 100dvh on .execos-app-root above prevents iOS
     Safari's 100vh bug from pushing this above the visible viewport. */
  body.mobile-view #execos-topbar {
    padding: 10px 12px !important;
    gap: 8px !important;
  }
  body.mobile-view #execos-topbar [data-topbar-search] { display: none !important; }
  body.mobile-view #execos-topbar [data-topbar-clock] { display: none !important; }
  /* Tighten status cluster gap + remove its left padding/border on mobile */
  body.mobile-view #execos-topbar [data-topbar-status] {
    gap: 8px !important;
    padding-left: 0 !important;
    border-left: none !important;
  }
  /* Hide the OFFLINE/sync dot on mobile to free up space — the API dot and USE chip are what matter */
  body.mobile-view #execos-topbar [data-topbar-status] > div:first-child { display: none !important; }
  /* Ensure gear button doesn't get pushed off-screen */
  body.mobile-view #execos-topbar > button:last-child { flex-shrink: 0; margin-left: auto; }

  /* Contracts: stack input + investigation result columns vertically on phones AND tablets
     (anything below 1100px viewport). The grid is 1fr/1.4fr on desktop. Without these
     overrides, content inside the right column (long unbroken strings, headings, panels)
     can force the column wider than the viewport — the screenshots Antoine sent on iPad
     showed the right column extending past the right edge of the screen because the
     children's intrinsic width wasn't being clamped. */
  body.mobile-view [data-contracts-grid],
  body.mobile-view [data-contracts-compare-grid] {
    grid-template-columns: minmax(0, 1fr) !important;
  }
  /* Apply child width clamps UNIVERSALLY, not just on mobile-view — this stops the
     children from blowing past the grid track width on any viewport. */
  [data-contracts-grid] > *,
  [data-contracts-compare-grid] > * {
    min-width: 0;
    max-width: 100%;
  }
  /* Mid-size tablet / landscape phone: still 2-column desktop layout breaks below 1100px.

  @media (max-width: 1099px) {
    [data-contracts-grid],
    [data-contracts-compare-grid] {
      grid-template-columns: minmax(0, 1fr) !important;
    }
  }

  /* Typography — slight downscale on phones (keep on tablets) */
  @media (max-width: 480px) {
    body.mobile-view { font-size: 14px; }
    body.mobile-view h1 { font-size: 22px !important; }
    body.mobile-view h2 { font-size: 17px !important; }

  body.mobile-view [data-cal-toolbar] {

  body.mobile-view [data-cal-filters] {

  }
  body.mobile-view [data-cal-view-toggle] {

  body.mobile-view table { display: block; overflow-x: auto; white-space: nowrap; }

  /* Dashboard task row — column collapsing */
  body.mobile-view [data-dash-task-meta] {
    flex-wrap: wrap !important;

  body.mobile-view, body.mobile-view #root { overflow-x: hidden; }

3. **Surface content** — what is literally being said, point by point
4. **Subtext** — what is being implied, avoided, hinted at, or left unsaid. Read between the lines. Tone, hedging, escalation cues.
5. **Commitments made** — by whom, what, by when (cite the words if possible)
6. **Asks / Demands** — what is being requested of Antoine or of others
7. **Risks / Liabilities** — operational, financial, regulatory, reputational
8. **Key players** — anyone named, their role, and their position in the thread
9. **Evidence / Numbers / Dates** — anything specific worth flagging
10. **Open questions** — what is NOT answered that should be
